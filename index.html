    };
    active={key,stop};
  };
  onLeave(()=>Object.values(answers).forEach(a=>a.url&&URL.revokeObjectURL(a.url)));
  draw();
}

/* =========================================================
   WRITING · CEFR-based checker (+ LanguageTool)
   ========================================================= */
/*ANALYSIS-START*/
const LINKERS={
  B1:["because","so","but","also","firstly","secondly","finally","for example","in conclusion","in my opinion","however","then","after that","too","as well"],
  B2:["although","whereas","while","therefore","moreover","furthermore","in addition","on the other hand","as a result","for instance","in contrast","despite","in spite of","overall","on the whole","such as","unless","consequently","even though","in fact","as long as"],
  C1:["nevertheless","nonetheless","thus","hence","whereby","notwithstanding","conversely","by contrast","to some extent","admittedly","in light of","given that","provided that","insofar as","albeit","paradoxically","that said","having said that","not only","to a large extent","it could be argued"]
};
const BASIC_WORDS=["very","good","bad","thing","things","lot","big","nice","stuff","get","got","really"];
function analyseEssay(text,opts){
  opts=opts||{};
  const lvl=i=>["A2","B1","B2","C1"][Math.max(0,Math.min(3,i))];
  const raw=String(text||"");
  const tokens=(raw.match(/[A-Za-z]+(?:['’][A-Za-z]+)?/g)||[]);
  const words=tokens.length;
  const lower=tokens.map(t=>t.toLowerCase().replace(/’/g,"'"));
  const paras=raw.split(/\n+/).map(p=>p.trim()).filter(p=>(p.match(/[A-Za-z]+/g)||[]).length>=5);
  const sentences=raw.replace(/\n+/g," ").split(/(?<=[.!?])\s+/).map(s=>s.trim()).filter(s=>(s.match(/[A-Za-z]+/g)||[]).length>=3);
  const sl=sentences.map(s=>(s.match(/[A-Za-z]+/g)||[]).length);
  const avgLen=sl.length?sl.reduce((a,b)=>a+b,0)/sl.length:0;
  const sdLen=sl.length?Math.sqrt(sl.reduce((a,b)=>a+(b-avgLen)**2,0)/sl.length):0;
  const first=lower.slice(0,150); const ttr=first.length?new Set(first).size/first.length:0;
  const longRatio=words?lower.filter(w=>w.length>=8).length/words:0;
  const lc=" "+lower.join(" ")+" ";
  const count=ph=>{const m=lc.match(new RegExp("\\s"+ph.replace(/ /g,"\\s")+"\\s","g"));return m?m.length:0;};
  const linkers={B1:[],B2:[],C1:[]}; const linkerCounts={};
  for(const L of ["B1","B2","C1"]) for(const ph of LINKERS[L]){ const c=count(ph); if(c){ linkers[L].push(ph); linkerCounts[ph]=c; } }
  const overusedLinkers=Object.entries(linkerCounts).filter(([k,c])=>c>=4&&!["and","but","so","also"].includes(k)).map(([k])=>k);
  const sentText=raw.replace(/\n+/g," ");
  const sub=(sentText.match(/\b(although|though|while|whereas|because|since|unless|if|when|whenever|once|until|so that|in order to|as long as|provided that|even if|even though)\b/gi)||[]).length;
  const rel=(sentText.match(/\b(which|who|whom|whose)\b/gi)||[]).length;
  const passive=(sentText.match(/\b(am|is|are|was|were|be|been|being)\s+(?:\w+ly\s+)?\w+(?:ed|en|wn|lt|pt|ght|ne)\b/gi)||[]).length;
  const perfect=(sentText.match(/\b(has|have|had)\s+(?:\w+ly\s+)?(?:been|\w+(?:ed|en|wn|lt|pt|ght|ne|un))\b/gi)||[]).length;
  const modal=(sentText.match(/\b(would|could|might|should|may|must)\b/gi)||[]).length;
  const cplx=sentences.length?(sub+rel+passive+0.5*perfect+0.5*modal)/sentences.length:0;
  const topic=[];
  for(const w of (opts.unitWords||[])){
    const forms=[w.word,...(w.fam||[]).map(f=>f.replace(/\s*\(.*\)\s*/,""))].map(f=>f.toLowerCase());
    const hit=forms.some(f=>{ const stem=f.length>5?f.slice(0,f.length-1):f; return lower.some(t=>t===f||t.startsWith(stem)&&t.length<=f.length+3); });
    if(hit) topic.push(w.word);
  }
  const basic=lower.filter(w=>BASIC_WORDS.includes(w)).length; const basicPer100=words?basic/words*100:0;
  // LanguageTool
  let lt=null;
  if(opts.lt){ const m=opts.lt; const cat=x=>{const c=(x.rule&&x.rule.category&&x.rule.category.id)||"",t=(x.rule&&x.rule.issueType)||""; if(c==="TYPOS"||t==="misspelling") return "spelling"; if(["PUNCTUATION","TYPOGRAPHY","CASING"].includes(c)||t==="typographical"||t==="whitespace") return "punctuation"; if(["STYLE","REDUNDANCY","PLAIN_ENGLISH"].includes(c)||t==="style") return "style"; return "grammar";};
    lt={grammar:0,spelling:0,punctuation:0,style:0}; m.forEach(x=>{lt[cat(x)]++;}); lt.matches=m.map(x=>Object.assign({},x,{kind:cat(x)}));

  const R={TR:[],CC:[],LR:[],GRA:[]}, tips={TR:[],CC:[],LR:[],GRA:[]};
  // Task response
  const target=opts.target||250;
  const capW=words<120?0:words<180?1:words<250?2:3;
  const checks=opts.checks==null?null:opts.checks;
  const chkL=checks==null?2:checks>=5?3:checks>=4?2:checks>=3?1:0;
  const TR=Math.min(capW,chkL);
  R.TR.push(`${words} words (IELTS minimum 250${target!==250?`, your target ${target}`:""}).`);
  if(words<250) tips.TR.push("Under 250 words loses marks in the exam. Develop each body paragraph with one more example or explanation.");
  if(checks!=null) R.TR.push(`You confirmed ${checks} of 5 task checks.`);
  if(checks!=null&&checks<5) tips.TR.push("Look again at the checks you couldn’t tick. Task response is often the quickest criterion to improve.");
  // Coherence & cohesion
  const pL=paras.length>=4?3:paras.length===3?2:paras.length===2?1:0;
  const dB2=linkers.B2.length+linkers.C1.length;
  let lkL=linkers.C1.length>=2&&dB2>=4?3:dB2>=3?2:(linkers.B1.length+dB2)>=3?1:0;
  if(overusedLinkers.length) lkL=Math.max(0,lkL-1);
  const CC=Math.min(pL,lkL);
  R.CC.push(`${paras.length} paragraph${paras.length===1?"":"s"}.`);
  R.CC.push(`Linking words: ${[...linkers.C1,...linkers.B2,...linkers.B1].slice(0,10).join(", ")||"none found"}.`);
  if(paras.length<4) tips.CC.push("Use four or five paragraphs: introduction, two or three body paragraphs and a conclusion, separated by blank lines.");
  if(overusedLinkers.length) tips.CC.push(`You repeat “${overusedLinkers.join("”, “")}” a lot. Vary your linking.`);
  if(lkL<2) tips.CC.push("Add B2 linkers such as however, whereas, as a result, on the other hand.");
  else if(lkL<3) tips.CC.push("For C1, try nevertheless, to some extent, given that, having said that.");
  // Lexical resource
  const ttrL=ttr>=0.64?3:ttr>=0.57?2:ttr>=0.5?1:0;
  const longL=longRatio>=0.17?3:longRatio>=0.12?2:longRatio>=0.08?1:0;
  const topL=topic.length>=5?3:topic.length>=3?2:topic.length>=1?1:0;
  let rangeL=Math.round((ttrL+longL+topL)/3);
  if(basicPer100>3) rangeL=Math.max(0,rangeL-1);
  let LR=rangeL;
  if(lt){ const spL=lt.sPer100<=0.5?3:lt.sPer100<=1.5?2:lt.sPer100<=3?1:0; LR=Math.floor((rangeL+spL)/2); R.LR.push(`${lt.spelling} spelling error${lt.spelling===1?"":"s"}.`); if(spL<2) tips.LR.push("Check spelling carefully. Frequent errors pull Lexical Resource down."); }
  else R.LR.push("Spelling wasn’t checked (grammar service offline).");
  R.LR.push(`Variety of words: ${Math.round(ttr*100)}% different in the first 150 words.`);
  R.LR.push(topic.length?`Topic words used: ${topic.join(", ")}.`:"No words from this unit’s list.");
  if(topL<2) tips.LR.push("Use more topic vocabulary from this unit, for example: "+(opts.unitWords||[]).slice(8,12).map(w=>w.word).join(", ")+".");
  if(basicPer100>3) tips.LR.push("You often use very general words (very, good, bad, thing, a lot). Replace some with more precise ones.");
  // Grammar
  const cxL=cplx>=0.9?3:cplx>=0.55?2:cplx>=0.3?1:0;
  let GRA=cxL;
  R.GRA.push(`Average sentence: ${avgLen.toFixed(1)} words. Complex structures per sentence: ${cplx.toFixed(2)}.`);
  if(lt){ const acL=lt.gPer100<=1?3:lt.gPer100<=2.5?2:lt.gPer100<=5?1:0; GRA=Math.floor((cxL+acL)/2); R.GRA.push(`${lt.grammar} grammar and ${lt.punctuation} punctuation issue${lt.grammar+lt.punctuation===1?"":"s"} found.`); if(acL<2) tips.GRA.push("Accuracy is holding your score back. Fix the highlighted errors, then check your verb forms and articles."); }
  else R.GRA.push("Accuracy wasn’t checked (grammar service offline).");
  if(cxL<2) tips.GRA.push("Mix in complex sentences: relative clauses (which, who), conditionals (if … would) and the passive (has been transformed).");
  if(sdLen<4&&sentences.length>4) tips.GRA.push("Your sentences are all a similar length. Vary short and long sentences.");
  const levels={TR,CC,LR,GRA};
  const overall=Math.floor((TR+CC+LR+GRA)/4+0.25);
  return {words,paras:paras.length,sentences:sentences.length,avgLen,sdLen,ttr,longRatio,linkers,topic,cplx,lt,levels:Object.fromEntries(Object.entries(levels).map(([k,v])=>[k,lvl(v)])),overall:lvl(overall),reasons:R,tips,measuredAccuracy:!!lt};
}
/*ANALYSIS-END*/
async function languageTool(text){
  const cfg=CONFIG.languageTool||{}; if(!cfg.url) throw new Error("not configured");
  const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),15000);
  try{
    const r=await fetch(cfg.url,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({text,language:cfg.language||"en-GB",enabledOnly:"false"}),signal:ctl.signal});
    if(!r.ok) throw new Error("LanguageTool returned "+r.status);
    const j=await r.json();
    return (j.matches||[]).filter(m=>!/QUOTES|WHITESPACE|DASH_RULE|ENGLISH_WORD_REPEAT_BEGINNING/.test((m.rule&&m.rule.id)||""));
  } finally { clearTimeout(to); }
}

      <div class="row between"><span class="timer" id="timer">${W.time?"":""}</span>${W.time?`<button class="btn small ghost" id="startTimer">Start ${W.time}-minute timer</button>`:""}</div>
      <textarea id="essay" class="essay" placeholder="Start writing here…" aria-label="Your essay">${esc(text)}</textarea>
      <div class="wstats" id="wstats"></div>
      <section class="stack tight"><span class="label">Before you check: tick what is true</span>
        <div class="sc">${sec.checklist.map((c,i)=>`<label><input type="checkbox" data-ck="${i}"><span>${esc(c)}</span></label>`).join("")}</div>
      </section>

    $$('[id^="plan"]').forEach(inp=>inp.addEventListener("input",()=>{S.drafts[dkey+":plan"]=$$('[id^="plan"]').map(x=>x.value);save();}));

function markText(text,matches){
  if(!matches||!matches.length) return esc(text);
  const ms=matches.slice().sort((a,b)=>a.offset-b.offset); let out="",pos=0;
  ms.forEach((m,i)=>{ if(m.offset<pos) return; out+=esc(text.slice(pos,m.offset)); const cls=m.kind==="spelling"?"sp":m.kind==="style"?"st":""; out+=`<mark class="${cls}" title="${esc(m.message)}${m.replacements&&m.replacements.length?" → "+esc(m.replacements.slice(0,3).map(r=>r.value).join(" / ")):""}">${esc(text.substr(m.offset,m.length))}</mark>`; pos=m.offset+m.length; });
  return out+esc(text.slice(pos));
}
function viewWritingReport(U,sec,tier,text,A,ltErr,before){
  const W=sec.tiers[tier];
  const CRIT=[["TR","Task response"],["CC","Coherence & cohesion"],["LR","Lexical resource"],["GRA","Grammatical range & accuracy"]];
  const issues=A.lt?A.lt.matches.filter(m=>m.kind!=="style"):[];
  const model=sec.models&&sec.models[W.model];
  app.innerHTML=`<div class="wrap stack" style="gap:28px">
    <div class="score"><div class="big">${A.overall}</div><div class="stack tight"><span class="label">${esc(U.title)} · Writing · ${tier} · CEFR estimate</span><h2>Indicative IELTS ${BAND[A.overall]}</h2><p class="muted">Your next writing tasks will be at ${S.tier.writing}.${before&&before!==A.overall?` (Before: ${before})`:""} This is an automatic estimate. Your teacher’s feedback counts more.</p></div></div>
    ${ltErr?`<p class="note warn">The grammar and spelling service didn’t respond (${esc(ltErr.message||"offline")}), so accuracy wasn’t measured. Try again later for a full check.</p>`:""}
    <section class="crit">${CRIT.map(([k,n])=>`<div class="card"><div class="row between"><strong>${n}</strong><span class="chip ${li(A.levels[k])>=2?"lv":""}">${A.levels[k]}</span></div><ul>${A.reasons[k].map(r=>`<li>${esc(r)}</li>`).join("")}</ul>${A.tips[k].length?`<div class="stack tight"><span class="label">To improve</span><ul>${A.tips[k].map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>`:""}</div>`).join("")}</section>
    <section class="stack"><div class="row between"><span class="label">Your essay${A.lt?` · ${issues.length} issue${issues.length===1?"":"s"} marked`:""}</span>${A.lt?`<span class="small muted"><mark style="background:var(--bad-soft);border-bottom:2px solid var(--bad)">grammar</mark> <mark style="background:var(--warn-soft);border-bottom:2px solid var(--warn)">spelling</mark> <span style="border-bottom:2px dotted var(--muted)">style</span></span>`:""}</div><div class="marked">${markText(text,A.lt&&A.lt.matches)}</div></section>
    ${issues.length?`<section class="stack tight issues"><span class="label">Corrections from LanguageTool</span>${issues.slice(0,30).map(m=>`<div class="issue"><span><b>${esc(text.substr(m.offset,m.length))}</b>${m.replacements&&m.replacements.length?` → <b style="color:var(--good)">${esc(m.replacements.slice(0,3).map(r=>r.value).join(" / "))}</b>`:""}</span><span class="muted">${esc(m.message)}</span></div>`).join("")}</section>`:""}
    <div class="row"><button class="btn primary" id="revise">Revise my essay</button><button class="btn" id="toUnit">Back to the unit</button></div>
    ${model?`<details class="more"><summary>Model answer</summary><p class="model">${esc(model)}</p></details>`:""}
  </div>`;
  $("#revise").onclick=()=>go(runWriting,U,sec,tier);
  $("#toUnit").onclick=()=>go(viewUnit,U.id);
}

/* =========================================================
   SEND PROGRESS · SETTINGS
   ========================================================= */
async function progressCode(){
  const words={}; for(const [k,v] of Object.entries(S.words)) words[k]=v.stage;
  const qt={}; for(const [k,v] of Object.entries(S.qtypes)){ const a=v.slice(-10); qt[k]=a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*100):null; }
  const data={v:1,code:S.code,at:Date.now(),placement:S.placement,profile:S.profile,tier:S.tier,results:S.results,checks:S.checks,cando:S.cando,essays:S.essays.slice(-6),speaking:S.speaking.slice(-6),words,qtypes:qt};
  const json=JSON.stringify(data);
  if(window.CompressionStream){ try{ const buf=await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer(); return "IL1."+b64url(new Uint8Array(buf)); }catch(e){} }
  return "IL0."+b64url(enc.encode(json));
}
async function viewSend(){
  app.innerHTML=`<div class="wrap narrow stack" style="gap:22px">
    <span class="label">Send progress</span><h1>Share your progress</h1>
    <p class="prose">This code contains your scores, levels and essays. It doesn’t include your name. Copy it and send it to ${esc(CONFIG.teacherName||"your teacher")}${CONFIG.teacherContact?` (${esc(CONFIG.teacherContact)})`:""} in a message.</p>
    <textarea id="pcode" rows="6" readonly style="font-family:var(--mono);font-size:12px" aria-label="Your progress code">Preparing…</textarea>
    <div class="row"><button class="btn primary" id="copy">Copy code</button><span class="small muted" id="cmsg" role="status"></span></div>
  </div>`;
  const code=await progressCode(); $("#pcode").value=code;
  $("#copy").onclick=()=>{ const ta=$("#pcode"); const fall=()=>{ta.focus();ta.select();$("#cmsg").textContent="Select all and copy.";};
    try{ navigator.clipboard.writeText(code).then(()=>{$("#cmsg").textContent="Copied. Paste it into your message.";},fall); }catch(e){ fall(); } };
}
function viewSettings(){
  app.innerHTML=`<div class="wrap narrow stack" style="gap:24px">
    <span class="label">Settings</span><h1>Settings</h1>
    <div class="stack tight"><label for="acc"><strong>Voice accent for listening</strong></label><select id="acc" style="max-width:320px"><option value="en-GB">British English</option><option value="en-US">American English</option><option value="en-AU">Australian English</option><option value="any">Mixed (as written in the unit)</option></select><span class="small muted">Voices come from your device, so quality varies. Chrome and Safari usually have the best voices.</span></div>
    <div class="stack tight"><label for="spd"><strong>Speech speed</strong> <span class="muted" id="spdv"></span></label><input type="range" id="spd" min="0.8" max="1.15" step="0.05" style="max-width:320px"><div class="row"><button class="btn small ghost" id="testV">Test voice</button></div></div>
    <div class="stack tight"><strong>Placement</strong><p class="small muted">Retake the placement test to reset your starting levels. Your other results stay.</p><div class="row"><button class="btn small" id="retake">Retake placement</button></div></div>
    <div class="stack tight"><strong>Access code</strong><p class="small">Signed in with <span style="font-family:var(--mono)">${esc(fmtCode(S.code||""))}</span></p><p class="small muted">Removing the course deletes all progress on this device. Send your progress to your teacher first.</p><div class="row"><button class="btn small danger" id="out">Remove course from this device</button></div></div>
  </div>`;
  $("#acc").value=S.settings.accent||"en-GB";
  $("#acc").onchange=e=>{S.settings.accent=e.target.value;save();};
  $("#spd").value=S.settings.speed||1; $("#spdv").textContent=Math.round((S.settings.speed||1)*100)+"%";
  $("#spd").oninput=e=>{S.settings.speed=Number(e.target.value);$("#spdv").textContent=Math.round(S.settings.speed*100)+"%";save();};
  $("#testV").onclick=()=>TTS.say("Over the last twenty years, the way we live has changed dramatically.","en-GB","female");
  $("#retake").onclick=()=>go(viewPlacementIntro);
  $("#out").onclick=e=>{ const b=e.currentTarget; if(b.dataset.armed){ try{localStorage.removeItem(SKEY);}catch(x){} location.reload(); } else { b.dataset.armed="1"; b.classList.add("armed"); b.textContent="Tap again to remove"; T.later(()=>{ if(b.isConnected){ delete b.dataset.armed; b.classList.remove("armed"); b.textContent="Remove course from this device"; } },3500); } };
}

boot();
