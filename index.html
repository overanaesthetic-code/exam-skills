<!doctype html>
<html lang="en">
<head>
<title>IELTS Ladder</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky top bar; one centred column (max 1100px) with cards only where an object needs setting apart; reading uses a passage/questions split */
:root{
  --bg:#ffffff; --surface:#fbf7fa; --ink:#151217; --muted:#6c6370; --line:#ece4ea;
  --accent:#FF2E93; --accent-ink:#ffffff; --accent-soft:#ffe6f2;
  --good:#0d8458; --good-soft:#e3f5ec; --bad:#c62f2f; --bad-soft:#fdeaea; --warn:#9a6a00; --warn-soft:#fff4d6; --hl:#fff1a8;
  --display:"Bebas Neue","Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121014; --surface:#1b171d; --ink:#f5eff3; --muted:#a79ead; --line:#2d2730;
  --accent:#ff53a6; --accent-ink:#1c0611; --accent-soft:#3a1529;
  --good:#52d49d; --good-soft:#123024; --bad:#ff8080; --bad-soft:#3b1718; --warn:#f0c040; --warn-soft:#3a2f10; --hl:#5a4a12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121014; --surface:#1b171d; --ink:#f5eff3; --muted:#a79ead; --line:#2d2730;
  --accent:#ff53a6; --accent-ink:#1c0611; --accent-soft:#3a1529;
  --good:#52d49d; --good-soft:#123024; --bad:#ff8080; --bad-soft:#3b1718; --warn:#f0c040; --warn-soft:#3a2f10; --hl:#5a4a12; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:1100px;margin:0 auto;padding-inline:18px;padding-block:24px 72px}
.narrow{max-width:720px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.02em;line-height:1;margin:0;text-wrap:balance}
h1{font-size:clamp(46px,9vw,84px)}
h2{font-size:clamp(30px,5vw,40px)}
h3{font-size:24px}
p{margin:0}
a{color:var(--accent)}
.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:16px}
.stack.tight{gap:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.section{padding-block:28px;border-bottom:1px solid var(--line);display:grid;gap:18px}
.section:last-child{border-bottom:0}
.prose{max-width:65ch}
.prose p+p{margin-top:10px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{appearance:none;border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;line-height:1.2;text-decoration:none;display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.btn:hover{background:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.small{padding:6px 12px;font-size:14px}
.btn.ghost{border-color:var(--line)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;color:var(--ink)}
.chip.lv{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.accent{background:var(--accent-soft);border-color:transparent}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.card{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--bg)}
.card.soft{background:var(--surface);border-color:transparent}
.note{font-size:14px;background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.note.warn{background:var(--warn-soft)}
input[type=text],input[type=search],select,textarea{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);width:100%}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none}
textarea{resize:vertical;line-height:1.6}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1.5px solid var(--ink)}
.topbar .inner{max-width:1100px;margin:0 auto;padding-inline:18px;padding-block:10px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:28px;letter-spacing:.03em;line-height:1;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.brand span{color:var(--accent)}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{background:none;border:1px solid transparent;border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink)}
.nav button:hover{border-color:var(--line)}
.nav .count{font-family:var(--mono);font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 6px;margin-left:4px}

/* gate */
.gate{min-height:70vh;display:grid;align-content:center;gap:28px;max-width:640px;margin:0 auto}
.gate h1 span{color:var(--accent)}
.codein{font-family:var(--mono);font-size:22px;letter-spacing:.12em;text-transform:uppercase}
.err{color:var(--bad);font-size:14px;min-height:1.4em}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:end;padding-block:8px 28px;border-bottom:1.5px solid var(--ink)}
.biglv{font-family:var(--display);font-size:clamp(96px,18vw,160px);line-height:.8;color:var(--accent)}
@media (max-width:560px){.hero{grid-template-columns:1fr;gap:12px}}
.profile{display:grid;gap:12px}
.prow{display:grid;grid-template-columns:170px 1fr 92px;gap:14px;align-items:center}
.scale{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.scale i{height:10px;border-radius:3px;background:var(--line)}
.scale i.on{background:var(--ink)}
.scale i.top{background:var(--accent)}
.scale-labels{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-family:var(--mono);font-size:10px;color:var(--muted)}
@media (max-width:640px){.prow{grid-template-columns:1fr 84px}.prow .scalebox{grid-column:1/-1;grid-row:2}}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:12px}
.unit{display:grid;gap:8px;align-content:start;padding:16px;border:1px solid var(--line);border-radius:14px;text-align:left;background:var(--bg);cursor:pointer;color:var(--ink);min-height:140px;min-width:0}
.unit:hover{border-color:var(--ink)}
.unit .num{font-family:var(--display);font-size:46px;line-height:.85;color:var(--line)}
.unit.open .num{color:var(--ink)}
.unit.done .num{color:var(--accent)}
.unit.locked{cursor:default}
.unit.locked:hover{border-color:var(--line)}
.unit h3{font-size:22px}
.continue{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
@media (max-width:560px){.continue{grid-template-columns:1fr}}

/* unit page */
.uhero{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:end;padding-block:8px 24px;border-bottom:1.5px solid var(--ink)}
.uhero .num{font-family:var(--display);font-size:clamp(90px,16vw,150px);line-height:.8;color:var(--accent)}
@media (max-width:560px){.uhero{grid-template-columns:1fr;gap:6px}}
.seclist{display:grid;border-top:1px solid var(--line)}
.secrow{display:grid;grid-template-columns:150px 1fr auto;gap:16px;align-items:center;padding-block:16px;border-bottom:1px solid var(--line)}
.secrow .meta{display:grid;gap:4px;min-width:0}
@media (max-width:640px){.secrow{grid-template-columns:1fr}.secrow .act{justify-self:start}}

/* choosers */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px;cursor:pointer;text-align:left;display:grid;gap:2px;min-width:110px;color:var(--ink)}
.seg button strong{font-family:var(--display);font-weight:400;font-size:26px;line-height:1}
.seg button span{font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.seg button[aria-pressed="true"] span{color:var(--bg);opacity:.8}

/* quiz */
.bar-top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px}
.bar-top .inner{max-width:1100px;margin:0 auto;padding-inline:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.timer{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums;font-weight:500}
.timer.low{color:var(--bad)}
.tabs{display:none;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;width:100%}
.tabs button{flex:1;border:0;background:transparent;padding:8px;font-weight:600;cursor:pointer;color:var(--ink)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:36px;align-items:start;padding-top:20px}
.passage{position:sticky;top:130px;max-height:calc(100vh - 150px);overflow:auto;padding-right:6px}
.passage h2{margin-bottom:6px}
.para{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:8px 6px;border-radius:8px;transition:background .6s}
.para b{font-family:var(--display);font-size:24px;line-height:1.1;color:var(--accent);font-weight:400}
.para p{max-width:62ch}
.para.flash{background:var(--hl)}
@media (prefers-reduced-motion:reduce){.para{transition:none}}
@media (max-width:900px){
  .tabs{display:flex}
  .split{grid-template-columns:minmax(0,1fr);gap:20px}
  .passage{position:static;max-height:none;overflow:visible;padding-right:0}
  .reading[data-pane="passage"] .qcol{display:none}
  .reading[data-pane="questions"] .passage{display:none}
}
.qcol{display:grid;gap:28px;min-width:0}
.group{display:grid;gap:14px}
.instr{font-size:14px;border-left:3px solid var(--accent);padding-left:12px}
.headlist{font-size:14px;display:grid;gap:4px;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.headlist div{display:grid;grid-template-columns:34px 1fr;gap:6px}
.headlist span{font-family:var(--mono)}
.q{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;min-width:0}
.q.ok{border-color:var(--good);background:var(--good-soft)}
.q.no{border-color:var(--bad);background:var(--bad-soft)}
.qhead{display:flex;gap:10px;align-items:flex-start}
.qnum{font-family:var(--display);font-size:26px;line-height:1;min-width:28px}
.qtext{flex:1;min-width:0}
.quote{font-size:15px;border-left:3px solid var(--line);padding-left:12px;font-style:italic}
.opts{display:grid;gap:6px}
.opts label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer;background:var(--bg)}
.opts label:has(input:checked){border-color:var(--ink)}
.opts input{margin-top:5px;accent-color:var(--accent)}
.opts .let{font-family:var(--mono);font-weight:500}
.tf{display:flex;flex-wrap:wrap;gap:6px}
.tf button{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 12px;font-family:var(--mono);font-size:13px;letter-spacing:.04em;cursor:pointer;color:var(--ink)}
.tf button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.q input[type=text],.q select{max-width:340px}
.qtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fb{font-size:14px;display:grid;gap:4px}
.fb .verdict{font-weight:700}
.q.ok .verdict{color:var(--good)}
.q.no .verdict{color:var(--bad)}

/* player */
.player{display:grid;gap:12px;border:1.5px solid var(--ink);border-radius:14px;padding:16px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.speaking-now{font-family:var(--mono);font-size:12px;color:var(--muted);min-height:1.4em}
.script{display:grid;gap:8px;font-size:15px}
.script p b{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:6px}

/* vocab */
.drill{display:grid;gap:18px;max-width:640px}
.drill .word{font-family:var(--display);font-size:clamp(48px,10vw,72px);line-height:.9}
.choices{display:grid;gap:8px}
.choices button{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;cursor:pointer;color:var(--ink)}
.choices button:hover:not(:disabled){border-color:var(--ink)}
.choices button.right{border-color:var(--good);background:var(--good-soft)}
.choices button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.wordlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.wcard{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;align-content:start}
.wcard h3{font-size:28px}
.meter{display:flex;gap:3px}
.meter i{flex:1;height:5px;border-radius:2px;background:var(--line)}
.meter i.on{background:var(--good)}

/* speaking */
.cue{border:1.5px solid var(--ink);border-radius:14px;padding:18px;display:grid;gap:10px}
.cue ul{margin:0;padding-left:20px}
.rec{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.recdot{animation:none}}
.transcript{font-size:14px;color:var(--muted);font-style:italic}
.sc{display:grid;gap:8px}
.sc label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer}
.sc label:has(input:checked){border-color:var(--ink)}
.sc input{margin-top:5px;accent-color:var(--accent)}
.phrases{display:flex;flex-wrap:wrap;gap:6px}
.phrases span{border:1px dashed var(--line);border-radius:8px;padding:4px 10px;font-size:14px}

/* writing */
.wtask{border-left:4px solid var(--accent);padding:4px 0 4px 16px;font-size:18px;font-weight:600;max-width:70ch}
.frame{display:grid;gap:8px}
.frame div{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.essay{min-height:340px;font-size:16px}
.wstats{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.crit{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.crit .card{display:grid;gap:8px;align-content:start}
.crit ul,.issues ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.marked{white-space:pre-wrap;line-height:1.8;font-size:15px;border:1px solid var(--line);border-radius:12px;padding:16px;overflow-wrap:anywhere}
.marked mark{background:var(--bad-soft);color:inherit;border-bottom:2px solid var(--bad);padding:0 1px;cursor:help}
.marked mark.sp{background:var(--warn-soft);border-color:var(--warn)}
.marked mark.st{background:transparent;border-bottom:2px dotted var(--muted)}
.issue{display:grid;gap:2px;padding-block:8px;border-bottom:1px dotted var(--line);font-size:14px}
.model{white-space:pre-wrap;font-size:15px;line-height:1.7;max-width:70ch}

/* results */
.score{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:end;padding-block:12px 24px;border-bottom:1.5px solid var(--ink)}
.score .big{font-family:var(--display);font-size:clamp(84px,18vw,140px);line-height:.8;color:var(--accent)}
.score .big small{font-size:.4em;color:var(--ink)}
@media (max-width:560px){.score{grid-template-columns:1fr}}
.pbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.loader{min-height:50vh;display:grid;place-content:center;gap:10px;text-align:center}
details.more{border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.more summary{cursor:pointer;font-weight:600}
details.more[open] summary{margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:50}
</style>
</head>
<body>
<header class="topbar" id="topbar" hidden><div class="inner">
  <button class="brand" id="brandBtn" type="button">IELTS <span>Ladder</span></button>
  <nav class="nav" id="nav"></nav>
</div></header>
<main id="app"><div class="loader"><span class="label">Loading</span></div></main>
<script>
"use strict";
/* =========================================================
   IELTS Ladder · student site
   Content lives in modules/*.enc.json (encrypted). A student's code opens
   keyring.json, which holds the keys to the units their teacher opened.
   ========================================================= */

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9'\s-]/g," ").replace(/\s+/g," ").trim();
const wc=s=>norm(s)?norm(s).split(" ").length:0;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const LV=["A2","B1","B2","C1"], TIERS=["B1","B2","C1"];
const li=l=>Math.max(0,LV.indexOf(l));
const tierOf=l=>(!l||l==="A1"||l==="A2")?"B1":l;
const upT=t=>TIERS[Math.min(2,TIERS.indexOf(t)+1)];
const downT=t=>TIERS[Math.max(0,TIERS.indexOf(t)-1)];
const BAND={A1:"below 4.0",A2:"below 4.0",B1:"4.0–5.0",B2:"5.5–6.5",C1:"7.0–8.0"};
const SKILLS=[["reading","Reading"],["listening","Listening"],["writing","Writing"],["speaking","Speaking"],["language","Vocabulary & grammar"]];
const SKILL_NAME=Object.fromEntries(SKILLS);
const DAY=864e5;
const ROMAN=["i","ii","iii","iv","v","vi","vii","viii","ix","x"];
const fmtDate=t=>new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short"});
function toast(msg){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function median(arr){const a=arr.slice().sort((x,y)=>x-y);return a.length?a[Math.floor((a.length-1)/2)]:0;}

/* timers and cleanup tied to the current view */
const T={ids:new Set(),every(fn,ms){const id=setInterval(fn,ms);this.ids.add(id);return id;},later(fn,ms){const id=setTimeout(fn,ms);this.ids.add(id);return id;},clear(){this.ids.forEach(id=>{clearInterval(id);clearTimeout(id);});this.ids.clear();}};
let CLEANUP=[];
const onLeave=fn=>CLEANUP.push(fn);
function go(fn,...args){T.clear();CLEANUP.forEach(f=>{try{f();}catch(e){}});CLEANUP=[];TTS.stop();window.scrollTo(0,0);renderTop();return fn(...args);}

/* ---------- state ---------- */
const SKEY="ielts-ladder:v1";
function freshState(){return {v:1,code:null,placement:null,profile:{},tier:{},support:false,results:{},words:{},qtypes:{},essays:[],speaking:[],cando:{},checks:{},drafts:{},settings:{accent:"en-GB",speed:1}};}
let S=freshState(), PREVIEW=false;
function loadState(){try{const r=localStorage.getItem(SKEY);if(r){const o=JSON.parse(r);if(o&&o.v===1)S=Object.assign(freshState(),o);}}catch(e){}}
function save(){if(PREVIEW)return;try{localStorage.setItem(SKEY,JSON.stringify(S));}catch(e){}}

/* ---------- crypto (AES-GCM + PBKDF2, Web Crypto) ---------- */
const enc=new TextEncoder(), dec=new TextDecoder();
function b64e(u8){let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64url=u8=>b64e(u8).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const normCode=c=>String(c||"").toUpperCase().replace(/[^0-9A-Z]/g,"").replace(/O/g,"0").replace(/[IL]/g,"1");
const fmtCode=c=>c.replace(/(.{4})(?=.)/g,"$1-");
async function lookupId(code){const h=await crypto.subtle.digest("SHA-256",enc.encode("ielts-ladder|"+code));return Array.from(new Uint8Array(h)).slice(0,16).map(b=>b.toString(16).padStart(2,"0")).join("");}
async function deriveKey(code,salt,iter){const base=await crypto.subtle.importKey("raw",enc.encode(code),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(salt),iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);}
async function aesOpen(key,iv,ct){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(iv)},key,b64d(ct));return JSON.parse(dec.decode(pt));}
const rawKey=b64=>crypto.subtle.importKey("raw",b64d(b64),"AES-GCM",false,["decrypt"]);

let KEYS={}, MODULES={}, CONFIG={}, UNITS=[];
async function fetchJSON(p){const r=await fetch(p+(p.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(p+" returned "+r.status);return r.json();}
async function openCourse(code){
  const ring=await fetchJSON("keyring.json");
  const id=await lookupId(code);
  const e=ring.entries&&ring.entries[id];
  if(!e) return {error:"unknown"};
  const key=await deriveKey(code,e.salt,ring.iter||150000);
  const data=await aesOpen(key,e.iv,e.ct);
  KEYS=data.keys||{};
  return {ok:true};
}
async function getModule(id){
  if(MODULES[id]) return MODULES[id];
  if(!KEYS[id]) throw new Error("No access to "+id);
  const f=await fetchJSON("modules/"+id+".enc.json");
  MODULES[id]=await aesOpen(await rawKey(KEYS[id]),f.iv,f.ct);
  return MODULES[id];
}
async function preloadModules(){
  for(const id of Object.keys(KEYS)){ if(id==="placement") continue; try{await getModule(id);}catch(e){console.warn(e);} }
}
const unitIds=()=>Object.keys(MODULES).filter(id=>MODULES[id]&&MODULES[id].sections);

/* ---------- speech (browser text-to-speech) ---------- */
const TTS={
  voices:[], cur:null,
  ok(){return "speechSynthesis" in window && typeof SpeechSynthesisUtterance!=="undefined";},
  init(){ if(!this.ok()) return; const load=()=>{this.voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));}; load(); try{speechSynthesis.addEventListener("voiceschanged",load);}catch(e){speechSynthesis.onvoiceschanged=load;} },
  FEM:/female|woman|samantha|karen|serena|kate|moira|tessa|fiona|victoria|susan|zira|hazel|libby|sonia|emma|amy|joanna|salli|kimberly|ivy|kendra|aria|jenny|natasha|olivia|martha|catherine|allison|ava|nicky|maisie|google us english/i,
  MALE:/\bmale|daniel|arthur|oliver|george|ryan|thomas|alex\b|fred|rishi|aaron|gordon|guy|brian|matthew|joey|justin|david|mark|james|william|liam|google uk english male/i,
  pick(lang,gender,avoid=[]){
    const pref=(S.settings.accent&&S.settings.accent!=="any")?S.settings.accent:lang||"en-GB";
    const L=this.voices; if(!L.length) return null;
    const byLang=L.filter(v=>v.lang.replace("_","-").toLowerCase().startsWith(pref.toLowerCase()));
    const pool=byLang.length?byLang:L;
    const isF=v=>this.FEM.test(v.name), isM=v=>!isF(v)&&this.MALE.test(v.name);
    const g=gender==="female"?pool.filter(isF):gender==="male"?pool.filter(isM):pool;
    const cand=(g.length?g:pool);
    return cand.find(v=>!avoid.includes(v))||cand[0];
  },
  cast(speakers){const map={},used=[];for(const [k,s] of Object.entries(speakers||{})){const v=this.pick(s.lang,s.gender,used);map[k]=v;if(v)used.push(v);}return map;},
  split(t){return (t.match(/[^.!?]+[.!?]+["’”]?|[^.!?]+$/g)||[t]).map(s=>s.trim()).filter(Boolean);},
  /* plays a list of {text, voice} from index `from`; returns a controller */
  run(lines,rate,from,onLine,onDone){
    if(!this.ok()){onDone&&onDone(false);return {stop(){}};}
    this.stop(); let i=from||0, stopped=false;
    const next=()=>{
      if(stopped) return;
      if(i>=lines.length){ this.cur=null; onDone&&onDone(true); return; }
      const ln=lines[i]; onLine&&onLine(i,ln);
      const u=new SpeechSynthesisUtterance(ln.text);
      if(ln.voice){u.voice=ln.voice;u.lang=ln.voice.lang;} else u.lang="en-GB";
      u.rate=Math.max(.5,Math.min(1.5,(rate||1)*(S.settings.speed||1)));
      u.onend=()=>{ if(stopped) return; i++; setTimeout(next,ln.pause||250); };
      u.onerror=()=>{ if(stopped) return; i++; setTimeout(next,100); };
      speechSynthesis.speak(u);
    };
    const ctl={stop:()=>{stopped=true;try{speechSynthesis.cancel();}catch(e){}},get index(){return i;}};
    this.cur=ctl; next(); return ctl;
  },
  say(text,lang,gender){ const v=this.pick(lang||"en-GB",gender||"female"); return this.run(this.split(text).map(t=>({text:t,voice:v})),1,0); },
  stop(){ if(this.cur){this.cur.stop();this.cur=null;} if(this.ok()){try{speechSynthesis.cancel();}catch(e){}} }
};

/* ---------- boot ---------- */
async function boot(){
  loadState(); TTS.init();
  const [cfg,units]=await Promise.all([fetchJSON("config.json").catch(()=>({})),fetchJSON("units.json").then(j=>j.units||[]).catch(()=>[])]);
  CONFIG=cfg; UNITS=units; document.title=CONFIG.courseName||"IELTS Ladder";
  if(!window.crypto||!crypto.subtle){ app.innerHTML=`<div class="wrap narrow stack"><h2>This browser can’t open the course</h2><p>Please open the link in an up-to-date browser such as Chrome, Safari, Edge or Firefox.</p></div>`; return; }
  if(!S.code) return go(viewGate);
  viewLoading("Opening your course");
  try{
    const r=await openCourse(S.code);
    if(r.error){ S.code=null; save(); return go(viewGate,"This code is no longer active. Please check with your teacher."); }
  }catch(e){ return go(viewProblem,e); }
  await preloadModules();
  go(S.placement?viewHome:viewPlacementIntro);
}
function viewLoading(msg){app.innerHTML=`<div class="loader"><span class="label">${esc(msg)}</span></div>`;}
function viewProblem(e){
  app.innerHTML=`<div class="wrap narrow stack"><span class="label">Connection problem</span><h2>The course didn’t load</h2><p>Check your internet connection and try again.</p><p class="small muted">${esc(e&&e.message||e)}</p><div class="row"><button class="btn primary" id="retry">Try again</button></div></div>`;
  $("#retry").onclick=()=>location.reload();
}

/* ---------- gate: code entry ---------- */
function viewGate(msg){
  const name=CONFIG.courseName||"IELTS Ladder";
  app.innerHTML=`<div class="wrap"><div class="gate">
    <div class="stack tight"><span class="label">${esc(CONFIG.tagline||"Academic English")}</span><h1>${esc(name.replace(/\s+\S+$/,""))} <span>${esc(name.split(/\s+/).pop())}</span></h1></div>
    <form id="gateForm" class="stack" novalidate>
      <label for="codeIn" class="stack tight"><strong>Enter your access code</strong><span class="small muted">Your teacher sent it to you. It looks like K7QM-2XRP-9TDA.</span></label>
      <input type="text" id="codeIn" class="codein" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX-XXXX" aria-describedby="gateErr">
      <div class="err" id="gateErr" role="alert">${esc(msg||"")}</div>
      <div class="row"><button class="btn primary" type="submit" id="gateBtn">Open my course</button></div>
    </form>
    <p class="small muted">Your progress is saved on this device only. No name or email is needed.</p>
    <details class="more small"><summary>For teachers: preview a content file</summary>
      <p class="muted">Open a plain unit or placement file from your source folder to check it before you encrypt it. Nothing is uploaded.</p>
      <p style="margin-top:10px"><input type="file" id="pvFile" accept=".json,application/json"></p>
    </details>
  </div></div>`;
  $("#gateForm").onsubmit=async ev=>{
    ev.preventDefault();
    const code=normCode($("#codeIn").value);
    if(code.length<10){ $("#gateErr").textContent="That code is too short. Check that you copied all of it."; return; }
    $("#gateBtn").disabled=true; $("#gateBtn").textContent="Checking…"; $("#gateErr").textContent="";
    try{
      const r=await openCourse(code);
      if(r.error){ $("#gateErr").textContent="We couldn’t find that code. Check the letters and numbers, or ask your teacher."; $("#gateBtn").disabled=false; $("#gateBtn").textContent="Open my course"; return; }
      S.code=code; save();
      viewLoading("Opening your course"); await preloadModules();
      go(S.placement?viewHome:viewPlacementIntro);
    }catch(e){ $("#gateErr").textContent="The course didn’t load. Check your connection and try again."; $("#gateBtn").disabled=false; $("#gateBtn").textContent="Open my course"; }
  };
  $("#pvFile").onchange=async ev=>{
    const f=ev.target.files[0]; if(!f) return;
    try{
      const data=JSON.parse(await f.text());
      PREVIEW=true; S=freshState(); S.code="PREVIEW";
      ["reading","listening","writing","speaking","language"].forEach(k=>{S.profile[k]="B2";S.tier[k]="B2";});
      if(data.type==="placement"||data.id==="placement"){ MODULES.placement=data; KEYS.placement="x"; S.placement=null; return go(viewPlacementIntro); }
      if(!data.sections) throw new Error("This file has no sections.");
      MODULES[data.id]=data; S.placement={level:"B2",date:Date.now(),scores:{}};
      go(viewUnit,data.id);
    }catch(e){ alertBox("That file couldn’t be opened: "+e.message); }
  };
}
function alertBox(msg){ const el=document.createElement("div"); el.className="toast"; el.textContent=msg; document.body.appendChild(el); setTimeout(()=>el.remove(),4000); }

/* ---------- placement ---------- */
async function placementData(){ if(MODULES.placement) return MODULES.placement; return getModule("placement"); }
async function viewPlacementIntro(){
  let P; try{ P=await placementData(); }catch(e){ app.innerHTML=`<div class="wrap narrow stack"><h2>Placement isn’t available yet</h2><p>Your code doesn’t include the placement test. Please tell your teacher.</p></div>`; return; }
  app.innerHTML=`<div class="wrap narrow stack" style="gap:24px">
    <span class="label">Step 1 · Placement</span>
    <h1>Find your level</h1>
    <p class="prose">${esc(P.intro)}</p>
    <div class="card soft stack tight">
      <strong>What happens next</strong>
      <p class="small">Your result is a CEFR level (A2 to C1) with an indicative IELTS band. It sets your starting level in reading, listening, writing, speaking and vocabulary. After that, each skill moves up or down on its own as you work.</p>
    </div>
    <div class="row"><button class="btn primary" id="startP">Start the placement test</button>${S.placement?`<button class="btn ghost" id="backH">Back to the course</button>`:""}</div>
  </div>`;
  $("#startP").onclick=()=>go(runPlacement,P);
  if($("#backH")) $("#backH").onclick=()=>go(viewHome);
}
function runPlacement(P){
  const items=P.items.map(it=>Object.assign({},it,{order:shuffle(it.o.map((_,i)=>i))}));
  const ans=new Array(items.length).fill(null); let i=0;
  const draw=()=>{
    const it=items[i];
    app.innerHTML=`<div class="wrap narrow stack" style="gap:22px">
      <div class="row between"><span class="label">Question ${i+1} of ${items.length}</span><button class="link small" id="quitP">Leave</button></div>
      <div class="pbar"><i style="width:${Math.round(i/items.length*100)}%"></i></div>
      <h2 style="font-family:var(--body);font-weight:600;font-size:22px;line-height:1.4;letter-spacing:0">${esc(it.p).replace(/___/g,"<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>")}</h2>
      <div class="choices">${it.order.map(k=>`<button data-k="${k}" ${ans[i]===k?'class="right"':""}>${esc(it.o[k])}</button>`).join("")}<button data-k="-1" class="${ans[i]===-1?"right":""}" style="color:var(--muted)">I don’t know</button></div>
      <div class="row between"><button class="btn ghost small" id="prevP" ${i===0?"disabled":""}>Back</button><span class="small muted">Choose an answer to continue.</span></div>
    </div>`;
    $$(".choices button").forEach(b=>b.onclick=()=>{ ans[i]=Number(b.dataset.k); if(i<items.length-1){i++;draw();} else finish(); });
    $("#prevP").onclick=()=>{ if(i>0){i--;draw();} };
    $("#quitP").onclick=()=>go(viewPlacementIntro);
  };
  const finish=()=>{
    const scores={A2:0,B1:0,B2:0,C1:0}, totals={A2:0,B1:0,B2:0,C1:0};
    items.forEach((it,k)=>{ totals[it.level]++; if(ans[k]===it.a) scores[it.level]++; });
    const pass=P.pass||{A2:5,B1:5,B2:4,C1:4};
    let level="A1"; for(const L of LV){ if(scores[L]>=pass[L]) level=L; else break; }
    const prof=level==="A1"?"A2":level;
    S.placement={level,scores,totals,date:Date.now()};
    SKILLS.forEach(([k])=>{ S.profile[k]=prof; S.tier[k]=tierOf(prof); });
    S.support=(level==="A1"||level==="A2");
    save();
    go(viewPlacementResult);
  };
  draw();
}
function viewPlacementResult(){
  const p=S.placement, lvl=p.level, shown=lvl==="A1"?"A1–A2":lvl;
  const msg={A1:"You’ll start at B1 with extra support: strategy tips, hints and fewer answer options. Take it steadily.",A2:"You’ll start at B1 with extra support. The first units will build the grammar and vocabulary IELTS needs.",B1:"You’ll start at B1. Passages are shorter and more direct, with support when you need it.",B2:"You’ll start at B2: longer texts, more paraphrase and full exam tasks.",C1:"You’ll start at C1: academic texts, the writer’s attitude and exam timing."}[lvl];
  app.innerHTML=`<div class="wrap narrow stack" style="gap:26px">
    <div class="score"><div class="big">${esc(shown)}</div><div class="stack tight"><span class="label">Your placement · CEFR</span><h2>Indicative IELTS ${esc(BAND[lvl])}</h2><p class="muted">${esc(msg)}</p></div></div>
    <div class="stack"><span class="label">Your answers by level</span>
      ${LV.map(L=>`<div class="row"><span class="chip ${li(L)<=li(prof(lvl))?"lv":""}" style="min-width:44px;justify-content:center">${L}</span><div class="grow pbar"><i style="width:${Math.round(p.scores[L]/(p.totals[L]||7)*100)}%"></i></div><span class="small" style="font-variant-numeric:tabular-nums;min-width:40px;text-align:right">${p.scores[L]}/${p.totals[L]}</span></div>`).join("")}
    </div>
    <p class="small muted">This is a quick grammar and vocabulary test, so it gives a starting point, not a final score. Your writing and speaking levels will be updated by the tasks themselves.</p>
    <div class="row"><button class="btn primary" id="toCourse">Go to the course</button></div>
  </div>`;
  $("#toCourse").onclick=()=>go(viewHome);
}
const prof=l=>l==="A1"?"A2":l;

/* ---------- adaptation ---------- */
function record(uid,sid,tier,pct,mode,lvl){
  const k=uid+":"+sid; const r={tier,pct:Math.round(pct*100),mode:mode||"",date:Date.now()}; if(lvl) r.lvl=lvl; (S.results[k]=S.results[k]||[]).push(r);
}
function adapt(skill,tier,pct){
  let msg;
  const cur=S.profile[skill]||"A2";
  if(pct>=0.7 && li(cur)<li(tier)) S.profile[skill]=tier;
  if(pct>=0.85 && tier!=="C1"){ S.tier[skill]=upT(tier); msg=`Strong result. Next time, ${SKILL_NAME[skill].toLowerCase()} moves up to ${S.tier[skill]}.`; }
  else if(pct>=0.85){ S.tier[skill]="C1"; msg="Strong result at the top level. Keep this up under exam timing."; }
  else if(pct>=0.7){ S.tier[skill]=tier; msg=`You’re working confidently at ${tier}. Score 85% or more to move up.`; }
  else if(pct<0.5 && tier!=="B1"){ S.tier[skill]=downT(tier); if(li(S.profile[skill])>=li(tier)) S.profile[skill]=downT(tier); msg=`This level was a stretch. Next time you’ll work at ${S.tier[skill]} first, then come back to ${tier}.`; }
  else { S.tier[skill]=tier; msg=`Keep practising at ${tier}. Score 70% or more to confirm this level.`; }
  save(); return msg;
}
function overallLevel(){ const v=SKILLS.map(([k])=>li(S.profile[k]||"A2")); return LV[median(v)]; }

/* ---------- home ---------- */
function unitState(u){
  const has=!!KEYS[u.id]||!!MODULES[u.id];
  if(!has) return u.ready?"locked":"soon";
  return S.checks[u.id]?"done":"open";
}
function sectionDone(uid,sid){ const r=S.results[uid+":"+sid]; return r&&r.length?r[r.length-1]:null; }
function nextStep(){
  for(const u of UNITS){ const st=unitState(u); if(st!=="open") continue; const U=MODULES[u.id]; if(!U) continue;
    for(const s of U.sections){ if(!sectionDone(u.id,s.id)) return {u,U,s}; } }
  return null;
}
function viewHome(){
  if(!S.placement) return go(viewPlacementIntro);
  const ov=overallLevel(), nx=nextStep();
  const prow=([k,label])=>{ const l=S.profile[k]||"A2", i=li(l), t=S.tier[k]||tierOf(l);
    return `<div class="prow"><strong>${label}</strong><div class="scalebox stack tight"><div class="scale">${LV.map((L,j)=>`<i class="${j<i?"on":j===i?"top":""}"></i>`).join("")}</div><div class="scale-labels">${LV.map(L=>`<span>${L}</span>`).join("")}</div></div><span class="chip ${i>=1?"lv":""}" title="Level of your next tasks">Next: ${t}</span></div>`; };
  const due=dueWords();
  app.innerHTML=`<div class="wrap">
    <section class="hero"><div class="biglv">${ov}</div><div class="stack tight"><span class="label">Your CEFR profile · overall</span><h2>Indicative IELTS ${BAND[ov]}</h2><p class="muted small">Placement ${esc(S.placement.level==="A1"?"A1–A2":S.placement.level)} on ${fmtDate(S.placement.date)}. Each skill moves on its own as you complete tasks.</p></div></section>
    <section class="section"><span class="label">Skills</span><div class="profile">${SKILLS.map(prow).join("")}</div></section>
    ${nx?`<section class="section"><div class="continue card soft"><div class="stack tight"><span class="label">Continue · Unit ${nx.U.number}</span><h3>${esc(nx.s.title)}</h3><p class="small muted">${esc(nx.s.summary||"")}</p></div><button class="btn primary" id="contBtn">Continue</button></div></section>`:""}
    ${due?`<section class="section"><div class="continue"><div class="stack tight"><span class="label">Vocabulary review</span><p><strong>${due} word${due>1?"s":""}</strong> ready for review. Short, regular reviews make words stick.</p></div><button class="btn" id="revBtn">Review words</button></div></section>`:""}
    <section class="section"><div class="row between"><span class="label">Units · ${UNITS.length}</span><span class="small muted">Your teacher opens new units for you.</span></div>
      <div class="units">${UNITS.map(u=>{const st=unitState(u);const chip={open:`<span class="chip accent">Open</span>`,done:`<span class="chip good">Completed</span>`,locked:`<span class="chip">Locked</span>`,soon:`<span class="chip">Coming soon</span>`}[st];
        const U=MODULES[u.id]; const prog=U?`<span class="small muted">${U.sections.filter(s=>sectionDone(u.id,s.id)).length}/${U.sections.length} parts done</span>`:`<span class="small muted">${esc(u.subtitle)}</span>`;
        return `<button class="unit ${st}" data-u="${u.id}" ${st==="open"||st==="done"?"":`aria-disabled="true"`}><span class="num">${String(u.n).padStart(2,"0")}</span><h3>${esc(u.title)}</h3>${prog}<span>${chip}</span></button>`;}).join("")}</div>
    </section>
  </div>`;
  if($("#contBtn")) $("#contBtn").onclick=()=>go(viewSectionStart,nx.u.id,nx.s.id);
  if($("#revBtn")) $("#revBtn").onclick=()=>go(viewReview);
  $$(".unit").forEach(b=>b.onclick=()=>{ const u=UNITS.find(x=>x.id===b.dataset.u); const st=unitState(u);
    if(st==="open"||st==="done") go(viewUnit,u.id);
    else toast(st==="locked"?"This unit is ready. Ask your teacher to open it for you.":"This unit is being written. It will appear here when it’s ready."); });
}

/* ---------- unit page ---------- */
const SEC_LABEL={vocab:"Vocabulary",practice:"Grammar",reading:"Reading",listening:"Listening",speaking:"Speaking",writing:"Writing",check:"Unit check"};
function viewUnit(uid){
  const U=MODULES[uid]; if(!U) return go(viewHome);
  const nextU=U.next&&UNITS.find(x=>x.id===U.next.id);
  const nextOpen=U.next&&(KEYS[U.next.id]||MODULES[U.next.id]);
  app.innerHTML=`<div class="wrap">

const TIER_DESC={B1:"IELTS 4.0–5.0",B2:"IELTS 5.5–6.5",C1:"IELTS 7.0–8.0"};
function viewSectionStart(uid,sid){
  const U=MODULES[uid], sec=U.sections.find(s=>s.id===sid);
  if(sec.type==="vocab") return go(viewVocab,uid,sid);
  if(sec.type==="check") return go(runCheck,U,sec);
  const rec=S.tier[sec.skill]||"B2"; let tier=rec, mode="practice";

  const modes=sec.type==="reading";
  const draw=()=>{
    app.innerHTML=`<div class="wrap narrow stack" style="gap:24px">
      <span class="label">Unit ${U.number} · ${esc(U.title)} · ${SEC_LABEL[sec.type]}</span>
      <h1>${esc(sec.title)}</h1>
      <p class="prose">${esc(sec.summary||"")}</p>
      <div class="stack tight"><strong>Level</strong><div class="seg" role="group" aria-label="Level">${TIERS.map(t=>`<button data-t="${t}" aria-pressed="${t===tier}"><strong>${t}</strong><span>${TIER_DESC[t]}${t===rec?" · recommended":""}</span></button>`).join("")}</div></div>
      ${modes?`<div class="stack tight"><strong>Mode</strong><div class="seg" role="group" aria-label="Mode"><button data-m="practice" aria-pressed="${mode==="practice"}"><strong>Practice</strong><span>Check as you go${tier!=="C1"?", hints":""}</span></button><button data-m="exam" aria-pressed="${mode==="exam"}"><strong>Exam</strong><span>Timer, no hints</span></button></div></div>`:""}
      ${S.support&&tier==="B1"?`<p class="note">Extra support is on: strategy tips, hints and fewer answer options.</p>`:""}
      <div class="row"><button class="btn primary" id="go">Start</button><button class="btn ghost" id="back">Back to the unit</button></div>
      ${hist.length?`<div class="stack tight"><span class="label">Your attempts</span>${hist.map(h=>`<div class="row small"><span class="chip">${h.tier}</span><span>${h.lvl?h.lvl+" level":h.pct+"%"}</span><span class="muted">${fmtDate(h.date)}${h.mode?" · "+h.mode:""}</span></div>`).join("")}</div>`:""}
    </div>`;
    $$("[data-t]").forEach(b=>b.onclick=()=>{tier=b.dataset.t;draw();});
    $$("[data-m]").forEach(b=>b.onclick=()=>{mode=b.dataset.m;draw();});
    $("#go").onclick=()=>{ const f={practice:runPractice,reading:runReading,listening:runListening,speaking:runSpeaking,writing:runWriting}[sec.type]; go(f,U,sec,tier,mode); };
    $("#back").onclick=()=>go(viewUnit,uid);
  };
  draw();
}

/* =========================================================
   QUIZ ENGINE · shared by grammar, reading, listening and the unit check
   ========================================================= */
const QT={
  tfng:{label:"True / False / Not Given",opts:["TRUE","FALSE","NOT GIVEN"],tip:"FALSE means the text says the opposite. NOT GIVEN means the text doesn’t say either way. Find the exact sentence before you decide."},
  ynng:{label:"Yes / No / Not Given",opts:["YES","NO","NOT GIVEN"],tip:"These questions are about the writer’s views. YES = the writer agrees, NO = the writer disagrees, NOT GIVEN = the writer doesn’t say."},
  head:{label:"Matching headings",tip:"Read the first and last sentences and ask what the whole paragraph is about. Ignore headings that match only one detail."},
  mcq:{label:"Multiple choice",tip:"Find the answer in the text first, then compare the options. Wrong options often repeat words from the text with a different meaning."},
  gap:{label:"Completion",tip:"Copy words exactly and check the word limit. The completed sentence must be grammatical."}
};
const INSTR={
  tfng:"Do the statements agree with the information in the text? Choose <b>TRUE</b>, <b>FALSE</b> or <b>NOT GIVEN</b>.",
  ynng:"Do the statements agree with the views of the writer? Choose <b>YES</b>, <b>NO</b> or <b>NOT GIVEN</b>.",
  head:"Choose the correct heading for each paragraph from the list below.",
  mcq:"Choose the correct answer.",
  gap:lim=>lim?`Complete the sentences. Write <b>${["","ONE WORD","NO MORE THAN TWO WORDS","NO MORE THAN THREE WORDS"][lim]||lim+" WORDS"}</b> for each answer.`:"Complete the sentences."
};
function qtAcc(type){const a=(S.qtypes[type]||[]).slice(-8);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null;}
function makeQuiz(groups,ctx){
  let n=0; const qs=[];
  const G=groups.map((g,gi)=>{
    const items=(g.qs||g.items||[]).map((q,qi)=>{
      const o=Object.assign({},q,{type:q.type||g.type,id:`q${gi}_${qi}`,n:++n,lim:q.lim??g.lim,headings:g.headings,group:gi});
      if(o.type==="mcq"){ let idx=o.o.map((_,i)=>i); if(ctx.reduce&&idx.length>3){const wrong=shuffle(idx.filter(i=>i!==o.a));idx=idx.filter(i=>i!==wrong[0]);} o.order=ctx.shuffle?shuffle(idx):idx; }
      if(o.type==="head"){ let idx=o.headings.map((_,i)=>i); if(ctx.reduce){const wrong=shuffle(idx.filter(i=>i!==o.a)).slice(0,2);idx=idx.filter(i=>i===o.a||wrong.includes(i));} o.order=idx; }
      qs.push(o); return o;
    });
    return Object.assign({},g,{items});
  });
  return {groups:G,qs,ans:{},checked:{},hint:{},plays:{},ctx};
}
function isRight(q,v){
  if(v===undefined||v===null||v==="") return false;
  if(q.type==="tfng"||q.type==="ynng") return v===q.a;
  if(q.type==="mcq"||q.type==="head") return Number(v)===q.a;
  if(q.type==="gap") return (!q.lim||wc(v)<=q.lim) && (q.acc||[]).map(norm).includes(norm(v));
  return false;
}
function answerText(q){
  if(q.type==="tfng"||q.type==="ynng") return q.a;
  if(q.type==="mcq") return q.o[q.a];
  if(q.type==="head") return ROMAN[q.a]+". "+q.headings[q.a];
  return (q.acc||[])[0]||"";
}
function givenText(q,v){
  if(v===undefined||v===null||v==="") return "No answer";
  if(q.type==="mcq") return q.o[Number(v)];
  if(q.type==="head") return ROMAN[Number(v)]+". "+q.headings[Number(v)];
  return String(v);
}
function groupHTML(Q,g,first,last){
  const c=Q.ctx, type=g.type||g.items[0].type;
  const acc=qtAcc(type);
  const tip=c.mode==="practice"&&QT[type]&&(c.tier==="B1"||S.support||(acc!==null&&acc<0.6));
  const instr=g.instr||(type==="gap"?INSTR.gap(g.lim):INSTR[type]||"");
  let h=`<div class="group" data-group="${g.items[0]&&g.items[0].group}">`;
  if(!c.noHeaders) h+=`<span class="label">Questions ${first}${last>first?"–"+last:""}${QT[type]?" · "+QT[type].label:""}</span>`;
  if(instr) h+=`<p class="instr">${instr}</p>`;
  if(tip) h+=`<p class="note"><b>Strategy:</b> ${esc(QT[type].tip)}</p>`;
  if(type==="head"&&g.headings) h+=`<div class="headlist"><span class="label">List of headings</span>${g.headings.map((x,i)=>`<div><span>${ROMAN[i]}</span>${esc(x)}</div>`).join("")}</div>`;
  g.items.forEach(q=>h+=qHTML(Q,q));
  return h+`</div>`;
}
function qHTML(Q,q){
  const c=Q.ctx, v=Q.ans[q.id], done=!!Q.checked[q.id];
  let input="";
  if(q.type==="tfng"||q.type==="ynng") input=`<div class="tf" role="group" aria-label="Answer">${QT[q.type].opts.map(o=>`<button type="button" data-tf="${q.id}" data-v="${o}" aria-pressed="${v===o}" ${done?"disabled":""}>${o}</button>`).join("")}</div>`;
  if(q.type==="mcq") input=`<div class="opts">${q.order.map((i,k)=>`<label><input type="radio" name="${q.id}" value="${i}" ${String(v)===String(i)?"checked":""} ${done?"disabled":""}><span><span class="let">${"ABCDEFG"[k]}</span>&nbsp; ${esc(q.o[i])}</span></label>`).join("")}</div>`;
  if(q.type==="head") input=`<select data-q="${q.id}" ${done?"disabled":""} aria-label="Heading for ${esc(q.p)}"><option value="">Choose a heading</option>${q.order.map(i=>`<option value="${i}" ${String(v)===String(i)?"selected":""}>${ROMAN[i]}. ${esc(q.headings[i])}</option>`).join("")}</select>`;
  if(q.type==="gap") input=`<input type="text" data-q="${q.id}" value="${esc(v||"")}" autocomplete="off" autocapitalize="off" spellcheck="false" ${done?"disabled":""} aria-label="Answer to question ${q.n}">${q.lim?`<span class="label">${q.lim===1?"One word":"Max "+q.lim+" words"}</span>`:""}`;
  const prompt=q.type==="head"?`<strong>${esc(q.p)}</strong>`:esc(q.p).replace(/___/g,"<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>");
  let pre="";
  if(q.text) pre+=`<p class="quote">${esc(q.text)}</p>`;
  if(q.listen){ const left=2-(Q.plays[q.id]||0); pre+=`<div class="row"><button type="button" class="btn small" data-listen="${q.id}" ${left<=0?"disabled":""}>Play recording</button><span class="small muted">${left} play${left===1?"":"s"} left</span></div>`; }
  let tools="";
  if(c.mode==="practice"&&!done){
    if(c.hints&&q.para){ tools+=Q.hint[q.id]?`<span class="small muted">Hint: look at <button type="button" class="link" data-jump="${q.para}">paragraph ${q.para}</button>${q.type==="gap"&&q.acc?`. The answer starts with “${esc(q.acc[0][0])}”`:""}.</span>`:`<button type="button" class="btn small ghost" data-hint="${q.id}">Hint</button>`; }
    tools+=`<button type="button" class="btn small" data-check="${q.id}">Check</button>`;
  }
  let fb="",cls="";
  if(done){ const ok=isRight(q,v); cls=ok?"ok":"no"; fb=`<div class="fb"><span class="verdict">${ok?"Correct":"Not quite"}${ok&&Q.hint[q.id]?" (with a hint)":""}</span>${ok?"":`<span>Answer: <strong>${esc(answerText(q))}</strong></span>`}${q.ex?`<span>${esc(q.ex)}</span>`:""}</div>`; }
  return `<div class="q ${cls}" id="box-${q.id}">${pre}<div class="qhead"><span class="qnum">${q.n}</span><div class="qtext">${prompt}</div></div>${input}${tools?`<div class="qtools">${tools}</div>`:""}${fb}</div>`;
}
function quizHTML(Q){ return Q.groups.map(g=>groupHTML(Q,g,g.items[0].n,g.items[g.items.length-1].n)).join(""); }
function refreshQ(Q,id){ const q=Q.qs.find(x=>x.id===id); const box=document.getElementById("box-"+id); if(!box) return; const t=document.createElement("div"); t.innerHTML=qHTML(Q,q); box.replaceWith(t.firstElementChild); Q.onChange&&Q.onChange(); }
function bindQuiz(Q,root,jump){
  root.addEventListener("click",e=>{
    const t=e.target.closest("button"); if(!t) return;
    if(t.dataset.tf){ Q.ans[t.dataset.tf]=t.dataset.v; t.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===t)); Q.onChange&&Q.onChange(); }
    if(t.dataset.hint){ Q.hint[t.dataset.hint]=true; refreshQ(Q,t.dataset.hint); }
    if(t.dataset.check){ const id=t.dataset.check; if(Q.ans[id]===undefined||Q.ans[id]===""){ t.textContent="Answer first"; return; } Q.checked[id]=true; refreshQ(Q,id); }
    if(t.dataset.jump&&jump) jump(t.dataset.jump);
    if(t.dataset.listen){ const id=t.dataset.listen, q=Q.qs.find(x=>x.id===id); Q.plays[id]=(Q.plays[id]||0)+1; TTS.say(q.listen,"en-GB","male"); refreshQ(Q,id); }
  });
  root.addEventListener("change",e=>{ const t=e.target; if(t.type==="radio"){Q.ans[t.name]=t.value;Q.onChange&&Q.onChange();} if(t.tagName==="SELECT"&&t.dataset.q){Q.ans[t.dataset.q]=t.value;Q.onChange&&Q.onChange();} });
  root.addEventListener("input",e=>{ const t=e.target; if(t.type==="text"&&t.dataset.q){Q.ans[t.dataset.q]=t.value;Q.onChange&&Q.onChange();} });
}
function answered(Q){return Q.qs.filter(q=>Q.ans[q.id]!==undefined&&Q.ans[q.id]!=="").length;}
function scoreQuiz(Q){
  let correct=0; const items=Q.qs.map(q=>{const ok=isRight(q,Q.ans[q.id]); if(ok) correct++; const credit=ok?(Q.hint[q.id]?0.5:1):0; (S.qtypes[q.type]=S.qtypes[q.type]||[]).push(credit); S.qtypes[q.type]=S.qtypes[q.type].slice(-30); return {q,ok,v:Q.ans[q.id]};});
  return {correct,total:Q.qs.length,pct:Q.qs.length?correct/Q.qs.length:0,items};
}
function reviewHTML(items){
  return `<div class="stack">${items.map(it=>{const q=it.q;return `<div class="q ${it.ok?"ok":"no"}">${q.text?`<p class="quote">${esc(q.text)}</p>`:""}<div class="qhead"><span class="qnum">${q.n}</span><div class="qtext">${esc(q.type==="head"?"Heading for "+q.p:q.p)}<div class="fb" style="margin-top:6px"><span class="verdict">${it.ok?"Correct":"Not quite"}</span><span>Your answer: ${esc(givenText(q,it.v))}${q.type==="gap"&&q.lim&&it.v&&wc(it.v)>q.lim?" (over the word limit)":""}</span>${it.ok?"":`<span>Answer: <strong>${esc(answerText(q))}</strong></span>`}${q.ex?`<span class="muted">${esc(q.ex)}</span>`:""}</div></div></div></div>`;}).join("")}</div>`;
}
function timerStart(minutes,onEnd){
  const deadline=Date.now()+minutes*60000;
  const tick=()=>{const left=Math.max(0,deadline-Date.now());const el=$("#timer");if(el){const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);el.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;el.classList.toggle("low",left<60000);} if(left<=0){T.clear();onEnd();}};
  tick(); T.every(tick,1000);
}

/* ---------- result screen ---------- */
function viewResult(o){
  const {U,sec,tier,res,msg,extra}=o;
  const nextTier=tier!=="C1"?upT(tier):null;
  app.innerHTML=`<div class="wrap narrow stack" style="gap:28px">
    <div class="score"><div class="big">${res.correct}<small>/${res.total}</small></div><div class="stack tight"><span class="label">${esc(U.title)} · ${esc(sec.title)} · ${tier}</span><h2>${Math.round(res.pct*100)}%</h2><p class="muted">${esc(msg||"")}</p></div></div>
    <div class="row"><button class="btn primary" id="toUnit">Back to the unit</button><button class="btn" id="again">Try again</button>${nextTier?`<button class="btn ghost" id="harder">Try it at ${nextTier}</button>`:""}</div>
    ${extra||""}
    <section class="stack"><span class="label">Review</span>${reviewHTML(res.items)}</section>
  </div>`;
  $("#toUnit").onclick=()=>go(viewUnit,U.id);
  $("#again").onclick=()=>go(viewSectionStart,U.id,sec.id);
  if($("#harder")) $("#harder").onclick=()=>{ const f={practice:runPractice,reading:runReading,listening:runListening}[sec.type]; go(f,U,sec,nextTier,"practice"); };
}

/* ---------- grammar practice ---------- */
function runPractice(U,sec,tier){
  const t=sec.tiers[tier];
  const Q=makeQuiz([{type:"mixed",qs:t.items}],{tier,mode:"practice",shuffle:true,reduce:false,hints:false,noHeaders:true});
  app.innerHTML=`<div class="wrap narrow stack" style="gap:24px">
    <div class="row between"><span class="label">${esc(U.title)} · Grammar · ${tier}</span><button class="link small" id="leave">Leave</button></div>
    <h1>${esc(sec.title)}</h1>
    <div class="card soft stack tight"><span class="label">Language notes</span>${(t.notes||[]).map(n=>`<p>${n}</p>`).join("")}</div>
    <div id="qz" class="qcol">${Q.groups.map(g=>g.items.map(q=>qHTML(Q,q)).join("")).join("")}</div>
    <div class="row between"><span class="small muted" id="cnt"></span><button class="btn primary" id="fin">Finish</button></div>
  </div>`;
  const upd=()=>{$("#cnt").textContent=`${answered(Q)}/${Q.qs.length} answered`;}; Q.onChange=upd; upd();
  bindQuiz(Q,$("#qz"));
  $("#leave").onclick=()=>go(viewUnit,U.id);
  $("#fin").onclick=()=>{ const res=scoreQuiz(Q); record(U.id,sec.id,tier,res.pct,"practice"); const msg=adapt(sec.skill,tier,res.pct); go(viewResult,{U,sec,tier,res,msg}); };
}

/* ---------- reading ---------- */
function runReading(U,sec,tier,mode){
  const R=sec.tiers[tier];
  const exam=mode==="exam";
  const Q=makeQuiz(R.groups,{tier,mode,shuffle:false,reduce:!exam&&(tier==="B1"||S.support),hints:!exam&&tier!=="C1"});
  let pane="passage";
  app.innerHTML=`<div class="reading" data-pane="passage">
    <div class="bar-top"><div class="inner">
      <div class="stack" style="gap:0"><span class="label">${esc(U.title)} · Reading · ${tier} · ${exam?"Exam":"Practice"}</span><strong>${esc(R.title)}</strong></div>
      <div class="row"><span class="timer" id="timer">${exam&&R.time?"":""}</span><span class="label" id="cnt"></span><button class="btn small ghost" id="leave">Leave</button><button class="btn small primary" id="fin">Finish</button></div>
      <div class="tabs" role="group" aria-label="View"><button data-pane="passage" aria-pressed="true">Passage</button><button data-pane="questions" aria-pressed="false">Questions</button></div>
    </div></div>
    <div class="wrap" style="padding-top:0"><div class="split">
      <article class="passage"><span class="label">Reading passage</span><h2>${esc(R.title)}</h2><div class="stack" style="gap:4px;margin-top:10px">${R.paras.map(p=>`<div class="para" id="p-${p.id}"><b>${p.id}</b><p>${esc(p.t)}</p></div>`).join("")}</div></article>
      <div class="qcol" id="qz">${quizHTML(Q)}<div class="row" style="justify-content:flex-end"><button class="btn primary" id="fin2">Finish and see results</button></div></div>
    </div></div>
  </div>`;
  const root=$(".reading");
  const setPane=p=>{pane=p;root.dataset.pane=p;$$(".tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.pane===p));window.scrollTo(0,0);};
  $$(".tabs button").forEach(b=>b.onclick=()=>setPane(b.dataset.pane));
  const jump=id=>{ if(matchMedia("(max-width:900px)").matches) setPane("passage"); const el=$("#p-"+id); if(el){el.scrollIntoView({behavior:"smooth",block:"center"});el.classList.add("flash");setTimeout(()=>el.classList.remove("flash"),1800);} };
  const upd=()=>{$("#cnt").textContent=`${answered(Q)}/${Q.qs.length}`;}; Q.onChange=upd; upd();
  bindQuiz(Q,$("#qz"),jump);
  const finish=()=>{ const res=scoreQuiz(Q); record(U.id,sec.id,tier,res.pct,mode); const msg=adapt("reading",tier,res.pct); go(viewResult,{U,sec,tier,res,msg}); };
  $("#fin").onclick=finish; $("#fin2").onclick=finish;
  $("#leave").onclick=()=>go(viewUnit,U.id);
  if(exam&&R.time) timerStart(R.time,()=>{toast("Time is up.");finish();}); else $("#timer").textContent=exam?"":"Untimed";
}

/* ---------- listening ---------- */
function runListening(U,sec,tier){
  const cfg=sec.tiers[tier];
  const tracks=cfg.tracks.map(id=>Object.assign({id},sec.tracks[id]));
  const groups=[]; tracks.forEach(t=>t.groups.forEach(g=>groups.push(Object.assign({},g,{track:t.id}))));
  const Q=makeQuiz(groups,{tier,mode:"exam",shuffle:false,reduce:false,hints:false});
  const firstOf={}; Q.groups.forEach((g,i)=>{ if(firstOf[g.track]===undefined) firstOf[g.track]=i; });
  const noVoice=!TTS.ok();
  let body="";
  Q.groups.forEach((g,i)=>{
    if(firstOf[g.track]===i){ const t=tracks.find(x=>x.id===g.track);
      body+=`<div class="player" id="pl-${t.id}"><div class="row between"><div class="stack" style="gap:2px"><span class="label">Recording</span><h3>${esc(t.title)}</h3></div><span class="chip" id="left-${t.id}">${cfg.plays} play${cfg.plays>1?"s":""}</span></div>
        <div class="prog"><i id="bar-${t.id}"></i></div><div class="speaking-now" id="now-${t.id}">${noVoice?"Your browser can’t play speech. Use the transcript below.":"Press play when you’re ready. Read the questions first."}</div>
        <div class="row"><button class="btn primary small" data-play="${t.id}" ${noVoice?"disabled":""}>Play</button>${cfg.pause?`<button class="btn small ghost" data-pause="${t.id}" disabled>Pause</button>`:""}</div>
        ${noVoice?`<details class="more"><summary>Transcript</summary><div class="script">${t.segments.map(s=>`<p><b>${esc((t.speakers[s.s]||{}).name||s.s)}</b>${esc(s.t)}</p>`).join("")}</div></details>`:""}
        ${t.audio?`<audio id="au-${t.id}" src="${esc(t.audio)}" preload="auto"></audio>`:""}</div>`; }
    body+=groupHTML(Q,g,g.items[0].n,g.items[g.items.length-1].n);
  });
  app.innerHTML=`<div class="wrap narrow stack" style="gap:24px">
    <div class="row between"><span class="label">${esc(U.title)} · Listening · ${tier}</span><button class="link small" id="leave">Leave</button></div>
    <h1>${esc(sec.title)}</h1>
    <p class="small muted">${cfg.plays===1?"You can play each recording once, as in the exam.":`You can play each recording ${cfg.plays} times.`} Speed: ${Math.round(cfg.rate*100)}%. Answers are checked at the end.</p>
    <div class="qcol" id="qz">${body}</div>
    <div class="row between"><span class="small muted" id="cnt"></span><button class="btn primary" id="fin">Finish and see results</button></div>
  </div>`;
  const P={};
  tracks.forEach(t=>{
    const voices=TTS.cast(t.speakers);
    const lines=[]; t.segments.forEach((s,si)=>TTS.split(s.t).forEach((x,k,arr)=>lines.push({text:x,voice:voices[s.s],seg:si,pause:k===arr.length-1?550:200})));
    P[t.id]={left:cfg.plays,pos:0,ctl:null,playing:false,lines};
  });
  const ui=id=>{ const p=P[id], t=tracks.find(x=>x.id===id);
    const pb=$(`[data-play="${id}"]`), pz=$(`[data-pause="${id}"]`);
    $("#left-"+id).textContent=`${p.left} play${p.left===1?"":"s"} left`;
    if(pb){ pb.disabled=p.playing||(p.left<=0&&p.pos===0); pb.textContent=p.pos>0&&!p.playing?"Resume":"Play"; }
    if(pz) pz.disabled=!p.playing;
  };
  const playTrack=id=>{
    const p=P[id], t=tracks.find(x=>x.id===id);
    Object.keys(P).forEach(k=>{ if(k!==id&&P[k].playing){ P[k].ctl&&P[k].ctl.stop(); P[k].playing=false; ui(k);} });
    const au=t.audio&&$("#au-"+id);
    if(p.pos===0){ if(p.left<=0) return; p.left--; }
    p.playing=true; ui(id);
    if(au){ au.playbackRate=cfg.rate; au.play(); au.ontimeupdate=()=>{$("#bar-"+id).style.width=(au.currentTime/(au.duration||1)*100)+"%";}; au.onended=()=>{p.playing=false;p.pos=0;au.currentTime=0;ui(id);$("#now-"+id).textContent="Finished.";}; p.ctl={stop(){au.pause();}}; p.au=au; return; }
    p.ctl=TTS.run(p.lines,cfg.rate,p.pos,(i,ln)=>{ p.pos=i; $("#bar-"+id).style.width=(i/p.lines.length*100)+"%"; const sp=t.speakers[t.segments[ln.seg].s]; $("#now-"+id).textContent=(sp&&sp.name&&Object.keys(t.speakers).length>1)?sp.name+" is speaking":"Playing"; },
      ok=>{ p.playing=false; p.pos=0; $("#bar-"+id).style.width="100%"; $("#now-"+id).textContent=ok?"Finished.":"Speech stopped."; ui(id); });
  };
  $("#qz").addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.play) playTrack(b.dataset.play);
    if(b.dataset.pause){ const p=P[b.dataset.pause]; if(p.au){p.au.pause();} else if(p.ctl){ const i=p.ctl.index; p.ctl.stop(); p.pos=i; } p.playing=false; $("#now-"+b.dataset.pause).textContent="Paused."; ui(b.dataset.pause); }
  });
  tracks.forEach(t=>ui(t.id));
  const upd=()=>{$("#cnt").textContent=`${answered(Q)}/${Q.qs.length} answered`;}; Q.onChange=upd; upd();
  bindQuiz(Q,$("#qz"));
  $("#leave").onclick=()=>go(viewUnit,U.id);
  $("#fin").onclick=()=>{
    const res=scoreQuiz(Q); record(U.id,sec.id,tier,res.pct,"exam"); const msg=adapt("listening",tier,res.pct);
    const extra=`<details class="more"><summary>Transcripts</summary><div class="stack">${tracks.map(t=>`<div class="stack tight"><strong>${esc(t.title)}</strong><div class="script">${t.segments.map(s=>`<p><b>${esc((t.speakers[s.s]||{}).name||s.s)}</b>${esc(s.t)}</p>`).join("")}</div></div>`).join("")}</div></details>`;
    go(viewResult,{U,sec,tier,res,msg,extra});
  };
}

/* =========================================================
   VOCABULARY · spaced repetition
   ========================================================= */
function drillsFor(w){ return ["meaning","word","recall",w.famQ?"family":null,w.col?"partner":null,w.para?"paraphrase":null].filter(Boolean); }
function wst(uid,w){ return S.words[uid+":"+w.id]; }
function dueAfter(stage){ if(stage<3) return 0; return [1,3,7,21,45][Math.min(stage-3,4)]*DAY; }
function viewVocab(uid,sid,tab){
  const U=MODULES[uid], sec=U.sections.find(s=>s.id===sid);
  let tier=S.tier.language||"B2"; tab=tab||"train";
  const draw=()=>{
    const ids=sec.sets[tier]||[], words=ids.map(id=>U.words.find(w=>w.id===id)).filter(Boolean);
    const now=Date.now(), neu=words.filter(w=>!wst(uid,w)).length, due=words.filter(w=>{const s=wst(uid,w);return s&&s.due<=now;}).length;
    const mastered=words.filter(w=>{const s=wst(uid,w);return s&&s.stage>=drillsFor(w).length;}).length;
    app.innerHTML=`<div class="wrap stack" style="gap:24px">
      <div class="row between"><span class="label">Unit ${U.number} · ${esc(U.title)} · Vocabulary</span><button class="link small" id="leave">Back to the unit</button></div>
      <h1>${esc(sec.title)}</h1>
      <div class="seg" role="group" aria-label="Word set">${TIERS.map(t=>`<button data-t="${t}" aria-pressed="${t===tier}"><strong>${t}</strong><span>${t===(S.tier.language||"B2")?"your level":"word set"}</span></button>`).join("")}</div>
      <div class="row"><button class="btn ${tab==="train"?"primary":"ghost"} small" data-tab="train">Train</button><button class="btn ${tab==="list"?"primary":"ghost"} small" data-tab="list">Word list</button></div>
      ${tab==="train"?`<div class="card soft stack">
        <div class="row" style="gap:28px"><div><span class="label">New</span><h2>${neu}</h2></div><div><span class="label">Due now</span><h2>${due}</h2></div><div><span class="label">Mastered</span><h2>${mastered}/${words.length}</h2></div></div>
        <p class="small">Each word goes through up to six steps: meaning, recall, spelling in context, word family, word partners and paraphrase. Words come back after 1, 3, 7 and 21 days.</p>
        <div class="row"><button class="btn primary" id="startV" ${neu+due===0?"disabled":""}>${neu+due===0?"Nothing due. Come back later":"Start a session"}</button></div>
      </div>`:`<div class="wordlist">${words.map(w=>{const s=wst(uid,w),st=s?s.stage:0,n=drillsFor(w).length;return `<div class="wcard"><div class="row between"><h3>${esc(w.word)}</h3><span class="chip">${w.cefr}</span></div><span class="label">${esc(w.pos)}</span><p class="small">${esc(w.def)}</p><p class="small muted"><i>${esc(w.ex)}</i></p>${w.fam&&w.fam.length?`<p class="small"><b>Family:</b> ${esc(w.fam.join(", "))}</p>`:""}<div class="meter" title="${st}/${n} steps">${Array.from({length:n},(_,i)=>`<i class="${i<st?"on":""}"></i>`).join("")}</div></div>`;}).join("")}</div>`}
    </div>`;
    $$("[data-t]").forEach(b=>b.onclick=()=>{tier=b.dataset.t;draw();});
    $$("[data-tab]").forEach(b=>b.onclick=()=>{tab=b.dataset.tab;draw();});
    $("#leave").onclick=()=>go(viewUnit,uid);
    if($("#startV")) $("#startV").onclick=()=>{
      const n=(sec.newPerSession||{})[tier]||8;
      const dueW=words.filter(w=>{const s=wst(uid,w);return s&&s.due<=Date.now();});
      const newW=words.filter(w=>!wst(uid,w)).slice(0,n);
      go(runVocabSession,[...dueW,...newW].map(w=>({uid,w,pool:U.words})),{done:()=>go(viewVocab,uid,sid),uid,sid,tier});
    };
  };
  draw();
}
function viewReview(){
  const now=Date.now(), items=[];
  for(const uid of unitIds()){ const U=MODULES[uid]; for(const w of U.words||[]){ const s=S.words[uid+":"+w.id]; if(s&&s.due<=now) items.push({uid,w,pool:U.words}); } }
  if(!items.length){ app.innerHTML=`<div class="wrap narrow stack" style="gap:20px"><span class="label">Vocabulary review</span><h1>All caught up</h1><p>No words are due right now. Start a vocabulary session in a unit to learn new words.</p><div class="row"><button class="btn primary" id="h">Back to the course</button></div></div>`; $("#h").onclick=()=>go(viewHome); return; }
  go(runVocabSession,shuffle(items),{done:()=>go(viewHome),review:true});
}
function runVocabSession(items,opt){
  const queue=items.slice(); let steps=0, right=0, total=0, last=null; const touched=new Set();
  const LIMIT=40;
  const pickOpts=(correct,all,n=4)=>shuffle([correct,...shuffle(all.filter(x=>x!==correct)).slice(0,n-1)]);
  const next=()=>{
    if(!queue.length||steps>=LIMIT) return end();
    let k=0; if(queue.length>1&&queue[0]===last) k=1;
    const it=queue.splice(k,1)[0]; last=it; steps++;
    const key=it.uid+":"+it.w.id; const st=S.words[key]||{stage:0,due:0,right:0,wrong:0};
    const list=drillsFor(it.w); const drill=list[Math.min(st.stage,list.length-1)];
    touched.add(key);
    showDrill(it,drill,ok=>{
      total++; if(ok) right++;
      if(ok){ st.stage=Math.min(st.stage+1,list.length); st.right++; st.due=Date.now()+(st.stage>=list.length?45*DAY:dueAfter(st.stage)); if(st.due<=Date.now()+1000) queue.push(it); }
      else { st.stage=Math.max(0,st.stage-1); st.wrong++; st.due=Date.now(); queue.splice(Math.min(2,queue.length),0,it); }
      S.words[key]=st; save();
    });
  };
  const showDrill=(it,drill,done)=>{
    const w=it.w; const pool=it.pool;
    let body="", answer=null, typed=false, accept=[];
    const sentence=s=>esc(s).replace(/___/g,"<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>");
    if(drill==="meaning"){ const opts=pickOpts(w.def,pool.map(x=>x.def)); answer=w.def; body=`<span class="label">What does it mean?</span><div class="word">${esc(w.word)}</div><span class="small muted">${esc(w.pos)}</span><div class="choices">${opts.map(o=>`<button data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>`; }
    if(drill==="word"){ const opts=pickOpts(w.word,pool.map(x=>x.word)); answer=w.word; body=`<span class="label">Which word matches?</span><p style="font-size:20px;font-weight:600">${esc(w.def)}</p><div class="choices">${opts.map(o=>`<button data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div>`; }
    if(drill==="recall"){ typed=true; accept=w.gapA||[w.word]; body=`<span class="label">Write the missing word</span><p style="font-size:20px">${sentence(w.gap)}</p><p class="small muted">Starts with “${esc(accept[0][0])}” · ${accept[0].length} letters · ${esc(w.def)}</p>`; }
    if(drill==="family"){ typed=true; accept=w.famQ.a; body=`<span class="label">Word family · use a form of <b>${esc(w.word)}</b></span><p style="font-size:20px">${sentence(w.famQ.s)}</p>`; }
    if(drill==="partner"){ const opts=shuffle(w.col.o.map((_,i)=>i)); answer=w.col.o[w.col.a]; body=`<span class="label">Word partners</span><p style="font-size:20px">${sentence(w.col.s)}</p><div class="choices">${opts.map(i=>`<button data-o="${esc(w.col.o[i])}">${esc(w.col.o[i])}</button>`).join("")}</div>`; }
    if(drill==="paraphrase"){ const opts=shuffle(w.para.o.map((_,i)=>i)); answer=w.para.o[w.para.a]; body=`<span class="label">Paraphrase · the IELTS skill</span><p>Which phrase means the same as <b>“${esc(w.para.s)}”</b>?</p><div class="choices">${opts.map(i=>`<button data-o="${esc(w.para.o[i])}">${esc(w.para.o[i])}</button>`).join("")}</div>`; }
    if(typed) body+=`<form id="tf" class="row" novalidate><input type="text" id="ti" autocomplete="off" autocapitalize="off" spellcheck="false" style="max-width:320px" aria-label="Your answer"><button class="btn primary" type="submit">Check</button></form>`;
    app.innerHTML=`<div class="wrap narrow stack" style="gap:20px">
      <div class="row between"><span class="label">${opt.review?"Review":"Vocabulary"} · ${steps}/${Math.min(LIMIT,steps+queue.length)}</span><button class="link small" id="stop">End session</button></div>
      <div class="pbar"><i style="width:${Math.round(steps/Math.min(LIMIT,steps+queue.length)*100)}%"></i></div>
      <div class="drill" id="drill">${body}<div id="fb" class="stack tight" role="status"></div></div>
    </div>`;
    $("#stop").onclick=end;
    const feedback=(ok,correctText)=>{
      $("#fb").innerHTML=`<p class="${ok?"":""}" style="font-weight:700;color:var(--${ok?"good":"bad"})">${ok?"Correct":"Not quite"}</p>${ok?"":`<p>Answer: <b>${esc(correctText)}</b></p>`}<p class="small muted"><b>${esc(w.word)}</b> · ${esc(w.def)}</p><p class="small muted"><i>${esc(w.ex)}</i></p><div class="row"><button class="btn primary" id="nx">Next</button></div>`;
      $("#nx").focus(); $("#nx").onclick=()=>{ done(ok); next(); };
    };
    if(typed){ $("#ti").focus(); $("#tf").onsubmit=e=>{ e.preventDefault(); const v=$("#ti").value; if(!v.trim()) return; const ok=accept.map(norm).includes(norm(v)); $("#ti").disabled=true; $("#tf button").disabled=true; feedback(ok,accept[0]); }; }
    else $$(".choices button").forEach(b=>b.onclick=()=>{ const ok=b.dataset.o===answer; $$(".choices button").forEach(x=>{x.disabled=true;if(x.dataset.o===answer)x.classList.add("right");}); if(!ok) b.classList.add("wrong"); feedback(ok,answer); });
  };
  const end=()=>{
    const pct=total?right/total:0;
    let msg="";
    if(!opt.review&&total){ const U=MODULES[opt.uid]; record(opt.uid,opt.sid,opt.tier,pct,"vocab"); }
    save();
    const words=[...touched].map(k=>{const [uid,id]=k.split(":");const w=(MODULES[uid].words||[]).find(x=>x.id===id);return {w,s:S.words[k]};});
    app.innerHTML=`<div class="wrap narrow stack" style="gap:24px">
      <div class="score"><div class="big">${right}<small>/${total}</small></div><div class="stack tight"><span class="label">${opt.review?"Review":"Vocabulary session"} complete</span><h2>${Math.round(pct*100)}% first time</h2><p class="muted">Words you know well come back less often. Words you missed come back sooner.</p></div></div>
      <div class="stack tight">${words.map(({w,s})=>`<div class="row between small" style="border-bottom:1px dotted var(--line);padding-block:6px"><b>${esc(w.word)}</b><span class="muted">${s.stage>=drillsFor(w).length?"Mastered":s.due<=Date.now()?"Due again soon":"Next review "+fmtDate(s.due)}</span></div>`).join("")}</div>
      <div class="row"><button class="btn primary" id="dn">Done</button></div>
    </div>`;
    $("#dn").onclick=opt.done;
  };
  next();
}

const DEFAULT_SELFCHECK=[{"id": "fluency", "label": "Fluency", "d": {"A2": "I often stopped and found it hard to continue.", "B1": "I kept going, but paused often to find words.", "B2": "I spoke at a fairly even pace with few long pauses.", "C1": "I spoke fluently and naturally, almost without effort."}}, {"id": "range", "label": "Vocabulary range", "d": {"A2": "I only used very simple words.", "B1": "I used everyday words and a few topic words.", "B2": "I used topic words and some less common expressions.", "C1": "I used a wide range, including idiomatic language, to say exactly what I meant."}}, {"id": "accuracy", "label": "Grammar accuracy", "d": {"A2": "My errors often made my meaning unclear.", "B1": "I made errors, but my meaning was clear.", "B2": "I made few errors that caused confusion and corrected some myself.", "C1": "Errors were rare, even in complex sentences."}}, {"id": "coherence", "label": "Organisation", "d": {"A2": "My ideas were short and not really connected.", "B1": "I linked ideas with simple words like and, but, because.", "B2": "I used a variety of linking words to connect my ideas clearly.", "C1": "My answers were well organised, with clear structure and smooth links."}}, {"id": "pron", "label": "Pronunciation", "d": {"A2": "Listeners would often find me hard to understand.", "B1": "I was understandable, though my accent sometimes caused problems.", "B2": "My pronunciation was clear and generally natural.", "C1": "I varied stress and intonation to express meaning."}}];
const DEFAULT_CHECKLIST=["My introduction makes my position clear.", "I answered every part of the question.", "Each body paragraph has one clear main idea.", "I supported my ideas with reasons or examples.", "My conclusion sums up my view without adding new ideas."];

      <div class="row">${[1,2,3].map(p=>`<button class="btn small ${p===part?"primary":"ghost"}" data-part="${p}">Part ${p}</button>`).join("")}<button class="btn small ${part===4?"primary":"ghost"}" data-part="4">Self-check</button></div>
      ${part<4?`<div class="card soft stack tight">
        <div class="row"><label class="row small"><input type="checkbox" id="useRec" ${useRec?"checked":""} ${REC.ok()?"":"disabled"}> Record my answers</label>${REC.SR?`<label class="row small"><input type="checkbox" id="useTr" ${useTr?"checked":""}> Live transcript</label>`:""}</div>
        <p class="small muted">${REC.ok()?"Recordings stay on this device and are deleted when you leave this page.":"Recording isn’t available in this browser. You can still practise with the timers."}${REC.SR?" The live transcript uses your browser’s speech service.":""}</p>

      ${phrases.length?`<div class="phrases">${phrases.map(p=>`<span>${esc(p)}</span>`).join("")}</div>`:""}

    ${sec.selfcheck.map(c=>`<fieldset class="stack tight" style="border:0;padding:0;margin:0"><legend><strong>${esc(c.label)}</strong></legend><div class="sc">${LV.map(L=>`<label><input type="radio" name="sc-${c.id}" value="${L}"><span><span class="chip">${L}</span> ${esc(c.d[L])}</span></label>`).join("")}</div></fieldset>`).join("")}

  const metrics=()=>{

    return `<div class="card soft stack tight"><span class="label">From your transcripts</span><div class="wstats"><span>${m.words} words</span><span>${m.wpm} words/min</span><span>${m.fillers} fillers</span></div><p class="small">${m.wpm<90?"Your pace is slow. Practise answering without long pauses.":m.wpm>170?"You speak fast. Make sure every word is clear.":"Your pace is in a comfortable range."} ${m.unitW.length?"Topic words you used: <b>"+esc(m.unitW.join(", "))+"</b>.":"Try to use words from this unit’s vocabulary."}</p></div>`; };

    if($("#prepGo")) $("#prepGo").onclick=()=>{ let left=cfg.prep; $("#prepGo").disabled=true; const id=T.every(()=>{ left--; $("#prepT").textContent=fmt(Math.max(0,left)); if(left<=0){ clearInterval(id); toast("Preparation time is over. Start speaking."); const b=$('[data-ans="p2-0"]'); if(b){ b.scrollIntoView({block:"center"}); startAnswer("p2-0",cfg.talk,b); } } },1000); };

      const lvl=LV[median(Object.values(sel).map(li))];
      const m=metrics();
      S.speaking.push({uid:U.id,tier,date:Date.now(),self:sel,level:lvl,metrics:m?{words:m.words,wpm:m.wpm,fillers:m.fillers}:null,answered:Object.keys(answers).length});

      app.innerHTML=`<div class="wrap narrow stack" style="gap:24px"><div class="score"><div class="big">${lvl}</div><div class="stack tight"><span class="label">Speaking · self-assessed</span><h2>Indicative IELTS ${BAND[lvl]}</h2><p class="muted">Your next speaking tasks will be at ${S.tier.speaking}.${before&&before!==lvl?` (Before: ${before})`:""}</p></div></div>
        <div class="stack tight">${sec.selfcheck.map(c=>`<div class="row small"><span class="chip ${li(sel[c.id])>=2?"lv":""}">${sel[c.id]}</span><b>${esc(c.label)}</b><span class="muted">${esc(c.d[sel[c.id]])}</span></div>`).join("")}</div>
        <p class="small muted">Self-assessment is a starting point. Send your progress to your teacher, and record yourself again next unit to compare.</p>
