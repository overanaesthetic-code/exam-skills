<!doctype html>
<html lang="en">
<head>
<title>IELTS Ladder</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=Manrope:wght@300..800&display=swap">
<style>
/* Layout: sticky top bar; one centred column (max 1100px) with cards only where an object needs setting apart; reading uses a passage/questions split */
:root{
  --bg:#ffffff; --surface:#fbf7fa; --ink:#151217; --muted:#6c6370; --line:#ece4ea;
  --accent:#FF2E93; --accent-ink:#ffffff; --accent-soft:#ffe6f2;
  --good:#0d8458; --good-soft:#e3f5ec; --bad:#c62f2f; --bad-soft:#fdeaea; --warn:#9a6a00; --warn-soft:#fff4d6; --hl:#fff1a8;
  --t1:#FF2E93; --t2:#2a6fd6; --t3:#0d8458; --t4:#b26b00; --warm:#b3aaa1;
  --display:"Bebas Neue","Oswald","Arial Narrow",Impact,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121014; --surface:#1b171d; --ink:#f5eff3; --muted:#a79ead; --line:#2d2730;
  --accent:#ff53a6; --accent-ink:#1c0611; --accent-soft:#3a1529;
  --good:#52d49d; --good-soft:#123024; --bad:#ff8080; --bad-soft:#3b1718; --warn:#f0c040; --warn-soft:#3a2f10; --hl:#5a4a12; --t1:#ff53a6; --t2:#7fb0ff; --t3:#52d49d; --t4:#f0c040; --warm:#6f665e; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121014; --surface:#1b171d; --ink:#f5eff3; --muted:#a79ead; --line:#2d2730;
  --accent:#ff53a6; --accent-ink:#1c0611; --accent-soft:#3a1529;
  --good:#52d49d; --good-soft:#123024; --bad:#ff8080; --bad-soft:#3b1718; --warn:#f0c040; --warn-soft:#3a2f10; --hl:#5a4a12; --t1:#ff53a6; --t2:#7fb0ff; --t3:#52d49d; --t4:#f0c040; --warm:#6f665e; color-scheme:dark}

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
.wrap{max-width:1100px;margin:0 auto;padding-inline:18px;padding-block:24px 72px}
.narrow{max-width:720px}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.02em;line-height:1;margin:0;text-wrap:balance}
h1{font-size:clamp(46px,9vw,84px)}
h2{font-size:clamp(30px,5vw,40px)}
h3{font-size:24px}
p{margin:0}
a{color:var(--accent)}
.label{font-family:var(--mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.small{font-size:14px}
.stack{display:flex;flex-direction:column;gap:16px}
.stack.tight{gap:8px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.section{padding-block:28px;border-bottom:1px solid var(--line);display:grid;gap:18px}
.section:last-child{border-bottom:0}
.prose{max-width:65ch}
.prose p+p{margin-top:10px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{appearance:none;border:1.5px solid var(--ink);background:transparent;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;line-height:1.2;text-decoration:none;display:inline-flex;align-items:center;gap:8px;color:var(--ink)}
.btn:hover{background:var(--surface)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.small{padding:6px 12px;font-size:14px}
.btn.ghost{border-color:var(--line)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.armed{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.4;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;color:var(--ink)}
.chip.lv{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.accent{background:var(--accent-soft);border-color:transparent}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.card{border:1px solid var(--line);border-radius:14px;padding:18px;background:var(--bg)}
.card.soft{background:var(--surface);border-color:transparent}
.note{font-size:14px;background:var(--accent-soft);border-radius:10px;padding:10px 12px}
.note.warn{background:var(--warn-soft)}
input[type=text],input[type=search],select,textarea{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);width:100%}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none}
textarea{resize:vertical;line-height:1.6}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1.5px solid var(--ink)}
.topbar .inner{max-width:1100px;margin:0 auto;padding-inline:18px;padding-block:10px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.brand{font-family:var(--display);font-size:28px;letter-spacing:.03em;line-height:1;background:none;border:0;padding:0;cursor:pointer;color:var(--ink)}
.brand span{color:var(--accent)}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{background:none;border:1px solid transparent;border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink)}
.nav button:hover{border-color:var(--line)}
.nav .count{font-family:var(--mono);font-size:11px;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:1px 6px;margin-left:4px}

/* gate */
.gate{min-height:70vh;display:grid;align-content:center;gap:28px;max-width:640px;margin:0 auto}
.gate h1 span{color:var(--accent)}
.codein{font-family:var(--mono);font-size:22px;letter-spacing:.12em;text-transform:uppercase}
.err{color:var(--bad);font-size:14px;min-height:1.4em}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:end;padding-block:8px 28px;border-bottom:1.5px solid var(--ink)}
.biglv{font-family:var(--display);font-size:clamp(96px,18vw,160px);line-height:.8;color:var(--accent)}
@media (max-width:560px){.hero{grid-template-columns:1fr;gap:12px}}
.profile{display:grid;gap:12px}
.prow{display:grid;grid-template-columns:170px 1fr 92px;gap:14px;align-items:center}
.scale{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.scale i{height:10px;border-radius:3px;background:var(--line)}
.scale i.on{background:var(--ink)}
.scale i.top{background:var(--accent)}
.scale-labels{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-family:var(--mono);font-size:10px;color:var(--muted)}
@media (max-width:640px){.prow{grid-template-columns:1fr 84px}.prow .scalebox{grid-column:1/-1;grid-row:2}}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,160px),1fr));gap:12px}
.unit{display:grid;gap:8px;align-content:start;padding:16px;border:1px solid var(--line);border-radius:14px;text-align:left;background:var(--bg);cursor:pointer;color:var(--ink);min-height:140px;min-width:0}
.unit:hover{border-color:var(--ink)}
.unit .num{font-family:var(--display);font-size:46px;line-height:.85;color:var(--line)}
.unit.open .num{color:var(--ink)}
.unit.done .num{color:var(--accent)}
.unit.locked{cursor:default}
.unit.locked:hover{border-color:var(--line)}
.unit h3{font-size:22px}
.continue{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:center}
@media (max-width:560px){.continue{grid-template-columns:1fr}}

/* unit page */
.uhero{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:end;padding-block:8px 24px;border-bottom:1.5px solid var(--ink)}
.uhero .num{font-family:var(--display);font-size:clamp(90px,16vw,150px);line-height:.8;color:var(--accent)}
@media (max-width:560px){.uhero{grid-template-columns:1fr;gap:6px}}
.seclist{display:grid;border-top:1px solid var(--line)}
.secrow{display:grid;grid-template-columns:150px 1fr auto;gap:16px;align-items:center;padding-block:16px;border-bottom:1px solid var(--line)}
.secrow .meta{display:grid;gap:4px;min-width:0}
@media (max-width:640px){.secrow{grid-template-columns:1fr}.secrow .act{justify-self:start}}

/* choosers */
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 14px;cursor:pointer;text-align:left;display:grid;gap:2px;min-width:110px;color:var(--ink)}
.seg button strong{font-family:var(--display);font-weight:400;font-size:26px;line-height:1}
.seg button span{font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.seg button[aria-pressed="true"] span{color:var(--bg);opacity:.8}

/* quiz */
.bar-top{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px}
.bar-top .inner{max-width:1100px;margin:0 auto;padding-inline:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.timer{font-family:var(--mono);font-size:20px;font-variant-numeric:tabular-nums;font-weight:500}
.timer.low{color:var(--bad)}
.tabs{display:none;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden;width:100%}
.tabs button{flex:1;border:0;background:transparent;padding:8px;font-weight:600;cursor:pointer;color:var(--ink)}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.split{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:36px;align-items:start;padding-top:20px}
.passage{position:sticky;top:130px;max-height:calc(100vh - 150px);overflow:auto;padding-right:6px}
.passage h2{margin-bottom:6px}
.para{display:grid;grid-template-columns:28px 1fr;gap:8px;padding:8px 6px;border-radius:8px;transition:background .6s}
.para b{font-family:var(--display);font-size:24px;line-height:1.1;color:var(--accent);font-weight:400}
.para p{max-width:62ch}
.para.flash{background:var(--hl)}
@media (prefers-reduced-motion:reduce){.para{transition:none}}
@media (max-width:900px){
  .tabs{display:flex}
  .split{grid-template-columns:minmax(0,1fr);gap:20px}
  .passage{position:static;max-height:none;overflow:visible;padding-right:0}
  .reading[data-pane="passage"] .qcol{display:none}
  .reading[data-pane="questions"] .passage{display:none}
}
.qcol{display:grid;gap:28px;min-width:0}
.group{display:grid;gap:14px}
.instr{font-size:14px;border-left:3px solid var(--accent);padding-left:12px}
.headlist{font-size:14px;display:grid;gap:4px;border:1px solid var(--line);border-radius:10px;padding:10px 14px}
.headlist div{display:grid;grid-template-columns:34px 1fr;gap:6px}
.headlist span{font-family:var(--mono)}
.q{display:grid;gap:10px;padding:14px;border:1px solid var(--line);border-radius:12px;min-width:0}
.q.ok{border-color:var(--good);background:var(--good-soft)}
.q.no{border-color:var(--bad);background:var(--bad-soft)}
.qhead{display:flex;gap:10px;align-items:flex-start}
.qnum{font-family:var(--display);font-size:26px;line-height:1;min-width:28px}
.qtext{flex:1;min-width:0}
.quote{font-size:15px;border-left:3px solid var(--line);padding-left:12px;font-style:italic}
.opts{display:grid;gap:6px}
.opts label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer;background:var(--bg)}
.opts label:has(input:checked){border-color:var(--ink)}
.opts input{margin-top:5px;accent-color:var(--accent)}
.opts .let{font-family:var(--mono);font-weight:500}
.tf{display:flex;flex-wrap:wrap;gap:6px}
.tf button{border:1.5px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 12px;font-family:var(--mono);font-size:13px;letter-spacing:.04em;cursor:pointer;color:var(--ink)}
.tf button[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.q input[type=text],.q select{max-width:340px}
.qtools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.fb{font-size:14px;display:grid;gap:4px}
.fb .verdict{font-weight:700}
.q.ok .verdict{color:var(--good)}
.q.no .verdict{color:var(--bad)}

/* player */
.player{display:grid;gap:12px;border:1.5px solid var(--ink);border-radius:14px;padding:16px}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.speaking-now{font-family:var(--mono);font-size:12px;color:var(--muted);min-height:1.4em}
.script{display:grid;gap:8px;font-size:15px}
.script p b{font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-right:6px}

/* vocab */
.drill{display:grid;gap:18px;max-width:640px}
.drill .word{font-family:var(--display);font-size:clamp(48px,10vw,72px);line-height:.9}
.choices{display:grid;gap:8px}
.choices button{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:12px 14px;cursor:pointer;color:var(--ink)}
.choices button:hover:not(:disabled){border-color:var(--ink)}
.choices button.right{border-color:var(--good);background:var(--good-soft)}
.choices button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.dots{display:flex;gap:4px;flex-wrap:wrap}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.wordlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.wcard{border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:6px;align-content:start}
.wcard h3{font-size:28px}
.meter{display:flex;gap:3px}
.meter i{flex:1;height:5px;border-radius:2px;background:var(--line)}
.meter i.on{background:var(--good)}

/* speaking */
.cue{border:1.5px solid var(--ink);border-radius:14px;padding:18px;display:grid;gap:10px}
.cue ul{margin:0;padding-left:20px}
.rec{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.recdot{width:10px;height:10px;border-radius:50%;background:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.recdot{animation:none}}
.transcript{font-size:14px;color:var(--muted);font-style:italic}
.sc{display:grid;gap:8px}
.sc label{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1.5px solid var(--line);border-radius:8px;cursor:pointer}
.sc label:has(input:checked){border-color:var(--ink)}
.sc input{margin-top:5px;accent-color:var(--accent)}
.phrases{display:flex;flex-wrap:wrap;gap:6px}
.phrases span{border:1px dashed var(--line);border-radius:8px;padding:4px 10px;font-size:14px}

/* writing */
.wtask{border-left:4px solid var(--accent);padding:4px 0 4px 16px;font-size:18px;font-weight:600;max-width:70ch}
.frame{display:grid;gap:8px}
.frame div{border:1px dashed var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.essay{min-height:340px;font-size:16px}
.wstats{display:flex;gap:16px;flex-wrap:wrap;font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums}
.crit{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.crit .card{display:grid;gap:8px;align-content:start}
.crit ul,.issues ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:14px}
.marked{white-space:pre-wrap;line-height:1.8;font-size:15px;border:1px solid var(--line);border-radius:12px;padding:16px;overflow-wrap:anywhere}
.marked mark{background:var(--bad-soft);color:inherit;border-bottom:2px solid var(--bad);padding:0 1px;cursor:help}
.marked mark.sp{background:var(--warn-soft);border-color:var(--warn)}
.marked mark.st{background:transparent;border-bottom:2px dotted var(--muted)}
.issue{display:grid;gap:2px;padding-block:8px;border-bottom:1px dotted var(--line);font-size:14px}
.model{white-space:pre-wrap;font-size:15px;line-height:1.7;max-width:70ch}

/* results */
.score{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:end;padding-block:12px 24px;border-bottom:1.5px solid var(--ink)}
.score .big{font-family:var(--display);font-size:clamp(84px,18vw,140px);line-height:.8;color:var(--accent)}
.score .big small{font-size:.4em;color:var(--ink)}
@media (max-width:560px){.score{grid-template-columns:1fr}}
.pbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--accent)}
.loader{min-height:50vh;display:grid;place-content:center;gap:10px;text-align:center}
details.more{border:1px solid var(--line);border-radius:12px;padding:12px 16px}
details.more summary{cursor:pointer;font-weight:600}
details.more[open] summary{margin-bottom:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:14px;z-index:50}

/* ---- section hub ---- */
.steps{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.steps button{background:none;border:0;border-bottom:3px solid transparent;padding:10px 14px;font-weight:600;cursor:pointer;color:var(--muted);display:inline-flex;gap:8px;align-items:center;font-size:15px}
.steps button[aria-selected="true"]{color:var(--ink);border-color:var(--accent)}
.steps .n{font-family:var(--mono);font-size:11px;border:1px solid currentColor;border-radius:999px;padding:0 6px}

/* ---- tip cards ---- */
.tips{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px}
.tip{border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:14px;align-content:start;background:var(--bg);min-width:0}
.tip h3{font-size:26px}
.tip-say{font-size:14px;color:var(--muted)}
@media (min-width:700px){.tip-compare,.tip-demo,.tip-cloud{grid-column:span 2}}
.v-flow{display:grid}
.v-step{display:grid;grid-template-columns:30px 1fr;column-gap:10px;position:relative;padding-bottom:12px}
.v-step:last-child{padding-bottom:0}
.v-step .v-n{grid-row:span 2;width:30px;height:30px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-family:var(--mono);font-size:13px;z-index:1}
.v-step:not(:last-child)::before{content:"";position:absolute;left:14px;top:30px;bottom:0;width:2px;background:var(--line)}
.v-step:last-child .v-n{background:var(--accent);color:var(--accent-ink)}
.v-step b{grid-column:2;font-size:15px;align-self:center;padding-top:4px}
.v-step small{grid-column:2;color:var(--muted);font-size:13px}
.v-formula{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.v-part{border:1.5px solid var(--ink);border-radius:12px;padding:8px 12px;display:grid;gap:2px;align-content:center;min-width:0}
.v-part b{font-family:var(--display);font-size:22px;font-weight:400;line-height:1;letter-spacing:.02em}
.v-part small{font-size:12px;color:var(--muted)}
.v-op{font-family:var(--display);font-size:30px;color:var(--accent);align-self:center;line-height:1}
.v-part.v-res{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.v-part.v-res small{color:var(--accent-ink);opacity:.85}
.v-dec{display:grid;gap:6px}
.v-q{border:1.5px solid var(--ink);border-radius:12px;padding:8px 12px;font-weight:600;font-size:14px}
.v-br{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding-left:14px}
.v-lab{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.v-out{font-family:var(--mono);font-size:12px;letter-spacing:.05em;padding:4px 10px;border-radius:999px;background:var(--ink);color:var(--bg)}
.v-out.good{background:var(--good);color:var(--bg)}
.v-out.bad{background:var(--bad);color:var(--bg)}
.v-out.acc{background:var(--accent);color:var(--accent-ink)}
.v-down{padding-left:14px;font-family:var(--mono);font-size:11px;color:var(--muted)}
.v-demo{font-size:13px;line-height:1.6;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:8px;background:var(--surface)}
.v-demo p{color:var(--muted)}
.v-demo mark{background:var(--hl);color:var(--ink);border-radius:3px;padding:0 2px;transition:background .3s,color .3s}
.v-demo.anim mark{background:transparent;color:var(--muted)}
.v-demo.anim mark.lit{background:var(--hl);color:var(--ink)}
@media (prefers-reduced-motion:reduce){.v-demo mark{transition:none}}
.v-pairs{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:6px 8px;align-items:center;font-size:14px}
.v-pairs .h{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.v-pairs .a{background:var(--surface);border-radius:8px;padding:6px 10px}
.v-pairs .b{background:var(--accent-soft);border-radius:8px;padding:6px 10px;font-weight:600}
.v-pairs .ar{color:var(--accent);font-weight:700}
.v-blocks{display:grid;gap:10px}
.v-blk{display:grid;gap:4px}
.v-blk .top{display:flex;justify-content:space-between;gap:8px;font-size:14px}
.v-blk .top span{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.v-bar{height:14px;border-radius:4px;background:var(--ink)}
.v-blk:nth-child(odd) .v-bar{background:var(--accent)}
.v-blk small{font-size:12px;color:var(--muted)}
.v-trend,.v-tl{width:100%;height:auto;display:block}
.tr-base{fill:none;stroke:var(--line);stroke-width:2}
.tr-seg{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.tr-lab{font:600 11px var(--body)}
.t0{stroke:var(--t1)} .t1{stroke:var(--t2)} .t2{stroke:var(--t3)} .t3{stroke:var(--t4)}
text.t0{fill:var(--t1);stroke:none} text.t1{fill:var(--t2);stroke:none} text.t2{fill:var(--t3);stroke:none} text.t3{fill:var(--t4);stroke:none}
.tl-ax{stroke:var(--ink);stroke-width:2}
.tl-t{font:500 10px var(--mono);fill:var(--muted);letter-spacing:.08em}
.tl-now{fill:var(--ink)}
.tl-dot{fill:var(--accent)}
.tl-l{font:600 12px var(--body);fill:var(--ink)}
.tl-c{font:500 10px var(--mono);fill:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tl-c.acc{fill:var(--accent)}
.tl-span{stroke:var(--accent);stroke-width:4;stroke-linecap:round}
.tl-arrow{fill:var(--accent)}
.v-dd{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.v-dd ul{margin:6px 0 0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px}
.v-dd li{display:grid;grid-template-columns:18px 1fr;gap:6px}
.v-dd .do li::before{content:"✓";color:var(--good);font-weight:700}
.v-dd .dont li::before{content:"✕";color:var(--bad);font-weight:700}
@media (max-width:420px){.v-dd{grid-template-columns:1fr}}
.v-anat{display:grid;gap:10px}
.v-anat p{font-size:15px;line-height:2}
.seg{border-bottom:3px solid var(--t1);padding-bottom:1px}
.seg.c1{border-color:var(--t2)} .seg.c2{border-color:var(--t3)} .seg.c3{border-color:var(--t4)}
.legend{display:grid;gap:4px;font-size:13px}
.legend span{display:flex;gap:8px;align-items:center}
.legend i{width:16px;height:4px;border-radius:2px;flex:none;background:var(--t1)}
.legend i.c1{background:var(--t2)} .legend i.c2{background:var(--t3)} .legend i.c3{background:var(--t4)}
.v-cmp{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:18px}
.v-cloud{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;justify-content:center;padding:6px}
.v-cloud button{background:none;border:0;cursor:pointer;color:var(--ink);font-family:var(--display);line-height:1.05;padding:2px;letter-spacing:.02em}
.v-cloud button.c1x{color:var(--accent)}
.v-cloud button.used{color:var(--good);text-decoration:line-through;text-decoration-thickness:2px}
.v-cloud button:hover{text-decoration:underline}
.vw{background:var(--accent-soft);border:0;border-bottom:2px solid var(--accent);padding:0 3px;border-radius:3px;font:inherit;color:inherit;cursor:pointer;line-height:inherit}
.defpop{max-width:min(92vw,520px);border-radius:14px;text-align:left}

/* ---- drills ---- */
.dbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 54px);z-index:9;background:var(--bg);border-bottom:1.5px solid var(--ink);padding-block:12px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.target{font-size:20px;font-weight:700;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.text{display:grid;gap:4px;max-width:75ch}
.tk{cursor:pointer;border-radius:4px;padding:0 1px;transition:background .2s}
.tk:hover{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.tk.hit{background:var(--good-soft);color:var(--good);font-weight:700}
.tk.miss{background:var(--bad-soft);color:var(--bad)}
.tk.sel{background:var(--accent);color:var(--accent-ink)}
.tk.key{box-shadow:0 0 0 2px var(--good)}
.skimtext p{color:var(--muted)}
.skimtext p strong{color:var(--ink);font-weight:600}
.ord{display:grid;gap:8px}
.ord .zone{min-height:56px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:grid;gap:6px}
.ord button.part{text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;cursor:pointer;color:var(--ink);display:flex;gap:10px;align-items:baseline;font-size:15px}
.ord .zone:first-of-type button.part{border-color:var(--ink)}
.ord .lab{font-family:var(--mono);font-size:11px;color:var(--accent);min-width:74px;text-transform:uppercase;letter-spacing:.05em}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:10px;align-items:center;padding:8px;border-bottom:1px dotted var(--line);border-radius:8px}
.mrow.ok{background:var(--good-soft)} .mrow.no{background:var(--bad-soft)}
@media (max-width:600px){.mrow{grid-template-columns:1fr}}
.dsplit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.dsplit>.dside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px)}
@media (max-width:900px){.dsplit{grid-template-columns:1fr}.dsplit>.dside{position:static}}
.checks{display:grid;gap:6px}
.checks div{display:grid;grid-template-columns:22px 1fr;gap:6px;font-size:14px}
.checks .y::before{content:"✓";color:var(--good);font-weight:700}
.checks .n::before{content:"✕";color:var(--bad);font-weight:700}
.copied{background:var(--warn-soft);border-bottom:2px solid var(--warn)}

/* ---- charts ---- */
.chart{margin:0;display:grid;gap:6px}
.chart svg{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font:11px var(--mono)}
.chart .cat{fill:var(--ink);font:12px var(--body)}
.chart .val{fill:var(--ink);font:11px var(--mono)}
.chart .s0{stroke:var(--accent);fill:var(--accent)} .chart .s1{stroke:var(--ink);fill:var(--ink)} .chart .s2{stroke:var(--t2);fill:var(--t2)}
.chart polyline.ln{fill:none;stroke-width:2.5}
.chart .lab{font:600 12px var(--body);stroke:none}
.chart .b0{fill:var(--muted)} .chart .b1{fill:var(--accent)}

/* ---- speaking ---- */
.spk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
.spk-main{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);display:grid;gap:14px;z-index:5}
.qcard{border:1.5px solid var(--ink);border-radius:16px;padding:20px;display:grid;gap:14px;background:var(--bg)}
.qbig{font-size:clamp(19px,2.4vw,26px);font-weight:700;line-height:1.3}
.tbar{height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.tbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .9s linear}
.tbar i.over{background:var(--bad)}
.qdots{display:flex;gap:5px;flex-wrap:wrap}
.qdots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.qdots i.done{background:var(--accent)}
.qdots i.on{background:var(--ink);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--ink)}
.spk-help{display:grid;gap:18px;min-width:0}
.wcloudbar{display:grid;gap:6px;padding-bottom:6px}
.wcloudbar .v-cloud{zoom:.78}
.brief{border-radius:14px;background:var(--surface);padding:18px;display:grid;gap:10px}
.brief p{line-height:1.75}
.ideas{display:flex;flex-wrap:wrap;gap:6px}
.ideas span{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px}
.notes4{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.notes4 label{display:grid;gap:4px;font-size:12px;color:var(--muted)}
.notes4 textarea{min-height:64px;font-size:14px}
.cue ul{margin:0;padding-left:20px}
@media (max-width:960px){
  .spk{grid-template-columns:1fr;gap:18px}
  .spk-main{top:calc(env(safe-area-inset-top,0px) + 54px);background:var(--bg);padding-block:6px}
  .qcard{padding:14px;gap:10px}
}
@media (max-width:420px){.notes4{grid-template-columns:1fr}}

/* ---- writing ---- */
.wlayout{display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:28px;align-items:start}
.wside{position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto;display:grid;gap:14px;padding-right:4px}
.wmain{display:grid;gap:14px;min-width:0}
@media (max-width:1000px){.wlayout{grid-template-columns:1fr}.wside{position:static;max-height:none;overflow:visible}}
.bank{display:grid;gap:10px}
.bank .grp{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.bank .grp b{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);flex-basis:100%;font-weight:500}
.bank button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:3px 10px;font-size:13px;cursor:pointer;color:var(--ink)}
.bank button:hover{border-color:var(--ink)}
.bank button.used{background:var(--good-soft);border-color:transparent;color:var(--good)}
#wm{position:fixed;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;pointer-events:none;user-select:none;-webkit-user-select:none;font:500 11px var(--mono);letter-spacing:.05em;color:var(--muted);background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:4px 10px;opacity:.9;max-width:calc(100vw - 24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.credit{font:500 11px var(--mono);letter-spacing:.05em;color:var(--muted);margin-top:8px;user-select:none;-webkit-user-select:none}
.foot{max-width:1100px;margin:0 auto;padding-inline:18px;padding-block:18px 40px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.foot .link{font-size:12px}

/* ---- new task types ---- */
.tgroup{padding-top:22px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.dpass{max-height:calc(100vh - 110px);overflow:auto;display:grid;gap:8px}
.dpass .para p{font-size:15px}
@media (max-width:900px){.dpass{max-height:45vh;box-shadow:inset 0 -12px 12px -12px var(--line)}}
.cards{display:flex;flex-wrap:wrap;gap:8px}
.ccard{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;cursor:pointer;color:var(--ink);text-align:left;font-size:15px;line-height:1.35;display:inline-flex;gap:8px;align-items:baseline;flex-direction:row;flex-wrap:wrap}
.ccard:hover:not(:disabled){border-color:var(--ink)}
.ccard.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 2px var(--accent)}
.ccard.paired{border-color:var(--ink)}
.ccard.ok{border-color:var(--good);background:var(--good-soft)}
.ccard.no{border-color:var(--bad);background:var(--bad-soft)}
.ccard small{flex-basis:100%;font-size:12px;color:var(--muted)}
.ccard.word{font-weight:600;padding:8px 12px}
.pn{font-family:var(--mono);font-size:11px;background:var(--ink);color:var(--bg);border-radius:999px;padding:1px 7px;flex:none}
.buckets{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.bucket{border:1.5px dashed var(--line);border-radius:14px;padding:12px;min-height:120px;display:grid;gap:8px;align-content:start;cursor:pointer}
.bucket.ready{border-color:var(--accent);background:var(--accent-soft)}
.bucket .label{color:var(--ink);font-weight:500}
.gaptext{font-size:17px;line-height:2.3}
.gap{min-width:90px;border:0;border-bottom:2px solid var(--ink);background:var(--surface);border-radius:6px 6px 0 0;padding:2px 10px;font:inherit;color:var(--ink);cursor:pointer;margin:0 2px}
.gap .gn{font-family:var(--mono);font-size:12px;color:var(--muted)}
.gap.act{border-color:var(--accent);background:var(--accent-soft)}
.gap.filled{font-weight:600}
.gap.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.gap.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.gapfix{font-weight:700;color:var(--good);margin-right:4px}
.pairs{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 14px}
.pairs .ccard{width:100%}
.zone.build{min-height:58px;border:1.5px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
del{color:var(--bad);text-decoration-thickness:2px}
ins{color:var(--good);text-decoration:none;font-weight:700;background:var(--good-soft);border-radius:4px;padding:0 4px}
.up{border:0;border-bottom:2px dashed var(--accent);background:var(--accent-soft);color:var(--ink);font:inherit;padding:0 6px;border-radius:4px;cursor:pointer}
.up.act{background:var(--accent);color:var(--accent-ink)}
.up.ok{border-bottom:2px solid var(--good);background:var(--good-soft);color:var(--good);font-weight:600}
.up.no{border-bottom:2px solid var(--bad);background:var(--warn-soft);font-weight:600}
.memgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(46%,150px),1fr));gap:10px}
.mem{aspect-ratio:4/3;max-width:100%;border:1.5px solid var(--ink);border-radius:14px;background:var(--ink);color:var(--bg);cursor:pointer;font:600 15px var(--body);padding:8px;display:grid;place-items:center;text-align:center;transition:transform .2s}
.mem .memback{font-family:var(--display);font-size:20px;letter-spacing:.04em;color:var(--accent)}
.mem.flip{background:var(--bg);color:var(--ink)}
.mem.flip.s1{background:var(--accent-soft)}
.mem.done{border-color:var(--good);background:var(--good-soft);color:var(--good)}
@media (prefers-reduced-motion:no-preference){.mem:not(.flip):hover{transform:translateY(-2px)}}
.sprint{max-width:640px;display:grid;gap:16px;transition:background .2s}
.sprint.flash-ok{background:var(--good-soft)} .sprint.flash-no{background:var(--bad-soft)}
.spq{font-size:22px;font-weight:700;line-height:1.35}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px}
.tiles.truths{grid-template-columns:1fr}
.tile{border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:16px;font-size:16px;cursor:pointer;color:var(--ink);text-align:left}
.tiles.odd .tile{font-family:var(--display);font-size:26px;letter-spacing:.02em;text-align:center}
.tile:hover:not(:disabled){border-color:var(--ink)}
.tile.right{border-color:var(--good);background:var(--good-soft)}
.tile.wrong{border-color:var(--bad);background:var(--bad-soft)}
.sn{cursor:pointer;border-radius:4px;padding:1px 0;transition:background .2s}
.sn:hover{background:var(--surface);box-shadow:0 0 0 1px var(--line)}
.sn.hit,.para.pick.hit{background:var(--good-soft)}
.sn.miss,.para.pick.miss{background:var(--bad-soft)}
.para.pick{cursor:pointer;border:1.5px solid transparent}
.para.pick:hover{border-color:var(--line)}
/* ---- the hare meme ---- */
.meme{border:1.5px solid var(--ink);border-radius:16px;overflow:hidden;display:grid;background:var(--bg);max-width:560px}
.meme-row{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;padding:12px 16px}
.meme-row.no{background:var(--surface);border-bottom:1.5px solid var(--ink)}
.meme-row.yes{background:var(--accent-soft)}
.meme-row ul{margin:0;padding-left:18px;display:grid;gap:3px;font-weight:600;font-size:15px}
.meme-t{font-size:20px;font-weight:700}
.meme-t s{text-decoration-color:var(--bad);text-decoration-thickness:3px}
.meme>.row{padding:8px 16px 12px}
.hare{width:96px;height:96px}
.hare .h-body{fill:var(--bg);stroke:var(--ink);stroke-width:2.5}
.hare .h-ear{fill:var(--bg);stroke:var(--ink);stroke-width:2.5}
.hare .h-in{fill:var(--accent);opacity:.55}
.hare .h-eye{fill:var(--ink)}
.hare .h-nose{fill:var(--accent)}
.hare .h-line{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
.hare .h-line.thin{stroke-width:1.2}
.hare .h-arm{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round}
@media (max-width:420px){.meme-row{grid-template-columns:64px 1fr}.hare{width:64px;height:64px}}

/* ---- tip deck: one idea per screen ---- */
.deck{max-width:780px;display:grid;gap:16px;outline:none}
.deck-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;border:0;padding:0;background:var(--line);cursor:pointer}
.dot.on{background:var(--accent);width:26px;border-radius:5px}
.deck .tip{border:1.5px solid var(--ink);border-radius:20px;padding:clamp(20px,4vw,36px);min-height:min(56vh,480px);align-content:center;gap:22px}
.deck .tip h3{font-size:clamp(30px,5vw,44px)}
.deck .tip-say{font-size:17px}
.deck .v-pairs,.deck .v-step b,.deck .v-dd ul,.deck .legend{font-size:16px}
.deck .v-anat p{font-size:17px}
.deck-nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
/* ---- task navigation ---- */
.dnav{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dnav select{flex:1;min-width:0;max-width:480px;padding:6px 10px;font-size:14px}
/* ---- memory card back ---- */
.mem{background:var(--warm);border:0;color:var(--ink)}
.mem .haremark{width:44%;max-width:64px;fill:#fff}
.mem.flip{background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
.mem.flip.s1{background:var(--accent-soft)}
.mem.done{background:var(--good-soft);color:var(--good);border:1.5px solid var(--good)}
/* ---------- training stages: module list ---------- */
.wrap.wide{max-width:1280px}
.stagelist{display:grid;gap:10px}
.stagecard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:center;text-align:left;border:0;border-radius:18px;padding:16px 18px;background:var(--field);cursor:pointer;color:var(--ink);font:inherit}
.stagecard:hover{background:var(--field-hover)}
.snum{font-family:var(--display);color:var(--accent);line-height:.8;font-size:64px;min-width:.6em}
.snum.big{font-size:clamp(76px,12vw,124px)}
.stagecard.done .snum{color:var(--good)}
.smeta{display:grid;gap:6px;min-width:0}
.stitle{font-size:21px;font-weight:700;line-height:1.2}
.kinds{display:flex;flex-wrap:wrap;gap:6px}
.kinds i{font-style:normal;font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:2px 8px;color:var(--muted);background:var(--bg)}
.sprog{display:grid;gap:6px;justify-items:end;min-width:120px}
.sprog .prog{width:120px}

.vs-row small{font-size:11px;color:var(--muted)}
.vs-bar{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--accent-soft),var(--accent))}
.vs-ends{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
/* ---------- calm layer: barely-visible frames, soft fills for things you can tap, one dark grey for "active" ---------- */
:root{--frame:rgba(21,18,23,.10);--line:rgba(21,18,23,.10);--field:#f3f3f4;--field-hover:#e9e9eb;--surface:#f7f7f8;--act:#18181a;--act-ink:#ffffff;--cloud:#6b6b72;--cloud-strong:#18181a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--frame:rgba(245,239,243,.10);--line:rgba(245,239,243,.10);--field:#1f1f22;--field-hover:#29292d;--surface:#19191c;--act:#3a3a40;--act-ink:#ffffff;--cloud:#9c9ca4;--cloud-strong:#f2f2f4}}
:root[data-theme="dark"]{--frame:rgba(245,239,243,.10);--line:rgba(245,239,243,.10);--field:#1f1f22;--field-hover:#29292d;--surface:#19191c;--act:#3a3a40;--act-ink:#ffffff;--cloud:#9c9ca4;--cloud-strong:#f2f2f4}
.topbar{border-bottom:1px solid var(--frame)}
.hero,.uhero,.score,.stagehead{border-bottom:1px solid var(--frame)}
.card,.q,.tip,.player,.cue,.qcard,.meme,.deck .tip{border-color:var(--frame);border-width:1px}
.dbar{border-bottom:1px solid var(--frame)}
.v-part,.v-q{border:0;background:var(--field)}
.meme-row.no{border-bottom:1px solid var(--frame)}
/* things you can tap: a soft fill instead of an outline */
.ccard,.tile,.opts label,.choices button,.ord button.part,.plan,.chopt,.abcard,.pen,.seg button,.tf button,.bank button,.unit,.cl-slot.filled,.part{border-color:transparent;background:var(--field)}
.ccard:hover:not(:disabled),.tile:hover:not(:disabled),.opts label:hover,.choices button:hover:not(:disabled),.plan:hover:not(:disabled),.chopt:hover:not(:disabled),.abcard:hover:not(:disabled),.bank button:hover,.unit:hover,.seg button:hover{border-color:transparent;background:var(--field-hover)}
.ccard.paired,.ord .zone:first-of-type button.part{border-color:transparent;box-shadow:inset 0 0 0 1.5px var(--act)}
.ccard.ok,.plan.right,.chopt.right,.abcard.right,.tile.right,.cl-slot.ok{background:var(--good-soft);border-color:var(--good)}
.ccard.no,.plan.wrong,.chopt.wrong,.abcard.wrong,.tile.wrong,.cl-slot.no{background:var(--bad-soft);border-color:var(--bad)}
.opts label:has(input:checked),.sc label:has(input:checked){border-color:transparent;background:var(--act);color:var(--act-ink)}
.opts label:has(input:checked) .let{color:inherit}
input[type=text],input[type=search],select,textarea{border-color:transparent;background:var(--field)}
input[type=text]:focus,select:focus,textarea:focus{border-color:var(--act);background:var(--bg)}
.bucket{border:1.5px dashed var(--frame);background:transparent}
.zone,.ord .zone,.zone.build{border-color:var(--frame)}
.btn{border-color:transparent;background:var(--field)}
.btn:hover:not(:disabled){background:var(--field-hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border-color:var(--frame)}
.mem.flip{border-color:var(--frame)}
/* active states: #18181a with white text */
.seg button[aria-pressed="true"],.tabs button[aria-pressed="true"],.tf button[aria-pressed="true"],.chip.lv{background:var(--act);border-color:var(--act);color:var(--act-ink)}
.seg button[aria-pressed="true"] span{color:rgba(255,255,255,.75)}
.tabs{border:0;background:var(--field)}
.steps{border-bottom:0;gap:6px;background:var(--field);border-radius:999px;padding:4px;width:max-content;max-width:100%}
.steps button{border:0;border-radius:999px;padding:8px 16px;color:var(--ink)}
.steps button[aria-selected="true"]{background:var(--act);color:var(--act-ink)}
.pen[aria-pressed="true"]{border-color:transparent;background:var(--bg);box-shadow:0 0 0 2px var(--pc)}
.qdots i.on{background:var(--act);box-shadow:0 0 0 2px var(--bg),0 0 0 3px var(--act)}
.pn{background:var(--act);color:var(--act-ink)}
/* word clouds: dark grey, never pink */
.v-cloud button{color:var(--cloud)}
.v-cloud button.c1x{color:var(--cloud-strong)}
.v-cloud button.used{color:var(--good)}
.v-cloud{justify-content:flex-start;padding:2px 0}

/* panel closed by default */
.lgrid{grid-template-columns:minmax(0,1fr)}
.lgrid.side-open{grid-template-columns:minmax(0,1fr) min(400px,34vw)}
.lgrid:not(.side-open) .lmain{max-width:980px;width:100%;margin:0 auto}
@media (min-width:1000px){.lgrid:not(.side-open) .lside{display:none}}
.lh-pans{display:inline-flex;gap:6px}
.lh-pan[aria-pressed="true"]{background:var(--act);color:var(--act-ink)}
@media (max-width:999px){.lh-pans{display:none}.lgrid.side-open{grid-template-columns:1fr}}
.ls-close{display:inline-grid;place-items:center}
@media (min-width:1000px){.lfab{display:none!important}}
/* clouds: pink on hover */
.v-cloud button:hover,.v-cloud button:focus-visible{color:var(--accent);text-decoration:none}
/* photo inside a task */
.timg{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:22px;align-items:start}
.timg figure{margin:0;position:sticky;top:calc(var(--toph,110px) + 12px)}
.timg img{width:100%;height:auto;border-radius:16px;display:block;max-height:78vh;object-fit:cover}
.timg-main{display:grid;gap:14px;min-width:0}
@container (max-width:640px){.timg{grid-template-columns:1fr}.timg figure{position:static}.timg img{max-height:52vh}}
/* picture dictionary and drawn icons */
.v-pics,.v-icons{display:grid;gap:16px}
.vp-g{display:grid;gap:8px}
.vp-row,.vi-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.v-cols .vp-row,.v-cols .vi-row{grid-template-columns:repeat(var(--cols),minmax(0,1fr))}
@media (max-width:620px){.v-cols .vp-row,.v-cols .vi-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ls-pane .vp-row,.ls-pane .vi-row,.tref .vp-row,.tref .vi-row{grid-template-columns:repeat(2,minmax(0,1fr))}
.vp,.vi{display:grid;gap:4px;align-content:start;text-align:left;border:0;border-radius:14px;padding:8px;background:var(--field);color:var(--ink);font:inherit;cursor:pointer}
.vp:hover,.vi:hover{background:var(--field-hover)}
.vp:hover b,.vi:hover b{color:var(--accent)}
.vp img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.vp b,.vi b{font-size:16px;line-height:1.15}
.vp small,.vi small{font-size:12.5px;color:var(--muted);line-height:1.3}
.vi .ic{width:64px;height:64px}
.ic-l,.ic-a,.ic-d{fill:none;stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
.ic-l{stroke:var(--ink)} .ic-a{stroke:var(--accent)} .ic-d{stroke:var(--muted);stroke-dasharray:4 5}
.ic-f{fill:var(--ink)} .ic-af,.ic-af circle{fill:var(--accent)}
/* research card, brain network, mind map */
.v-res{display:grid;gap:10px}
.vr-img,.vm-img{margin:0;border-radius:16px;overflow:hidden;line-height:0;cursor:zoom-in;position:relative}
.vr-img img,.vm-img img{width:100%;height:auto;display:block}
.vm-img{background:#fff;border:1px solid var(--line)}
.vm-img figcaption{position:absolute;right:10px;bottom:10px;line-height:1.2;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;background:rgba(32,36,40,.78);color:#fff}
.deck .vr-img img{max-height:38vh;object-fit:cover}
.zoomer{position:fixed;inset:0;z-index:200;background:rgba(14,16,18,.9);display:grid;place-items:center;padding:16px;cursor:zoom-out}
.zoomer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px;background:#fff}
.zoomer button{position:absolute;top:12px;right:12px}
.vr-big{font-family:var(--display);font-size:clamp(64px,10vw,110px);line-height:.85;color:var(--accent)}
.vr-bars{display:grid;gap:8px}
.vr-b{display:grid;grid-template-columns:150px 1fr;gap:10px;align-items:center;font-size:14px}
.vr-b i{height:14px;border-radius:7px;background:var(--cloud)}
.vr-b i.hi{background:var(--accent)}
.vr-src{font-family:var(--mono);font-size:11.5px;letter-spacing:.02em;color:var(--muted);line-height:1.5}
.v-net{display:grid;gap:12px}
.v-net svg{width:100%;max-width:340px;height:auto;justify-self:center}
.nw-l{stroke:var(--frame);stroke-width:3;stroke:var(--cloud)}
.nw-c{fill:var(--accent)} .nw-ct{fill:#fff;font:700 15px var(--body)}
.nw-n{fill:var(--bg);stroke-width:3} .nw-n.t1{stroke:var(--t2)} .nw-n.t2{stroke:var(--t3)} .nw-n.t3{stroke:var(--t4)}
.nw-t{fill:var(--ink);font:600 11.5px var(--body)}
.nw-keys{display:grid;gap:6px}
.nw-keys div{display:grid;grid-template-columns:14px auto 1fr;gap:8px;align-items:baseline;font-size:14px}
.nw-keys i{width:12px;height:12px;border-radius:50%;display:inline-block}
.nw-keys i.t1{background:var(--t2)} .nw-keys i.t2{background:var(--t3)} .nw-keys i.t3{background:var(--t4)}
.nw-keys span{color:var(--muted)}
.v-mm{width:100%;height:auto}
.mm-c ellipse{fill:var(--field);stroke:var(--ink);stroke-width:2}
.mm-c text{font:700 15px var(--body);fill:var(--ink)}
.mm-doodle{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round}
.mm-b{fill:none;stroke-width:5;stroke-linecap:round}
.mm-b.t1{stroke:var(--t1)} .mm-b.t2{stroke:var(--t2)} .mm-b.t3{stroke:var(--t3)} .mm-b.t4{stroke:var(--t4)}
.mm-h{font:700 16px var(--body)} .mm-h.t1{fill:var(--t1)} .mm-h.t2{fill:var(--t2)} .mm-h.t3{fill:var(--t3)} .mm-h.t4{fill:var(--t4)}
.mm-w{font:500 14px var(--body);fill:var(--ink)}
.deck .v-res .vr-big{font-size:clamp(80px,14vw,140px)}
/* ---------- type: dark grey, body a little heavier ---------- */
:root{--ink:#2b2b30}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#ececef}}
:root[data-theme="dark"]{--ink:#ececef}
body{font-weight:480}
b,strong{font-weight:700}
/* ---------- left rail ---------- */
.rail{position:fixed;left:0;top:0;bottom:0;z-index:34;width:62px;overflow:hidden;transition:width .22s ease,box-shadow .22s ease;background:var(--bg)}
.rail-i{transition:opacity .22s ease}
.rail:not(:hover):not(:focus-within):not(.open) .rail-i:not(.on){opacity:.42}
.rail:hover,.rail:focus-within,.rail.open{width:290px;opacity:1;box-shadow:12px 0 40px rgba(24,24,26,.10);overflow-y:auto}
.rail-in{display:grid;gap:4px;padding:14px 10px 30px;width:290px;align-content:start}
.rail-i{display:grid;grid-template-columns:42px 1fr;gap:10px;align-items:center;border:0;background:transparent;color:var(--cloud);font-family:var(--display);font-size:22px;letter-spacing:.04em;line-height:1;padding:7px 8px 6px 0;text-align:left;cursor:pointer;border-radius:2px}
.rail-i .rn{display:grid;place-items:center;height:30px;font-size:17px;letter-spacing:.06em;color:inherit}
.rail-i .rt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .15s}
.rail:hover .rt,.rail:focus-within .rt,.rail.open .rt{opacity:1}
.rail-i.on{background:var(--act);color:var(--act-ink)}
.rail-i:hover,.rail-i:focus-visible{background:var(--accent);color:#fff;outline:none}
.rail-u{margin-bottom:8px}
.rail-sub{display:none;gap:2px;padding:2px 0 8px 52px}
.rail:hover .rail-sub,.rail:focus-within .rail-sub,.rail.open .rail-sub{display:grid}
.rail-s{border:0;background:transparent;text-align:left;font:inherit;font-size:13.5px;font-weight:600;color:var(--muted);padding:5px 8px;border-radius:2px;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rail-s b{font-family:var(--mono);font-size:11px;margin-right:6px;font-weight:500}
.rail-s.on{background:var(--act);color:var(--act-ink)}
.rail-s:hover{background:var(--accent);color:#fff}
.railbtn{display:none}
@media (min-width:1000px){body.has-rail{padding-left:62px}}
@media (max-width:999px){
  .rail{width:0;opacity:1}
  .rail.open{width:min(300px,86vw)}
  .rail .rt{opacity:1}
  .railbtn{display:grid;gap:4px;place-content:center;position:fixed;left:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:36;width:46px;height:46px;border:0;border-radius:50%;background:var(--field);box-shadow:0 4px 14px rgba(0,0,0,.14);cursor:pointer}
  .railbtn i{display:block;width:18px;height:2px;background:var(--ink);border-radius:1px}
}
@media (prefers-reduced-motion:reduce){.rail,.rail .rt{transition:none}}
/* ---------- speaking cards: dark grey, white text ---------- */
.qcard,.tq,.cue,.ccx{background:var(--act);color:var(--act-ink);border:0}
.qcard .label,.tq .label,.cue .label,.ccx .label{color:rgba(255,255,255,.66)}
.qcard .btn:not(.primary),.tq .btn:not(.primary),.cue .btn:not(.primary),.ccx .btn:not(.primary){background:rgba(255,255,255,.12);color:#fff;border-color:transparent}
.qcard .btn:not(.primary):hover,.tq .btn:not(.primary):hover,.cue .btn:not(.primary):hover,.ccx .btn:not(.primary):hover{background:rgba(255,255,255,.22)}
.qcard .btn[aria-expanded="true"],.tq .btn[aria-expanded="true"]{background:#fff;color:var(--act)}
.qcard .small,.tq .small,.cue .small,.cue li{color:rgba(255,255,255,.86)}
.qcard .timer,.cue .timer{color:#fff}
.qcard .transcript{color:rgba(255,255,255,.86)}
.tq .model,.ccx .model{background:rgba(255,255,255,.08);color:#fff;border-radius:12px;padding:12px 14px}
.tq .model .label,.ccx .model .label{color:rgba(255,255,255,.6)}
.tq .vw,.ccx .vw,.qcard .vw{color:#fff;text-decoration-color:var(--accent)}
.qdots i{background:rgba(255,255,255,.25)}
.qdots i.on{background:#fff;box-shadow:none}
.qdots i.done{background:var(--accent)}
.tipflow.onepage{gap:0}
.tipflow.onepage .tip{border:0;border-top:1px solid var(--frame);border-radius:0;padding:26px 0;background:none}
/* live check */
.lc{border-radius:14px;background:var(--surface)}
.lc>summary{list-style:none;cursor:pointer;display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px}
.lc>summary::-webkit-details-marker{display:none}
.lc-sum{display:flex;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--muted)}
.lc-chip{font-family:var(--mono);font-size:11.5px;letter-spacing:.03em;background:var(--bg);border-radius:999px;padding:3px 9px;color:var(--ink)}
.lc-chip.strong{background:var(--act);color:var(--act-ink)}
.lc-hint{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.lc-in{display:grid;gap:4px;padding:0 14px 14px}
.lc-sec{border-top:1px solid var(--frame);padding-top:8px}
.lc-sec>summary{cursor:pointer;font-size:14px;font-weight:700;padding:4px 0;list-style:none;display:flex;gap:8px;align-items:baseline}
.lc-sec>summary::-webkit-details-marker{display:none}
.lc-sec>summary::before{content:"+";font-family:var(--mono);color:var(--muted);width:12px}
.lc-sec[open]>summary::before{content:"–"}
.lc-list{display:grid;gap:6px;padding:4px 0 8px;max-height:360px;overflow:auto}
.lc-issue{display:grid;gap:3px;text-align:left;border:0;background:var(--bg);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.lc-issue:hover{box-shadow:inset 0 0 0 1.5px var(--accent)}
.lc-issue s{color:var(--bad);text-decoration-thickness:2px}
.lc-issue b{color:var(--good)}
.lc-top{display:flex;gap:6px}
.lc-tag,.lc-cefr{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;border-radius:999px;padding:1px 7px}
.lc-tag{background:var(--act);color:var(--act-ink)}
.lc-cefr{background:var(--field);color:var(--muted)}
.lc-checks{list-style:none;margin:0;padding:4px 0 8px;display:grid;gap:6px;font-size:14px}
.lc-checks li{display:grid;gap:2px;padding-left:24px;position:relative}
.lc-checks li::before{position:absolute;left:0;top:0;font-weight:700}
.lc-checks li.y::before{content:"✓";color:var(--good)}
.lc-checks li.n::before{content:"·";color:var(--warn);font-size:22px;line-height:.8}
.lc-checks small{color:var(--muted);font-size:12.5px}
.lc-levels{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;padding:6px 0}
.lc-levels div{display:grid;gap:2px;background:var(--bg);border-radius:10px;padding:8px 10px}
.lc-levels b{font-family:var(--display);font-weight:400;font-size:30px;line-height:1}
.lc-levels small{color:var(--muted);font-size:12px}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sbanner{margin:0 0 6px;border-radius:18px;overflow:hidden;line-height:0}
.sbanner img{width:100%;height:auto;display:block}
.tip-banner .sbanner{margin:0}
/* cue card studio */
.ccgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.ccmini{display:grid;gap:6px;align-content:start;text-align:left;border:0;border-radius:14px;padding:12px 14px;cursor:pointer;font:inherit;min-height:118px}
.ccmini b{font-size:15px;line-height:1.25;font-weight:700}
.ccmini .ccn{font-family:var(--display);font-size:30px;line-height:.9;color:var(--accent)}
.ccmini:hover{background:var(--accent)}
.ccmini:hover .ccn{color:#fff}
.ccmini.cur{box-shadow:0 0 0 3px var(--accent)}
.ccmini.done .ccn{color:#52d49d}
.ccpanel{scroll-margin-top:calc(var(--toph,110px) + 10px)}
.ccpanel:empty{display:none}
.ccwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start;margin-top:16px}
@container (max-width:720px){.ccwrap{grid-template-columns:1fr}}
.ccbig{display:grid;gap:12px;padding:20px;border-radius:18px}
.ccbig ul{margin:0;padding-left:20px;display:grid;gap:4px}
.ccbig .tbar{height:6px;background:rgba(255,255,255,.15);border-radius:3px;overflow:hidden}
.ccbig .tbar i{display:block;height:100%;background:var(--accent);transition:width .9s linear}
.ccbig .timer{font-size:28px;color:#fff}
.ccbig .btn.primary{color:var(--accent-ink)}
.ccbig label{color:rgba(255,255,255,.86)}
.ccside{display:grid;gap:16px;align-content:start}
.ccside .model{line-height:1.7}
/* ---------- unit 2 activities ---------- */
/* draw the graph */
.sk-wrap{display:grid;gap:8px}
.sk-svg{width:100%;height:auto;display:block;touch-action:none;-webkit-user-select:none;user-select:none;cursor:crosshair;background:var(--field);border-radius:14px}
.sk-svg .gl{stroke:var(--line);stroke-width:1}
.sk-svg .ax{fill:var(--muted);font:11px var(--mono)}
.sk-svg .sk-col{stroke:var(--line);stroke-width:1;stroke-dasharray:2 5;opacity:.7}
.sk-svg .sk-ctx{fill:none;stroke:var(--cloud);stroke-width:2.2;stroke-linejoin:round}
.sk-svg .sk-ctxl{fill:var(--muted);font:600 10px var(--body)}
.sk-svg .sk-line{fill:none;stroke:var(--act);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.sk-svg .sk-target{fill:none;stroke:var(--accent);stroke-width:3;stroke-dasharray:7 5;stroke-linejoin:round}
.sk-svg .sk-pt{fill:var(--bg);stroke:var(--act);stroke-width:3;cursor:ns-resize}
.sk-svg .sk-pt.lock{fill:var(--act);cursor:default}
.sk-svg .sk-pt.on,.sk-svg .sk-pt:focus{stroke:var(--accent);outline:none}
.sk-svg .sk-pt.ok{stroke:var(--good);fill:var(--good)}
.sk-svg .sk-pt.no{stroke:var(--bad);fill:var(--bg)}
.sk-svg .sk-val{fill:var(--ink);font:600 12px var(--mono);paint-order:stroke;stroke:var(--field);stroke-width:4px}
.sk-key{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted)}
.sk-key i{display:inline-block;width:22px;height:0;border-top:3px solid var(--act);vertical-align:middle;margin-right:6px}
.sk-key i.t{border-top:3px dashed var(--accent)}
.sk-key i.c{border-top-color:var(--cloud)}
/* social feed */
.feed{display:grid;gap:10px}
.fd-list{display:grid;gap:12px;max-width:600px}
.fd-post{display:grid;gap:8px;padding:14px 16px;border-radius:18px;background:var(--surface);border:1.5px solid transparent}
.fd-post header{display:flex;align-items:center;gap:10px}
.fd-av{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--act);color:var(--act-ink);font:700 13px var(--body);flex:none;letter-spacing:.02em}
.fd-who{display:grid;line-height:1.25;min-width:0}
.fd-who small{color:var(--muted);font-size:12.5px}
.fd-text{margin:0;font-size:16.5px;line-height:1.55}
.fd-text mark.mb{background:var(--bad-soft);color:inherit;border-radius:4px;padding:0 2px}
.fd-tag{margin:0;color:var(--accent);font-size:14px;font-weight:600}
.fd-act{display:flex;flex-wrap:wrap;gap:8px}
.fd-b{font:inherit;font-weight:600;font-size:14px;border:0;border-radius:999px;padding:8px 15px;background:var(--field);color:var(--ink);cursor:pointer}
.fd-b:hover,.fd-b:focus-visible{background:var(--accent);color:#fff;outline:none}
.fd-post.ok{border-color:var(--good)}
.fd-post.no{border-color:var(--bad)}
.fd-res{display:grid;gap:4px}
.fd-res p{margin:0}
.fd-v{font-weight:700}
.fd-v.good{color:var(--good)}
.fd-v.bad{color:var(--bad)}
/* timeline */
.tln{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:8px;padding-top:28px}
.tln-line{position:absolute;left:4px;right:4px;top:11px;height:3px;background:var(--act);border-radius:2px}
.tln-era{position:relative;display:grid;gap:8px;align-content:start;min-height:130px;padding:12px 8px;border-radius:14px;background:var(--field)}
.tln-era.ready{cursor:pointer;box-shadow:inset 0 0 0 2px var(--accent)}
.tln-dot{position:absolute;top:-24px;left:50%;width:14px;height:14px;margin-left:-7px;border-radius:50%;background:var(--bg);border:3px solid var(--act)}
.tln-lab{font-family:var(--display);font-size:22px;letter-spacing:.04em;color:var(--ink);text-align:center;line-height:1}
.tln-era .cards{display:grid;gap:6px}
.tln-era .ccard{font-size:13.5px;width:100%;text-align:left}
.tln-era .ccard small{display:block;margin-top:4px;font-size:12px;opacity:.85;font-weight:500}
@container (max-width:700px){
  .tln{grid-template-columns:1fr;padding-top:0;padding-left:28px}
  .tln-line{left:11px;right:auto;top:6px;bottom:6px;width:3px;height:auto}
  .tln-dot{top:14px;left:-24px;margin-left:0}
  .tln-era{min-height:0}
  .tln-lab{text-align:left}
}
/* cue card roulette */
.whl{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:24px;align-items:start}
@container (max-width:760px){.whl{grid-template-columns:1fr}}
.whl-wheel{position:relative;width:100%;max-width:340px;aspect-ratio:1;justify-self:center}
.whl-disc{position:absolute;inset:0;overflow:hidden;border-radius:50%}
.whl-svg{width:100%;height:100%;display:block;transition:transform 3.6s cubic-bezier(.12,.66,.16,1)}
.whl-svg .sg0{fill:var(--act)}
.whl-svg .sg1{fill:var(--act);opacity:.8}
.whl-svg path{stroke:var(--bg);stroke-width:.6}
.whl-svg text{fill:#fff;font:600 8.5px var(--mono)}
.whl-svg .whl-done{fill:var(--accent)}
.whl-svg .whl-hub{fill:var(--bg)}
.whl-ptr{position:absolute;top:-8px;left:50%;margin-left:-13px;width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:26px solid var(--accent);z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.whl-spin{position:absolute;left:50%;top:50%;width:76px;height:76px;margin:-38px 0 0 -38px;border-radius:50%;border:0;background:var(--accent);color:#fff;font:400 22px/1 var(--display);letter-spacing:.06em;cursor:pointer;z-index:2;box-shadow:0 0 0 5px var(--bg)}
.whl-spin:hover{filter:brightness(1.06)}
.whl-spin:disabled{opacity:.75;cursor:default}
.whl-out{display:grid;gap:14px;align-content:start}
.whl-ws{display:flex;flex-wrap:wrap;gap:8px}
.whl-w{font:inherit;font-weight:600;font-size:15px;border:0;border-radius:999px;padding:7px 14px;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
.whl-w.used{background:var(--accent)}
.whl-w.used::after{content:" ✓"}
.whl-twist{border-radius:14px;padding:10px 14px;background:rgba(255,255,255,.08)}
.whl-twist p{margin:4px 0 0;font-weight:600}
@media (prefers-reduced-motion:reduce){.whl-svg{transition:none}}
.chart .s3{stroke:var(--t4);fill:var(--t4)}
.chart .ylab{fill:var(--muted);font:11px var(--mono)}
</style>
</head>
<body>
<header class="topbar" id="topbar" hidden><div class="inner">
  <button class="brand" id="brandBtn" type="button">IELTS <span>Ladder</span></button>
  <nav class="nav" id="nav"></nav>
</div></header>
<main id="app"><div class="loader"><span class="label">Loading</span></div></main>
<footer class="foot" id="foot"></footer>
<script>
"use strict";
/* =========================================================
   IELTS Ladder · student site
   Content lives in modules/*.enc.json (encrypted). A student's code opens
   keyring.json, which holds the keys to the units their teacher opened.
   ========================================================= */

/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>Array.from(r.querySelectorAll(s));
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9'\s-]/g," ").replace(/\s+/g," ").trim();
const wc=s=>norm(s)?norm(s).split(" ").length:0;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const LV=["A2","B1","B2","C1"], TIERS=["B1","B2","C1"];
const li=l=>Math.max(0,LV.indexOf(l));
const tierOf=l=>(!l||l==="A1"||l==="A2")?"B1":l;
const upT=t=>TIERS[Math.min(2,TIERS.indexOf(t)+1)];
const downT=t=>TIERS[Math.max(0,TIERS.indexOf(t)-1)];
const BAND={A1:"below 4.0",A2:"below 4.0",B1:"4.0–5.0",B2:"5.5–6.5",C1:"7.0–8.0"};
const SKILLS=[["reading","Reading"],["listening","Listening"],["writing","Writing"],["speaking","Speaking"],["language","Vocabulary & grammar"]];
const SKILL_NAME=Object.fromEntries(SKILLS);
const DAY=864e5;
const ROMAN=["i","ii","iii","iv","v","vi","vii","viii","ix","x"];
const fmtDate=t=>new Date(t).toLocaleDateString(undefined,{day:"numeric",month:"short"});
function toast(msg){const t=document.createElement("div");t.className="toast";t.setAttribute("role","status");t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}
function median(arr){const a=arr.slice().sort((x,y)=>x-y);return a.length?a[Math.floor((a.length-1)/2)]:0;}

/* timers and cleanup tied to the current view */
const T={ids:new Set(),every(fn,ms){const id=setInterval(fn,ms);this.ids.add(id);return id;},later(fn,ms){const id=setTimeout(fn,ms);this.ids.add(id);return id;},clear(){this.ids.forEach(id=>{clearInterval(id);clearTimeout(id);});this.ids.clear();}};
let CLEANUP=[];
const onLeave=fn=>CLEANUP.push(fn);
function go(fn,...args){document.querySelectorAll(".defpop").forEach(x=>x.remove());T.clear();CLEANUP.forEach(f=>{try{f();}catch(e){}});CLEANUP=[];TTS.stop();window.scrollTo(0,0);renderTop();NAV={};const r=fn(...args);try{renderRail();}catch(e){}return r;}

/* ---------- state ---------- */
const SKEY="ielts-ladder:v1";
function freshState(){return {v:1,code:null,placement:null,profile:{},tier:{},support:false,results:{},words:{},qtypes:{},essays:[],speaking:[],cando:{},checks:{},drafts:{},settings:{accent:"en-GB",speed:1}};}
let S=freshState(), PREVIEW=false;
function loadState(){try{const r=localStorage.getItem(SKEY);if(r){const o=JSON.parse(r);if(o&&o.v===1)S=Object.assign(freshState(),o);}}catch(e){}}
function store(){if(PREVIEW)return;try{localStorage.setItem(SKEY,JSON.stringify(S));}catch(e){}}
function save(){if(PREVIEW)return;S.at=Date.now();store();SYNC.soon();}

/* ---------- teacher sync: Google Sheets (optional, off when config.sync.url is empty) ----------
   Sends this code's progress to the teacher's Apps Script web app and restores it on a new device.
   Only the access code and the teacher's own label travel; no name or email is asked for. */
const SYNC={
  timer:null, busy:false, again:false, err:"",
  url(){ return (CONFIG.sync&&String(CONFIG.sync.url||"").trim())||""; },
  on(){ return !!this.url() && !PREVIEW && !!S.code && S.code!=="PREVIEW"; },
  body(){
    const units={}; UNITS.forEach(u=>{units[u.id]=u.title;});
    const sections={}; for(const [id,M] of Object.entries(MODULES)){ if(M&&M.sections) M.sections.forEach(x=>{sections[id+":"+x.id]=x.title||x.id;}); }
    return JSON.stringify({v:1,code:fmtCode(S.code),label:BUNDLE.label||"",at:S.at||Date.now(),units,sections,state:S});
  },
  soon(){ if(!this.on()) return; clearTimeout(this.timer); this.timer=setTimeout(()=>{this.timer=null;this.push();},5000); },
  flush(){ /* page is being hidden: send what is pending without waiting for an answer */
    if(!this.on()||!this.timer) return; clearTimeout(this.timer); this.timer=null;
    const b=this.body();
    if(navigator.sendBeacon && b.length<60000){ try{ if(navigator.sendBeacon(this.url(),new Blob([b],{type:"text/plain;charset=utf-8"}))) return; }catch(e){} }
    try{ fetch(this.url(),{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:b,keepalive:b.length<60000}); }catch(e){}
  },
  async push(){
    if(!this.on()) return false;
    if(this.busy){ this.again=true; return false; }
    this.busy=true; let ok=false;
    try{
      const r=await fetch(this.url(),{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:this.body()});
      const txt=await r.text(); let j=null; try{ j=JSON.parse(txt); }catch(e){}
      if(!j) this.err=`The sheet answered with a web page instead of data (HTTP ${r.status}). Usually the web app isn’t set to “Who has access: Anyone”, or the code was changed without deploying a new version.`;
      else if(!j.ok) this.err="The sheet script reported: "+(j.error||"unknown error");
      else { ok=true; this.err=""; S.synced=Date.now(); store(); }
    }catch(e){ this.err="Couldn’t reach the sheet: "+(e&&e.message||e)+". Check the connection, or that the web app URL in config.json is right."; console.warn("Sync failed",e); }
    this.busy=false;
    if(this.again){ this.again=false; this.soon(); }
    else if(!ok){ clearTimeout(this.timer); this.timer=setTimeout(()=>{this.timer=null;this.push();},60000); }
    return ok;
  },
  /* fetch the saved copy; adopt it if this device has nothing yet or the saved copy is newer */
  async pull(){
    if(!this.on()) return false;
    const ctl=new AbortController(), t=setTimeout(()=>ctl.abort(),6000);
    try{
      const u=this.url(); const r=await fetch(u+(u.includes("?")?"&":"?")+"code="+encodeURIComponent(fmtCode(S.code)),{signal:ctl.signal});
      const j=await r.json(); clearTimeout(t);
      if(!j||!j.ok||!j.state||typeof j.state!=="object") return false;
      const blank=!S.placement && !Object.keys(S.results||{}).length && !(S.essays||[]).length;
      if(blank || (j.state.at||0)>(S.at||0)){
        const keep=blank?{code:S.code}:{code:S.code,settings:S.settings};
        S=Object.assign(freshState(),j.state,keep); store(); return true;
      }
    }catch(e){ clearTimeout(t); console.warn("Restore skipped",e); }
    return false;
  }
};
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") SYNC.flush(); });
window.addEventListener("pagehide",()=>SYNC.flush());

/* ---------- crypto (AES-GCM + PBKDF2, Web Crypto) ---------- */
const enc=new TextEncoder(), dec=new TextDecoder();
function b64e(u8){let s="";for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s);}
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const b64url=u8=>b64e(u8).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const normCode=c=>String(c||"").toUpperCase().replace(/[^0-9A-Z]/g,"").replace(/O/g,"0").replace(/[IL]/g,"1");
const fmtCode=c=>c.replace(/(.{4})(?=.)/g,"$1-");
async function lookupId(code){const h=await crypto.subtle.digest("SHA-256",enc.encode("ielts-ladder|"+code));return Array.from(new Uint8Array(h)).slice(0,16).map(b=>b.toString(16).padStart(2,"0")).join("");}
async function deriveKey(code,salt,iter){const base=await crypto.subtle.importKey("raw",enc.encode(code),"PBKDF2",false,["deriveKey"]);return crypto.subtle.deriveKey({name:"PBKDF2",salt:b64d(salt),iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);}
async function aesOpen(key,iv,ct){const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(iv)},key,b64d(ct));return JSON.parse(dec.decode(pt));}
const rawKey=b64=>crypto.subtle.importKey("raw",b64d(b64),"AES-GCM",false,["decrypt"]);

let KEYS={}, MODULES={}, CONFIG={}, UNITS=[], BUNDLE={}, FPMARK="";
async function fingerprint(code){ const h=new Uint8Array(await crypto.subtle.digest("SHA-256",enc.encode("ielts-ladder-fp|"+code))); const bits=h[0].toString(2).padStart(8,"0")+h[1].toString(2).padStart(8,"0"); return "\u2060"+bits.replace(/0/g,"\u200B").replace(/1/g,"\u200C")+"\u2060"; }
function fp(t){ t=String(t||""); if(!FPMARK||!t) return t; const m=t.match(/^[\s\S]*?[.!?](?=\s)/); return m?m[0]+FPMARK+t.slice(m[0].length):t+FPMARK; }
const fmtLong=d=>new Date(d+"T12:00:00").toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"});
async function fetchJSON(p){const r=await fetch(p+(p.includes("?")?"&":"?")+"t="+Date.now(),{cache:"no-store"});if(!r.ok)throw new Error(p+" returned "+r.status);return r.json();}
async function openCourse(code){
  const ring=await fetchJSON("keyring.json");
  const id=await lookupId(code);
  const e=ring.entries&&ring.entries[id];
  if(!e) return {error:"unknown"};
  const key=await deriveKey(code,e.salt,ring.iter||150000);
  const data=await aesOpen(key,e.iv,e.ct);
  if(data.exp&&Date.now()>new Date(data.exp+"T23:59:59").getTime()) return {error:"expired",exp:data.exp};
  KEYS=data.keys||{}; BUNDLE=data; FPMARK=await fingerprint(code);
  return {ok:true};
}
async function getModule(id){
  if(MODULES[id]) return MODULES[id];
  if(!KEYS[id]) throw new Error("No access to "+id);
  const f=await fetchJSON("modules/"+id+".enc.json");
  MODULES[id]=await aesOpen(await rawKey(KEYS[id]),f.iv,f.ct);
  return MODULES[id];
}
async function preloadModules(){
  for(const id of Object.keys(KEYS)){ if(id==="placement") continue; try{await getModule(id);}catch(e){console.warn(e);} }
}
const unitIds=()=>Object.keys(MODULES).filter(id=>MODULES[id]&&MODULES[id].sections);

/* ---------- speech (browser text-to-speech) ---------- */
const TTS={
  voices:[], cur:null,
  ok(){return "speechSynthesis" in window && typeof SpeechSynthesisUtterance!=="undefined";},
  init(){ if(!this.ok()) return; const load=()=>{this.voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));}; load(); try{speechSynthesis.addEventListener("voiceschanged",load);}catch(e){speechSynthesis.onvoiceschanged=load;} },
  FEM:/female|woman|samantha|karen|serena|kate|moira|tessa|fiona|victoria|susan|zira|hazel|libby|sonia|emma|amy|joanna|salli|kimberly|ivy|kendra|aria|jenny|natasha|olivia|martha|catherine|allison|ava|nicky|maisie|google us english/i,
  MALE:/\bmale|daniel|arthur|oliver|george|ryan|thomas|alex\b|fred|rishi|aaron|gordon|guy|brian|matthew|joey|justin|david|mark|james|william|liam|google uk english male/i,
  pick(lang,gender,avoid=[]){
    const pref=(S.settings.accent&&S.settings.accent!=="any")?S.settings.accent:lang||"en-GB";
    const L=this.voices; if(!L.length) return null;
    const byLang=L.filter(v=>v.lang.replace("_","-").toLowerCase().startsWith(pref.toLowerCase()));
    const pool=byLang.length?byLang:L;
    const isF=v=>this.FEM.test(v.name), isM=v=>!isF(v)&&this.MALE.test(v.name);
    const g=gender==="female"?pool.filter(isF):gender==="male"?pool.filter(isM):pool;
    const cand=(g.length?g:pool);
    return cand.find(v=>!avoid.includes(v))||cand[0];
  },
  cast(speakers){const map={},used=[];for(const [k,s] of Object.entries(speakers||{})){const v=this.pick(s.lang,s.gender,used);map[k]=v;if(v)used.push(v);}return map;},
  split(t){return (t.match(/[^.!?]+[.!?]+["’”]?|[^.!?]+$/g)||[t]).map(s=>s.trim()).filter(Boolean);},
  /* plays a list of {text, voice} from index `from`; returns a controller */
  run(lines,rate,from,onLine,onDone){
    if(!this.ok()){onDone&&onDone(false);return {stop(){}};}
    this.stop(); let i=from||0, stopped=false;
    const next=()=>{
      if(stopped) return;
      if(i>=lines.length){ this.cur=null; onDone&&onDone(true); return; }
      const ln=lines[i]; onLine&&onLine(i,ln);
      const u=new SpeechSynthesisUtterance(ln.text);
      if(ln.voice){u.voice=ln.voice;u.lang=ln.voice.lang;} else u.lang="en-GB";
      u.rate=Math.max(.5,Math.min(1.5,(rate||1)*(S.settings.speed||1)));
      u.onend=()=>{ if(stopped) return; i++; setTimeout(next,ln.pause||250); };
      u.onerror=()=>{ if(stopped) return; i++; setTimeout(next,100); };
      speechSynthesis.speak(u);
    };
    const ctl={stop:()=>{stopped=true;try{speechSynthesis.cancel();}catch(e){}},get index(){return i;}};
    this.cur=ctl; next(); return ctl;
  },
  say(text,lang,gender){ const v=this.pick(lang||"en-GB",gender||"female"); return this.run(this.split(text).map(t=>({text:t,voice:v})),1,0); },
  stop(){ if(this.cur){this.cur.stop();this.cur=null;} if(this.ok()){try{speechSynthesis.cancel();}catch(e){}} }
};

/* ---------- top bar ---------- */
function dueWords(){const now=Date.now();let n=0;for(const uid of unitIds()){for(const w of MODULES[uid].words||[]){const st=S.words[uid+":"+w.id];if(st&&st.due<=now)n++;}}return n;}
function watermarkText(){ if(PREVIEW) return "Teacher preview"; const c=S.code||""; return `${BUNDLE.label?"Licensed to "+BUNDLE.label:"Licensed copy"} · ${c.slice(0,4)}`; }
const brandMark=()=>PREVIEW?"Teacher preview":`${CONFIG.watermark||CONFIG.courseName||"IELTS Ladder"} · ${(S.code||"").slice(0,4)}`;
const credit=()=>(S.code&&Object.keys(KEYS).length)||PREVIEW?`<p class="credit">${esc(brandMark())}</p>`:"";
function renderWatermark(){
  let w=document.getElementById("wm"); const on=(!!S.code&&!!Object.keys(KEYS).length)||PREVIEW;
  if(!on){ if(w) w.remove(); return; }
  if(!w){ w=document.createElement("div"); w.id="wm"; w.setAttribute("aria-hidden","true"); document.body.appendChild(w); }
  w.textContent=brandMark();
}
function renderFoot(){ const f=$("#foot"); if(!f) return; f.innerHTML=`<span>${esc(CONFIG.copyright||"")}</span><span>Personal use only.</span><button class="link" data-nav="terms">Terms of use</button>`; }
function renderTop(){
  renderWatermark(); renderFoot(); applyTheme();
  const tb=$("#topbar");
  const signed=!!S.code||PREVIEW;
  tb.hidden=!signed;
  $("#brandBtn").innerHTML=esc((CONFIG.courseName||"IELTS Ladder").replace(/\s+\S+$/,""))+" <span>"+esc((CONFIG.courseName||"IELTS Ladder").split(/\s+/).pop())+"</span>";
  if(!signed) return;
  const due=dueWords();
  $("#nav").innerHTML=PREVIEW?`<button data-nav="exitpreview">Exit preview</button>`:`
    <button data-nav="home">Course</button>
    <button data-nav="review">Words${due?`<span class="count">${due}</span>`:""}</button>
    <button data-nav="send">Send progress</button>
    <button data-nav="settings">Settings</button>`;
}
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-nav]"); if(!b) return;
  const n=b.dataset.nav;
  if(n==="home") go(S.placement?viewHome:viewPlacementIntro);
  if(n==="review") go(viewReview);
  if(n==="send") go(viewSend);
  if(n==="settings") go(viewSettings);
  if(n==="exitpreview") location.reload();
  if(n==="terms") go(viewTerms);
});
$("#brandBtn").addEventListener("click",()=>{ if(PREVIEW) return; if(S.code) go(S.placement?viewHome:viewPlacementIntro); });

/* ---------- left rail: the unit menu, quiet until you hover it ---------- */
let NAV={};
function setNav(o){ NAV=Object.assign({},o||{}); }
function railName(s){ if(s.nav) return s.nav; if(s.type==="writing"&&s.task) return "Writing Task "+s.task; if(s.type==="speaking"&&s.part) return "Speaking Part "+s.part; return s.title; }
function renderRail(){
  let r=document.getElementById("rail"); const U=NAV.uid&&MODULES[NAV.uid];
  if(!U||(!S.code&&!PREVIEW)){ if(r) r.remove(); const b=document.getElementById("railBtn"); if(b) b.remove(); document.body.classList.remove("has-rail"); return; }
  if(!r){ r=document.createElement("nav"); r.id="rail"; r.className="rail"; r.setAttribute("aria-label","Unit menu"); document.body.appendChild(r);
    const b=document.createElement("button"); b.id="railBtn"; b.className="railbtn"; b.type="button"; b.setAttribute("aria-label","Unit menu"); b.innerHTML="<i></i><i></i><i></i>"; document.body.appendChild(b);
    b.onclick=()=>r.classList.toggle("open");
    document.addEventListener("click",e=>{ if(r.classList.contains("open")&&!e.target.closest("#rail,#railBtn")) r.classList.remove("open"); });
  }
