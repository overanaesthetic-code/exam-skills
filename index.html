function runPlacement(P){
  const items=P.items.map(it=>Object.assign({},it,{order:shuffle(it.o.map((_,i)=>i))}));
  const ans=new Array(items.length).fill(null); let i=0;
  const draw=()=>{
    const it=items[i];
    app.innerHTML=`<div class="wrap narrow stack" style="gap:22px">
      <div class="row between"><span class="label">Question ${i+1} of ${items.length}</span><button class="link small" id="quitP">Leave</button></div>
      <div class="pbar"><i style="width:${Math.round(i/items.length*100)}%"></i></div>
      <h2 style="font-family:var(--body);font-weight:600;font-size:22px;line-height:1.4;letter-spacing:0">${esc(it.p).replace(/___/g,"<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>")}</h2>
      <div class="choices">${it.order.map(k=>`<button data-k="${k}" ${ans[i]===k?'class="right"':""}>${esc(it.o[k])}</button>`).join("")}<button data-k="-1" class="${ans[i]===-1?"right":""}" style="color:var(--muted)">I don’t know</button></div>
      <div class="row between"><button class="btn ghost small" id="prevP" ${i===0?"disabled":""}>Back</button><span class="small muted">Choose an answer to continue.</span></div>
    </div>`;
    $$(".choices button").forEach(b=>b.onclick=()=>{ ans[i]=Number(b.dataset.k); if(i<items.length-1){i++;draw();} else finish(); });
    $("#prevP").onclick=()=>{ if(i>0){i--;draw();} };
    $("#quitP").onclick=()=>go(viewPlacementIntro);
  };
  const finish=()=>{
    const scores={A2:0,B1:0,B2:0,C1:0}, totals={A2:0,B1:0,B2:0,C1:0};
    items.forEach((it,k)=>{ totals[it.level]++; if(ans[k]===it.a) scores[it.level]++; });
    const pass=P.pass||{A2:5,B1:5,B2:4,C1:4};
    let level="A1"; for(const L of LV){ if(scores[L]>=pass[L]) level=L; else break; }
    const prof=level==="A1"?"A2":level;
    S.placement={level,scores,totals,date:Date.now()};
    SKILLS.forEach(([k])=>{ S.profile[k]=prof; S.tier[k]=tierOf(prof); });
    S.support=(level==="A1"||level==="A2");
    save();
    go(viewPlacementResult);
  };

}

/* ---------- adaptation ---------- */
function record(uid,sid,tier,pct,mode,lvl){
  const k=uid+":"+sid; const r={tier,pct:Math.round(pct*100),mode:mode||"",date:Date.now()}; if(lvl) r.lvl=lvl; (S.results[k]=S.results[k]||[]).push(r);
}
function adapt(skill,tier,pct){
  let msg;
  const cur=S.profile[skill]||"A2";
  if(pct>=0.7 && li(cur)<li(tier)) S.profile[skill]=tier;
  if(pct>=0.85 && tier!=="C1"){ S.tier[skill]=upT(tier); msg=`Strong result. Next time, ${SKILL_NAME[skill].toLowerCase()} moves up to ${S.tier[skill]}.`; }
  else if(pct>=0.85){ S.tier[skill]="C1"; msg="Strong result at the top level. Keep this up under exam timing."; }
  else if(pct>=0.7){ S.tier[skill]=tier; msg=`You’re working confidently at ${tier}. Score 85% or more to move up.`; }
  else if(pct<0.5 && tier!=="B1"){ S.tier[skill]=downT(tier); if(li(S.profile[skill])>=li(tier)) S.profile[skill]=downT(tier); msg=`This level was a stretch. Next time you’ll work at ${S.tier[skill]} first, then come back to ${tier}.`; }
  else { S.tier[skill]=tier; msg=`Keep practising at ${tier}. Score 70% or more to confirm this level.`; }
  save(); return msg;
}
function overallLevel(){ const v=SKILLS.map(([k])=>li(S.profile[k]||"A2")); return LV[median(v)]; }

const TIER_DESC={B1:"IELTS 4.0–5.0",B2:"IELTS 5.5–6.5",C1:"IELTS 7.0–8.0"};
/* =========================================================

const QT={
  tfng:{label:"True / False / Not Given",opts:["TRUE","FALSE","NOT GIVEN"],tip:"FALSE means the text says the opposite. NOT GIVEN means the text doesn’t say either way. Find the exact sentence before you decide."},
  ynng:{label:"Yes / No / Not Given",opts:["YES","NO","NOT GIVEN"],tip:"These questions are about the writer’s views. YES = the writer agrees, NO = the writer disagrees, NOT GIVEN = the writer doesn’t say."},
  head:{label:"Matching headings",tip:"Read the first and last sentences and ask what the whole paragraph is about. Ignore headings that match only one detail."},
  mcq:{label:"Multiple choice",tip:"Find the answer in the text first, then compare the options. Wrong options often repeat words from the text with a different meaning."},
  gap:{label:"Completion",tip:"Copy words exactly and check the word limit. The completed sentence must be grammatical."}
};
const INSTR={
  tfng:"Do the statements agree with the information in the text? Choose <b>TRUE</b>, <b>FALSE</b> or <b>NOT GIVEN</b>.",
  ynng:"Do the statements agree with the views of the writer? Choose <b>YES</b>, <b>NO</b> or <b>NOT GIVEN</b>.",
  head:"Choose the correct heading for each paragraph from the list below.",
  mcq:"Choose the correct answer.",
  gap:lim=>lim?`Complete the sentences. Write <b>${["","ONE WORD","NO MORE THAN TWO WORDS","NO MORE THAN THREE WORDS"][lim]||lim+" WORDS"}</b> for each answer.`:"Complete the sentences."
};
function qtAcc(type){const a=(S.qtypes[type]||[]).slice(-8);return a.length?a.reduce((x,y)=>x+y,0)/a.length:null;}
function makeQuiz(groups,ctx){
  let n=0; const qs=[];
  const G=groups.map((g,gi)=>{
    const items=(g.qs||g.items||[]).map((q,qi)=>{
      const o=Object.assign({},q,{type:q.type||g.type,id:`${ctx.pfx||""}q${gi}_${qi}`,n:++n,lim:q.lim??g.lim,headings:g.headings,group:gi});
      if(o.type==="mcq"){ let idx=o.o.map((_,i)=>i); if(ctx.reduce&&idx.length>3){const wrong=shuffle(idx.filter(i=>i!==o.a));idx=idx.filter(i=>i!==wrong[0]);} o.order=ctx.shuffle?shuffle(idx):idx; }
      if(o.type==="head"){ let idx=o.headings.map((_,i)=>i); if(ctx.reduce){const wrong=shuffle(idx.filter(i=>i!==o.a)).slice(0,2);idx=idx.filter(i=>i===o.a||wrong.includes(i));} o.order=idx; }
      qs.push(o); return o;
    });
    return Object.assign({},g,{items});
  });
  return {groups:G,qs,ans:{},checked:{},hint:{},plays:{},ctx};
}
function isRight(q,v){
  if(v===undefined||v===null||v==="") return false;
  if(q.type==="tfng"||q.type==="ynng") return v===q.a;
  if(q.type==="mcq"||q.type==="head") return Number(v)===q.a;
  if(q.type==="gap") return (!q.lim||wc(v)<=q.lim) && (q.acc||[]).map(norm).includes(norm(v));
  return false;
}
function answerText(q){
  if(q.type==="tfng"||q.type==="ynng") return q.a;
  if(q.type==="mcq") return q.o[q.a];
  if(q.type==="head") return ROMAN[q.a]+". "+q.headings[q.a];
  return (q.acc||[])[0]||"";
}
function givenText(q,v){
  if(v===undefined||v===null||v==="") return "No answer";
  if(q.type==="mcq") return q.o[Number(v)];
  if(q.type==="head") return ROMAN[Number(v)]+". "+q.headings[Number(v)];
  return String(v);
}
function groupHTML(Q,g,first,last){
  const c=Q.ctx, type=g.type||g.items[0].type;
  const acc=qtAcc(type);
  const tip=c.mode==="practice"&&QT[type]&&(c.tier==="B1"||S.support||(acc!==null&&acc<0.6));
  const instr=g.instr||(type==="gap"?INSTR.gap(g.lim):INSTR[type]||"");
  let h=`<div class="group" data-group="${g.items[0]&&g.items[0].group}">`;
  if(!c.noHeaders) h+=`<span class="label">Questions ${first}${last>first?"–"+last:""}${QT[type]?" · "+QT[type].label:""}</span>`;
  if(instr) h+=`<p class="instr">${instr}</p>`;
  if(tip) h+=`<p class="note"><b>Strategy:</b> ${esc(QT[type].tip)}</p>`;
  if(type==="head"&&g.headings) h+=`<div class="headlist"><span class="label">List of headings</span>${g.headings.map((x,i)=>`<div><span>${ROMAN[i]}</span>${esc(x)}</div>`).join("")}</div>`;
  g.items.forEach(q=>h+=qHTML(Q,q));
  return h+`</div>`;
}
function qHTML(Q,q){
  const c=Q.ctx, v=Q.ans[q.id], done=!!Q.checked[q.id];
  let input="";
  if(q.type==="tfng"||q.type==="ynng") input=`<div class="tf" role="group" aria-label="Answer">${QT[q.type].opts.map(o=>`<button type="button" data-tf="${q.id}" data-v="${o}" aria-pressed="${v===o}" ${done?"disabled":""}>${o}</button>`).join("")}</div>`;
  if(q.type==="mcq") input=`<div class="opts">${q.order.map((i,k)=>`<label><input type="radio" name="${q.id}" value="${i}" ${String(v)===String(i)?"checked":""} ${done?"disabled":""}><span><span class="let">${"ABCDEFG"[k]}</span>&nbsp; ${esc(q.o[i])}</span></label>`).join("")}</div>`;
  if(q.type==="head") input=`<select data-q="${q.id}" ${done?"disabled":""} aria-label="Heading for ${esc(q.p)}"><option value="">Choose a heading</option>${q.order.map(i=>`<option value="${i}" ${String(v)===String(i)?"selected":""}>${ROMAN[i]}. ${esc(q.headings[i])}</option>`).join("")}</select>`;
  if(q.type==="gap") input=`<input type="text" data-q="${q.id}" value="${esc(v||"")}" autocomplete="off" autocapitalize="off" spellcheck="false" ${done?"disabled":""} aria-label="Answer to question ${q.n}">${q.lim?`<span class="label">${q.lim===1?"One word":"Max "+q.lim+" words"}</span>`:""}`;
  const prompt=q.type==="head"?`<strong>${esc(q.p)}</strong>`:esc(q.p).replace(/___/g,"<u>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;</u>");
  let pre="";
  if(q.text) pre+=`<p class="quote">${esc(q.text)}</p>`;
  if(q.listen){ const left=2-(Q.plays[q.id]||0); pre+=`<div class="row"><button type="button" class="btn small" data-listen="${q.id}" ${left<=0?"disabled":""}>Play recording</button><span class="small muted">${left} play${left===1?"":"s"} left</span></div>`; }
  let tools="";
  if(c.mode==="practice"&&!done){
    if(c.hints&&q.para){ tools+=Q.hint[q.id]?`<span class="small muted">Hint: look at <button type="button" class="link" data-jump="${q.para}">paragraph ${q.para}</button>${q.type==="gap"&&q.acc?`. The answer starts with “${esc(q.acc[0][0])}”`:""}.</span>`:`<button type="button" class="btn small ghost" data-hint="${q.id}">Hint</button>`; }
    tools+=`<button type="button" class="btn small" data-check="${q.id}">Check</button>`;
  }
  let fb="",cls="";
  if(done){ const ok=isRight(q,v); cls=ok?"ok":"no"; fb=`<div class="fb"><span class="verdict">${ok?"Correct":"Not quite"}${ok&&Q.hint[q.id]?" (with a hint)":""}</span>${ok?"":`<span>Answer: <strong>${esc(answerText(q))}</strong></span>`}${q.ex?`<span>${esc(q.ex)}</span>`:""}</div>`; }
  return `<div class="q ${cls}" id="box-${q.id}">${pre}<div class="qhead"><span class="qnum">${q.n}</span><div class="qtext">${prompt}</div></div>${input}${tools?`<div class="qtools">${tools}</div>`:""}${fb}</div>`;
}
function quizHTML(Q){ return Q.groups.map(g=>groupHTML(Q,g,g.items[0].n,g.items[g.items.length-1].n)).join(""); }
function refreshQ(Q,id){ const q=Q.qs.find(x=>x.id===id); const box=document.getElementById("box-"+id); if(!box) return; const t=document.createElement("div"); t.innerHTML=qHTML(Q,q); box.replaceWith(t.firstElementChild); Q.onChange&&Q.onChange(); }
function bindQuiz(Q,root,jump){
  root.addEventListener("click",e=>{
    const t=e.target.closest("button"); if(!t) return;
    if(t.dataset.tf){ Q.ans[t.dataset.tf]=t.dataset.v; t.parentElement.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===t)); Q.onChange&&Q.onChange(); }
    if(t.dataset.hint){ Q.hint[t.dataset.hint]=true; refreshQ(Q,t.dataset.hint); }
    if(t.dataset.check){ const id=t.dataset.check; if(Q.ans[id]===undefined||Q.ans[id]===""){ t.textContent="Answer first"; return; } Q.checked[id]=true; refreshQ(Q,id); }
    if(t.dataset.jump&&jump) jump(t.dataset.jump);
    if(t.dataset.listen){ const id=t.dataset.listen, q=Q.qs.find(x=>x.id===id); Q.plays[id]=(Q.plays[id]||0)+1; TTS.say(q.listen,"en-GB","male"); refreshQ(Q,id); }
  });
  root.addEventListener("change",e=>{ const t=e.target; if(t.type==="radio"){Q.ans[t.name]=t.value;Q.onChange&&Q.onChange();} if(t.tagName==="SELECT"&&t.dataset.q){Q.ans[t.dataset.q]=t.value;Q.onChange&&Q.onChange();} });
  root.addEventListener("input",e=>{ const t=e.target; if(t.type==="text"&&t.dataset.q){Q.ans[t.dataset.q]=t.value;Q.onChange&&Q.onChange();} });
}
function answered(Q){return Q.qs.filter(q=>Q.ans[q.id]!==undefined&&Q.ans[q.id]!=="").length;}
function scoreQuiz(Q){
  let correct=0; const items=Q.qs.map(q=>{const ok=isRight(q,Q.ans[q.id]); if(ok) correct++; const credit=ok?(Q.hint[q.id]?0.5:1):0; (S.qtypes[q.type]=S.qtypes[q.type]||[]).push(credit); S.qtypes[q.type]=S.qtypes[q.type].slice(-30); return {q,ok,v:Q.ans[q.id]};});
  return {correct,total:Q.qs.length,pct:Q.qs.length?correct/Q.qs.length:0,items};
}
function reviewHTML(items){
  return `<div class="stack">${items.map(it=>{const q=it.q;return `<div class="q ${it.ok?"ok":"no"}">${q.text?`<p class="quote">${esc(q.text)}</p>`:""}<div class="qhead"><span class="qnum">${q.n}</span><div class="qtext">${esc(q.type==="head"?"Heading for "+q.p:q.p)}<div class="fb" style="margin-top:6px"><span class="verdict">${it.ok?"Correct":"Not quite"}</span><span>Your answer: ${esc(givenText(q,it.v))}${q.type==="gap"&&q.lim&&it.v&&wc(it.v)>q.lim?" (over the word limit)":""}</span>${it.ok?"":`<span>Answer: <strong>${esc(answerText(q))}</strong></span>`}${q.ex?`<span class="muted">${esc(q.ex)}</span>`:""}</div></div></div></div>`;}).join("")}</div>`;
}
function timerStart(minutes,onEnd){
  const deadline=Date.now()+minutes*60000;
  const tick=()=>{const left=Math.max(0,deadline-Date.now());const el=$("#timer");if(el){const m=Math.floor(left/60000),s=Math.floor(left%60000/1000);el.textContent=`${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`;el.classList.toggle("low",left<60000);} if(left<=0){T.clear();onEnd();}};
  tick(); T.every(tick,1000);
}

/* ---------- listening ---------- */
function runListening(U,sec,tier){
  setNav({uid:U.id,sid:sec.id,tab:"task"});
  const cfg=sec.tiers[tier];
  const tracks=cfg.tracks.map(id=>Object.assign({id},sec.tracks[id]));
  const groups=[]; tracks.forEach(t=>t.groups.forEach(g=>groups.push(Object.assign({},g,{track:t.id}))));
  const Q=makeQuiz(groups,{tier,mode:"exam",shuffle:false,reduce:false,hints:false});
  const firstOf={}; Q.groups.forEach((g,i)=>{ if(firstOf[g.track]===undefined) firstOf[g.track]=i; });
  const noVoice=!TTS.ok();
  let body="";
  Q.groups.forEach((g,i)=>{
    if(firstOf[g.track]===i){ const t=tracks.find(x=>x.id===g.track);
      body+=`<div class="player" id="pl-${t.id}"><div class="row between"><div class="stack" style="gap:2px"><span class="label">Recording</span><h3>${esc(t.title)}</h3></div><span class="chip" id="left-${t.id}">${cfg.plays} play${cfg.plays>1?"s":""}</span></div>
        <div class="prog"><i id="bar-${t.id}"></i></div><div class="speaking-now" id="now-${t.id}">${noVoice?"Your browser can’t play speech. Use the transcript below.":"Press play when you’re ready. Read the questions first."}</div>
        <div class="row"><button class="btn primary small" data-play="${t.id}" ${noVoice?"disabled":""}>Play</button>${cfg.pause?`<button class="btn small ghost" data-pause="${t.id}" disabled>Pause</button>`:""}</div>
        ${noVoice?`<details class="more"><summary>Transcript</summary><div class="script">${t.segments.map(s=>`<p><b>${esc((t.speakers[s.s]||{}).name||s.s)}</b>${esc(s.t)}</p>`).join("")}</div></details>`:""}
        ${t.audio?`<audio id="au-${t.id}" src="${esc(t.audio)}" preload="auto"></audio>`:""}</div>`; }
    body+=groupHTML(Q,g,g.items[0].n,g.items[g.items.length-1].n);
  });
  app.innerHTML=`<div class="wrap narrow stack" style="gap:24px">
    <div class="row between"><span class="label">${esc(U.title)} · Listening · ${tier}</span><button class="link small" id="leave">Leave</button></div>
    <h1>${esc(sec.title)}</h1>
    <p class="small muted">${cfg.plays===1?"You can play each recording once, as in the exam.":`You can play each recording ${cfg.plays} times.`} Speed: ${Math.round(cfg.rate*100)}%. Answers are checked at the end.</p>
    <div class="qcol" id="qz">${body}</div>
    <div class="row between"><span class="small muted" id="cnt"></span><button class="btn primary" id="fin">Finish and see results</button></div>
  </div>`;
  const P={};
  tracks.forEach(t=>{
    const voices=TTS.cast(t.speakers);
    const lines=[]; t.segments.forEach((s,si)=>TTS.split(s.t).forEach((x,k,arr)=>lines.push({text:x,voice:voices[s.s],seg:si,pause:k===arr.length-1?550:200})));
    P[t.id]={left:cfg.plays,pos:0,ctl:null,playing:false,lines};
  });
  const ui=id=>{ const p=P[id], t=tracks.find(x=>x.id===id);
    const pb=$(`[data-play="${id}"]`), pz=$(`[data-pause="${id}"]`);
    $("#left-"+id).textContent=`${p.left} play${p.left===1?"":"s"} left`;
    if(pb){ pb.disabled=p.playing||(p.left<=0&&p.pos===0); pb.textContent=p.pos>0&&!p.playing?"Resume":"Play"; }
    if(pz) pz.disabled=!p.playing;
  };
  const playTrack=id=>{
    const p=P[id], t=tracks.find(x=>x.id===id);
    Object.keys(P).forEach(k=>{ if(k!==id&&P[k].playing){ P[k].ctl&&P[k].ctl.stop(); P[k].playing=false; ui(k);} });
    const au=t.audio&&$("#au-"+id);
    if(p.pos===0){ if(p.left<=0) return; p.left--; }
    p.playing=true; ui(id);
    if(au){ au.playbackRate=cfg.rate; au.play(); au.ontimeupdate=()=>{$("#bar-"+id).style.width=(au.currentTime/(au.duration||1)*100)+"%";}; au.onended=()=>{p.playing=false;p.pos=0;au.currentTime=0;ui(id);$("#now-"+id).textContent="Finished.";}; p.ctl={stop(){au.pause();}}; p.au=au; return; }
    p.ctl=TTS.run(p.lines,cfg.rate,p.pos,(i,ln)=>{ p.pos=i; $("#bar-"+id).style.width=(i/p.lines.length*100)+"%"; const sp=t.speakers[t.segments[ln.seg].s]; $("#now-"+id).textContent=(sp&&sp.name&&Object.keys(t.speakers).length>1)?sp.name+" is speaking":"Playing"; },
      ok=>{ p.playing=false; p.pos=0; $("#bar-"+id).style.width="100%"; $("#now-"+id).textContent=ok?"Finished.":"Speech stopped."; ui(id); });
  };
  $("#qz").addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b) return;
    if(b.dataset.play) playTrack(b.dataset.play);
    if(b.dataset.pause){ const p=P[b.dataset.pause]; if(p.au){p.au.pause();} else if(p.ctl){ const i=p.ctl.index; p.ctl.stop(); p.pos=i; } p.playing=false; $("#now-"+b.dataset.pause).textContent="Paused."; ui(b.dataset.pause); }
  });
  tracks.forEach(t=>ui(t.id));
  const upd=()=>{$("#cnt").textContent=`${answered(Q)}/${Q.qs.length} answered`;}; Q.onChange=upd; upd();
  bindQuiz(Q,$("#qz"));
  $("#leave").onclick=()=>go(viewUnit,U.id);
  $("#fin").onclick=()=>{
    const res=scoreQuiz(Q); record(U.id,sec.id,tier,res.pct,"exam"); const msg=adapt("listening",tier,res.pct);
    const extra=`<details class="more"><summary>Transcripts</summary><div class="stack">${tracks.map(t=>`<div class="stack tight"><strong>${esc(t.title)}</strong><div class="script">${t.segments.map(s=>`<p><b>${esc((t.speakers[s.s]||{}).name||s.s)}</b>${esc(s.t)}</p>`).join("")}</div></div>`).join("")}</div></details>`;
    go(viewResult,{U,sec,tier,res,msg,extra});
  };
}

function trendSVG(c){
  const W=320,H=150,L=12,R=12,T=26,B=14, n=c.points.length;
  const max=Math.max(...c.points), min=Math.min(...c.points);
  const x=i=>L+i*(W-L-R)/(n-1), y=v=>T+(H-T-B)*(1-(v-min)/((max-min)||1));
  const cl=(v,a,b)=>Math.max(a,Math.min(b,v));
  let g=`<polyline class="tr-base" points="${c.points.map((v,i)=>x(i)+","+y(v)).join(" ")}"/>`;
  c.segs.forEach((s,k)=>{
    const pts=c.points.slice(s.from,s.to+1).map((v,j)=>x(s.from+j)+","+y(v)).join(" ");
    g+=`<polyline class="tr-seg t${k%4}" points="${pts}"/>`;
    const y1=y(c.points[s.from]), y2=y(c.points[s.to]);
    const mx=cl((x(s.from)+x(s.to))/2,48,W-48), above=k%2===0;
    const ly=cl(above?Math.min(y1,y2)-8:Math.max(y1,y2)+15,11,H-2);
    g+=`<text class="tr-lab t${k%4}" x="${mx}" y="${ly}" text-anchor="middle">${esc(s.t)}</text>`;
  });
  return `<svg class="v-trend" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.segs.map(s=>s.t).join(", "))}">${g}</svg>`;
}

    else g+=`<line class="tl-span" x1="${x(m.from)}" x2="${W-R-10}" y1="94" y2="94"/><path class="tl-arrow" d="M${W-R-12},87 L${W-R},94 L${W-R-12},101 Z"/><text class="tl-c acc" x="${x(m.from)}" y="86">${esc(m.c||"")}</text><text class="tl-l" x="${(x(m.from)+W-R)/2}" y="116" text-anchor="middle">${esc(m.t)}</text>`;
  });
  return `<svg class="v-tl" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(c.marks.map(m=>m.t).join("; "))}">${g}</svg>`;

function tipHTML(c,U){ const f=TIPV[c.v]; return `<article class="tip tip-${esc(c.v)}"><div class="stack tight"><h3>${esc(c.title)}</h3>${c.say?`<p class="tip-say">${esc(c.say)}</p>`:""}</div>${f?f(c,U):""}</article>`; }
function deckHTML(cards,U,doneLabel){
  return `<div class="deck" tabindex="-1"><div class="deck-top"><span class="label">Tip <b class="dk-n">1</b> of ${cards.length}</span><div class="dots" role="tablist">${cards.map((c,i)=>`<button type="button" class="dot ${i?"":"on"}" data-dot="${i}" aria-label="${esc(c.title)}" title="${esc(c.title)}"></button>`).join("")}</div></div>
    <div class="deck-stage">${cards.map((c,i)=>`<div class="deck-card" data-k="${i}" ${i?"hidden":""}>${tipHTML(c,U)}</div>`).join("")}</div>
    <div class="deck-nav"><button type="button" class="btn ghost dk-prev" disabled>← Previous</button><button type="button" class="btn primary dk-next">${cards.length>1?"Next tip →":esc(doneLabel)}</button></div></div>`;
}
function bindDeck(root,n,doneLabel,onDone){
  const deck=$(".deck",root); if(!deck) return; let i=0;
  const show=k=>{ i=Math.max(0,Math.min(n-1,k)); $$(".deck-card",deck).forEach(c=>c.hidden=+c.dataset.k!==i); $$(".dot",deck).forEach(d=>d.classList.toggle("on",+d.dataset.dot===i)); $(".dk-n",deck).textContent=i+1; $(".dk-prev",deck).disabled=i===0; $(".dk-next",deck).textContent=i===n-1?doneLabel:"Next tip →"; };
  $(".dk-prev",deck).onclick=()=>show(i-1);
  $(".dk-next",deck).onclick=()=>{ if(i===n-1) onDone(); else { show(i+1); deck.scrollIntoView({block:"nearest",behavior:"smooth"}); } };
  $$(".dot",deck).forEach(d=>d.onclick=()=>show(+d.dataset.dot));
  deck.addEventListener("keydown",e=>{ if(e.key==="ArrowRight") show(i+1); if(e.key==="ArrowLeft") show(i-1); });
  let x0=null; deck.addEventListener("touchstart",e=>{x0=e.touches[0].clientX;},{passive:true}); deck.addEventListener("touchend",e=>{ if(x0===null) return; const dx=e.changedTouches[0].clientX-x0; if(Math.abs(dx)>60&&!e.target.closest("button,input,select,textarea")) show(i+(dx<0?1:-1)); x0=null; });
  bindTips(deck);
}
function bindTips(root){
  $$("[data-demo]",root).forEach(b=>b.onclick=()=>{
    const d=b.closest(".tip").querySelector(".v-demo"), ms=$$("mark",d);
    d.classList.add("anim"); ms.forEach(m=>m.classList.remove("lit"));
    ms.forEach((m,i)=>T.later(()=>m.classList.add("lit"),500+i*800));
    T.later(()=>d.classList.remove("anim"),900+ms.length*800);
  });
}

/* ---------- charts for Writing Task 1 ---------- */
const niceStep=v=>{ const p=Math.pow(10,Math.floor(Math.log10(v||1))), n=v/p; return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*p; };
function chartSVG(ch){
  if(!ch) return "";
  let g="", W=560, H;
  if(ch.type==="line"){
    H=300; const L=ch.ylab?60:44,R=92,T=16,B=40, pw=W-L-R, ph=H-T-B;
    const max=Math.max(...ch.series.flatMap(s=>s.v)), step=niceStep(max/5), top=Math.ceil(max/step)*step||10, nt=Math.round(top/step);
    const x=i=>L+(ch.x.length>1?i*pw/(ch.x.length-1):pw/2), y=v=>T+ph-(v/top)*ph;
    for(let k=0;k<=nt;k++){ const v=+(k*step).toFixed(6), yy=y(v); g+=`<line class="gl" x1="${L}" x2="${L+pw}" y1="${yy}" y2="${yy}"/><text class="ax" x="${L-6}" y="${yy+4}" text-anchor="end">${v}${ch.unit==="%"?"%":""}</text>`; }
    ch.x.forEach((t,i)=>g+=`<text class="ax" x="${x(i)}" y="${T+ph+20}" text-anchor="middle">${esc(t)}</text>`);
    const dash=["","7 5","2 5","10 4 2 4"]; if(ch.ylab) g+=`<text class="ylab" x="12" y="${T+ph/2}" transform="rotate(-90 12 ${T+ph/2})" text-anchor="middle">${esc(ch.ylab)}</text>`;
    ch.series.forEach((s,i)=>{ g+=`<polyline class="ln s${i}" points="${s.v.map((v,j)=>x(j)+","+y(v)).join(" ")}" stroke-dasharray="${dash[i%4]}"/>`; s.v.forEach((v,j)=>g+=`<circle class="s${i}" cx="${x(j)}" cy="${y(v)}" r="3.5"/>`); });
    const ends=ch.series.map((s,i)=>({i,y:y(s.v[s.v.length-1]),name:s.name})).sort((a,b)=>a.y-b.y);
    for(let k=1;k<ends.length;k++) if(ends[k].y-ends[k-1].y<15) ends[k].y=ends[k-1].y+15;
    ends.forEach(e=>g+=`<text class="lab s${e.i}" x="${L+pw+10}" y="${e.y+4}">${esc(e.name)}</text>`);
  } else {
    const rowH=46, L=158, R=40, T=8, n=ch.cats.length; H=T+n*rowH+44; const pw=W-L-R;
    const max=Math.max(...ch.series.flatMap(s=>s.v)), top=Math.ceil(max/5)*5, xs=v=>L+v/top*pw;
    for(let k=0;k<=top;k+=5) g+=`<line class="gl" x1="${xs(k)}" x2="${xs(k)}" y1="${T}" y2="${T+n*rowH}"/><text class="ax" x="${xs(k)}" y="${T+n*rowH+14}" text-anchor="middle">${k}</text>`;
    ch.cats.forEach((c,ci)=>{ const y0=T+ci*rowH, bh=(rowH-14)/ch.series.length; g+=`<text class="cat" x="${L-8}" y="${y0+rowH/2+4}" text-anchor="end">${esc(c)}</text>`;
      ch.series.forEach((s,si)=>{ const yy=y0+7+si*bh; g+=`<rect class="b${si}" x="${L}" y="${yy}" width="${Math.max(1,xs(s.v[ci])-L)}" height="${bh-3}" rx="2"/><text class="val" x="${xs(s.v[ci])+5}" y="${yy+bh/2+2}">${s.v[ci]}</text>`; }); });
    ch.series.forEach((s,si)=>g+=`<rect class="b${si}" x="${L+si*96}" y="${H-16}" width="12" height="12" rx="2"/><text class="ax" x="${L+si*96+18}" y="${H-6}">${esc(s.name)}</text>`);
    if(ch.unit) g+=`<text class="ax" x="${L-8}" y="${H-6}" text-anchor="end">${esc(ch.unit)}</text>`;
  }
  return `<figure class="chart"><figcaption class="label">${esc(ch.title)}</figcaption><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(ch.title)}">${g}</svg>${ch.note?`<p class="small muted">${esc(ch.note)}</p>`:""}${credit()}</figure>`;
}

const DRILL_KIND={skim:"Skimming",scan:"Scanning race",find:"Word hunt",keywords:"Keywords",order:"Build it",quiz:"Practice",match:"Match",write:"Write & check"};
function drillBest(uid,sid,did){ const r=S.results[uid+":"+sid+":"+did]; return r&&r.length?Math.max(...r.map(x=>x.pct)):null; }
const taskLabel=sec=>sec.type==="speaking"?(sec.part?"Part "+sec.part+" exam practice":"Full test"):sec.type==="vocab"?"Flashcards":"Exam task";
const taskWord=sec=>{ const t=taskLabel(sec); return /^Part/.test(t)?t:t.toLowerCase(); };
/* stages: sec.stages = [{id,title,goal,material:{paras|chart},tasks:[…]}]; old units with a flat sec.train are grouped by d.group */
function stagesOf(sec){
  if(Array.isArray(sec.stages)&&sec.stages.length) return sec.stages.filter(s=>(s.tasks||[]).length);
  const out=[]; (sec.train||[]).forEach(d=>{ const g=d.group||"Training"; let s=out.find(x=>x.title===g); if(!s){ s={id:"g"+out.length,title:g,tasks:[]}; out.push(s); } s.tasks.push(d); });
  return out;
}
function stageStats(uid,sid,st){ const b=st.tasks.filter(d=>!UNSCORED[d.kind]).map(d=>drillBest(uid,sid,d.id)).filter(x=>x!==null); return {done:b.length,n:st.tasks.filter(d=>!UNSCORED[d.kind]).length,avg:b.length?Math.round(b.reduce((a,x)=>a+x,0)/b.length):null}; }
function trainCount(uid,s){ const t=stagesOf(s).flatMap(x=>x.tasks).filter(d=>!UNSCORED[d.kind]); return {n:t.length,done:t.filter(d=>drillBest(uid,s.id,d.id)!==null).length}; }
function matLabel(sec,st){ const m=st.material; if(!m) return ""; if(m.chart) return "graph pinned"; if(m.img) return "picture pinned"; const t=typeof m.paras==="string"&&m.paras.startsWith("tier:")&&sec.tiers&&sec.tiers[m.paras.slice(5)]; return t&&t.title?`text: ${t.title}`:"text pinned"; }

function mkCtx(U,sec,st,d,root,i){

function bindNotepad(np,uid){

  let deb; const persist=()=>{ clearTimeout(deb); deb=setTimeout(()=>{ try{ localStorage.setItem(key,JSON.stringify({html:text.innerHTML,img})); }catch(e){} },400); };

function markText(text,matches){
  if(!matches||!matches.length) return esc(text);
  const ms=matches.slice().sort((a,b)=>a.offset-b.offset); let out="",pos=0;
  ms.forEach(m=>{ if(m.offset<pos) return; out+=esc(text.slice(pos,m.offset)); const cls=m.kind==="spelling"?"sp":m.kind==="style"?"st":""; out+=`<mark class="${cls}" title="${esc(m.message)}${m.replacements&&m.replacements.length?" → "+esc(m.replacements.slice(0,3).map(r=>r.value).join(" / ")):""}">${esc(text.substr(m.offset,m.length))}</mark>`; pos=m.offset+m.length; });
  return out+esc(text.slice(pos));
}

    <div class="score"><div class="big">${A.overall}</div><div class="stack tight"><span class="label">${esc(U.title)} · Writing Task ${task1?1:2} · ${tier} · CEFR estimate</span><h2>Indicative IELTS ${BAND[A.overall]}</h2><p class="muted">Your next writing tasks will be at ${S.tier.writing}.${before&&before!==A.overall?` (Before: ${before})`:""} This is an automatic estimate. Your teacher’s feedback counts more.</p></div></div>
    ${ltErr?`<p class="note warn">The grammar and spelling service didn’t respond (${esc(ltErr.message||"offline")}), so accuracy wasn’t measured. Try again later for a full check.</p>`:""}
    <section class="crit">${CRIT.map(([k,n])=>`<div class="card"><div class="row between"><strong>${n}</strong><span class="chip ${li(A.levels[k])>=2?"lv":""}">${A.levels[k]}</span></div><ul>${A.reasons[k].map(r=>`<li>${esc(r)}</li>`).join("")}</ul>${A.tips[k].length?`<div class="stack tight"><span class="label">To improve</span><ul>${A.tips[k].map(r=>`<li>${esc(r)}</li>`).join("")}</ul></div>`:""}</div>`).join("")}</section>
    ${A.vocab&&(A.vocab.used.length+A.vocab.unused.length)?`<section class="card stack tight"><div class="row between"><strong>Active vocabulary</strong><span class="chip ${A.vocab.used.length>=5?"good":A.vocab.used.length>=3?"lv":"warn"}">${A.vocab.used.length}/${A.vocab.used.length+A.vocab.unused.length} used</span></div>${A.vocab.used.length?`<div class="ideas">${A.vocab.used.map(w=>`<span style="border-color:var(--good);color:var(--good)">✓ ${esc(w.word)}</span>`).join("")}</div>`:""}${A.vocab.unused.length?`<p class="small muted">Try next time: ${A.vocab.unused.slice(0,8).map(w=>esc(w.word)).join(", ")}</p>`:""}</section>`:""}
    ${A.alerts&&A.alerts.length?`<section class="stack tight"><span class="label">Style alerts</span>${A.alerts.map(x=>`<details class="more"><summary>“${esc(x.a.nope)}” · ${x.n} time${x.n>1?"s":""}</summary>${memeHTML(x.a,false)}</details>`).join("")}</section>`:""}
    <section class="stack"><div class="row between"><span class="label">Your answer${A.lt?` · ${issues.length} issue${issues.length===1?"":"s"} marked`:""}</span>${A.lt?`<span class="small muted"><mark style="background:var(--bad-soft);border-bottom:2px solid var(--bad)">grammar</mark> <mark style="background:var(--warn-soft);border-bottom:2px solid var(--warn)">spelling</mark> <span style="border-bottom:2px dotted var(--muted)">style</span></span>`:""}</div><div class="marked">${markText(text,A.lt&&A.lt.matches)}</div></section>
    ${issues.length?`<section class="stack tight issues"><span class="label">Corrections from LanguageTool</span>${issues.slice(0,30).map(m=>`<div class="issue"><span><b>${esc(text.substr(m.offset,m.length))}</b>${m.replacements&&m.replacements.length?` → <b style="color:var(--good)">${esc(m.replacements.slice(0,3).map(r=>r.value).join(" / "))}</b>`:""}</span><span class="muted">${esc(m.message)}</span></div>`).join("")}</section>`:""}
    <div class="row"><button class="btn primary" id="revise">Revise my answer</button><button class="btn" id="toUnit">Back to the unit</button></div>
    ${model?`<details class="more"><summary>Model answer</summary><p class="model">${esc(fp(model))}</p>${credit()}</details>`:""}
  </div>`;
  $("#revise").onclick=()=>go(runWriting,U,sec,tier);
  $("#toUnit").onclick=()=>go(viewUnit,U.id);
}

/* =========================================================
   SEND PROGRESS · SETTINGS
   ========================================================= */
async function progressCode(){
  const words={}; for(const [k,v] of Object.entries(S.words)) words[k]=v.stage;
  const qt={}; for(const [k,v] of Object.entries(S.qtypes)){ const a=v.slice(-10); qt[k]=a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length*100):null; }
  const data={v:1,code:S.code,at:Date.now(),placement:S.placement,profile:S.profile,tier:S.tier,results:S.results,checks:S.checks,cando:S.cando,essays:S.essays.slice(-6),speaking:S.speaking.slice(-6),words,qtypes:qt};
  const json=JSON.stringify(data);
  if(window.CompressionStream){ try{ const buf=await new Response(new Blob([json]).stream().pipeThrough(new CompressionStream("deflate-raw"))).arrayBuffer(); return "IL1."+b64url(new Uint8Array(buf)); }catch(e){} }
  return "IL0."+b64url(enc.encode(json));
}
async function viewSend(){
  app.innerHTML=`<div class="wrap narrow stack" style="gap:22px">
    <span class="label">Send progress</span><h1>Share your progress</h1>
    <p class="prose">This code contains your scores, levels and essays. It doesn’t include your name. Copy it and send it to ${esc(CONFIG.teacherName||"your teacher")}${CONFIG.teacherContact?` (${esc(CONFIG.teacherContact)})`:""} in a message.${SYNC.url()?" Your teacher also receives your progress automatically, so this is only a backup.":""}</p>
    <textarea id="pcode" rows="6" readonly style="font-family:var(--mono);font-size:12px" aria-label="Your progress code">Preparing…</textarea>
    <div class="row"><button class="btn primary" id="copy">Copy code</button><span class="small muted" id="cmsg" role="status"></span></div>
  </div>`;
  const code=await progressCode(); $("#pcode").value=code;
  $("#copy").onclick=()=>{ const ta=$("#pcode"); const fall=()=>{ta.focus();ta.select();$("#cmsg").textContent="Select all and copy.";};
    try{ navigator.clipboard.writeText(code).then(()=>{$("#cmsg").textContent="Copied. Paste it into your message.";},fall); }catch(e){ fall(); } };
}
function viewSettings(){
  app.innerHTML=`<div class="wrap narrow stack" style="gap:24px">
    <span class="label">Settings</span><h1>Settings</h1>
    <div class="stack tight"><label for="acc"><strong>Voice accent for listening</strong></label><select id="acc" style="max-width:320px"><option value="en-GB">British English</option><option value="en-US">American English</option><option value="en-AU">Australian English</option><option value="any">Mixed (as written in the unit)</option></select><span class="small muted">Voices come from your device, so quality varies. Chrome and Safari usually have the best voices.</span></div>
    <div class="stack tight"><label for="spd"><strong>Speech speed</strong> <span class="muted" id="spdv"></span></label><input type="range" id="spd" min="0.8" max="1.15" step="0.05" style="max-width:320px"><div class="row"><button class="btn small ghost" id="testV">Test voice</button></div></div>
    <div class="stack tight"><strong>Placement</strong><p class="small muted">Retake the placement test to reset your starting levels. Your other results stay.</p><div class="row"><button class="btn small" id="retake">Retake placement</button></div></div>
    ${SYNC.on()?`<div class="stack tight"><strong>Sync with your teacher</strong><p class="small" id="syncMsg" role="status">${SYNC.err?esc(SYNC.err):S.synced?`Last sent ${esc(fmtDate(S.synced))}, ${esc(new Date(S.synced).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}))}.`:"Not sent yet."}</p><div class="row"><button class="btn small" id="syncNow">Send now</button></div></div>`:""}
    <div class="stack tight"><strong>Access code</strong><p class="small">Signed in with <span style="font-family:var(--mono)">${esc(fmtCode(S.code||""))}</span>${BUNDLE.label?` · licensed to ${esc(BUNDLE.label)}`:""}${BUNDLE.exp?` · access until <b>${esc(fmtLong(BUNDLE.exp))}</b>`:""}</p><p class="small muted">${SYNC.url()?`Your progress is sent to your teacher automatically${S.synced?` (last sent ${esc(fmtDate(S.synced))}, ${esc(new Date(S.synced).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"}))})`:""}. Removing the course clears it from this device only; enter the same code again to bring it back.`:"Removing the course deletes all progress on this device. Send your progress to your teacher first."}</p><div class="row"><button class="btn small danger" id="out">Remove course from this device</button></div></div>
  </div>`;
  $("#acc").value=S.settings.accent||"en-GB";
  $("#acc").onchange=e=>{S.settings.accent=e.target.value;save();};
  $("#spd").value=S.settings.speed||1; $("#spdv").textContent=Math.round((S.settings.speed||1)*100)+"%";
  $("#spd").oninput=e=>{S.settings.speed=Number(e.target.value);$("#spdv").textContent=Math.round(S.settings.speed*100)+"%";save();};
  $("#testV").onclick=()=>TTS.say("Over the last twenty years, the way we live has changed dramatically.","en-GB","female");
  $("#retake").onclick=()=>go(viewPlacementIntro);
  if($("#syncNow")) $("#syncNow").onclick=async e=>{ const b=e.currentTarget; b.disabled=true; b.textContent="Sending…"; clearTimeout(SYNC.timer); SYNC.timer=null; while(SYNC.busy) await new Promise(r=>setTimeout(r,200)); const ok=await SYNC.push(); if(!b.isConnected) return; b.disabled=false; b.textContent="Send now"; $("#syncMsg").textContent=ok?"Sent just now. Check your sheet.":SYNC.err; };
  $("#out").onclick=e=>{ const b=e.currentTarget; if(b.dataset.armed){ try{localStorage.removeItem(SKEY);}catch(x){} location.reload(); } else { b.dataset.armed="1"; b.classList.add("armed"); b.textContent="Tap again to remove"; T.later(()=>{ if(b.isConnected){ delete b.dataset.armed; b.classList.remove("armed"); b.textContent="Remove course from this device"; } },3500); } };
}

boot();
</script>
